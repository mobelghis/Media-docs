<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retail Media Report Builder</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111820; --i2:#41505F; --i3:#78899A; --paper:#EFF1EF; --card:#fff;
  --rule:#D3D8D6; --r2:#E5E9E7; --teal:#0F6E5C; --tealw:#E4EFEC;
  --purple:#463BA0; --purplew:#E8E6F4; --amber:#A8741A; --amberw:#F6EEDD; --alert:#A33A2A;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 'IBM Plex Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.v,.mono,.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.lbl{font-family:'IBM Plex Sans Condensed',sans-serif;text-transform:uppercase;letter-spacing:.09em;font-weight:600;font-size:11px;color:var(--i3)}
h1,h2,h3{font-family:'IBM Plex Sans Condensed',sans-serif;margin:0;letter-spacing:-.005em}
.grow{flex-grow:1}
.note{font-size:11.5px;color:var(--i3);line-height:1.55;margin:0}
.note.tight{margin:4px 0 8px}
.empty{padding:26px;text-align:center;color:var(--i3);font-size:13px;background:var(--card);border:1px dashed var(--rule)}
.sep{height:1px;background:var(--r2);margin:14px 0}
.pad{padding:0 12px 8px}.pad6{padding-top:6px}.pad40{padding:40px}

/* ---------- header ---------- */
.top{background:var(--ink);color:#DDE3E4;position:sticky;top:0;z-index:20}
.topin{display:flex;gap:15px;align-items:center;padding:10px 22px;flex-wrap:wrap}
.mk{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:#fff}
.mk span{color:var(--i3)}
.pk{display:flex;gap:7px;align-items:baseline;border-left:1px solid #2C3742;padding-left:14px}
.pk b{font-size:13px;color:#fff;font-weight:600}
.pk .lbl{color:#7C8C99}
.pk select{background:#1E2A36;color:#fff;border:1px solid #33414F;height:28px;padding:0 6px;font-size:12.5px}
.sy{font-size:11.5px;color:#8E9DA8;display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:#3FA97F}
.steps{background:#1A242E;display:flex;align-items:center;gap:2px;padding:0 22px;border-top:1px solid #26323D;overflow-x:auto}
.steps button{background:0;border:0;color:#94A4B1;font-family:'IBM Plex Sans Condensed',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-size:12px;padding:11px 14px;cursor:pointer;border-bottom:2px solid transparent;display:flex;gap:7px;align-items:center}
.steps button:hover{color:#fff}
.steps button.on{color:#fff;border-bottom-color:var(--amber)}
.steps .cnt{font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#2A3744;padding:1px 5px;letter-spacing:0}
.steps button.on .cnt{background:var(--amber);color:#fff}
.hint{font-size:11.5px;color:#8E9DA8;padding:0 2px}

/* ---------- layout ---------- */
.three{display:grid;grid-template-columns:216px minmax(0,1fr) 300px;align-items:start}
.three.b{grid-template-columns:184px minmax(0,1fr) 316px}
.rail,.tray,.panel,.strip{background:var(--card);min-height:calc(100vh - 92px);padding:16px 12px;display:flex;flex-direction:column;gap:3px}
.rail,.strip{border-right:1px solid var(--rule);max-width:100%}
.tray,.panel{border-left:1px solid var(--rule);gap:10px;position:sticky;top:92px;max-height:calc(100vh - 92px);overflow:auto}
.mid{padding:20px 22px 48px;min-width:0}
.mhead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:16px}
.mhead.tight{align-items:center;margin-bottom:12px}
.mhead h1{font-size:24px}
.mhead h1.h2,.h2{font-size:21px}
.mhead p{margin:4px 0 0;color:var(--i2);font-size:13.5px;max-width:72ch}
.mhead input[type=search]{height:34px;border:1px solid var(--rule);padding:0 11px;width:230px;background:#fff;flex-shrink:0}
.btnrow{display:flex;gap:7px;align-items:center;flex-shrink:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(336px,1fr));gap:14px}

/* ---------- buttons, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;border:1px solid var(--rule);background:#fff;font-family:'IBM Plex Sans Condensed',sans-serif;text-transform:uppercase;letter-spacing:.07em;font-weight:600;font-size:11.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:#22303D}
.btn.add{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.in{background:var(--tealw);border-color:var(--teal);color:var(--teal)}
.btn.del{color:var(--alert)}
.btn.sm{height:28px;padding:0 9px;font-size:10.5px}
.btn.wide{width:100%}
.ico{width:22px;height:22px;border:0;background:0;color:var(--i3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.ico:hover{color:var(--ink)}
.ico.del:hover{color:var(--alert)}
.p{font-family:'IBM Plex Sans Condensed',sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:2px 7px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.p.meas{background:var(--tealw);color:var(--teal)}
.p.part{background:var(--amberw);color:#8A5E10}
.p.lock{background:var(--paper);color:var(--i3);border:1px dashed #B9BFC4}
.p.kpi{background:var(--paper);color:var(--i2);font-family:'IBM Plex Mono',monospace;text-transform:none;letter-spacing:0;font-size:10px;font-weight:400;padding:1px 5px}
.chips{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.ck{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--i2);cursor:pointer;padding:0 12px}
.ck input{accent-color:var(--teal);width:15px;height:15px;margin:0}
.warnpill{font-size:10px;color:#8A5E10;background:var(--amberw);padding:1px 5px}

/* ---------- rail ---------- */
.rail button{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border:0;background:0;cursor:pointer;font-family:'IBM Plex Sans Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-size:11.5px;color:var(--i2);text-align:left;width:100%}
.rail button:hover{background:var(--paper)}
.rail button.on{background:var(--ink);color:#fff}
.rail .v{font-family:'IBM Plex Mono',monospace;opacity:.55;font-size:10.5px}

/* ---------- question cards ---------- */
.qcard{background:var(--card);border:1px solid var(--rule);display:flex;flex-direction:column}
.qcard:hover{border-color:var(--i3)}
.qcard.off{opacity:.72;background:#F8F9F8}
.qh{padding:12px 14px 10px;border-bottom:1px solid var(--r2)}
.qhr{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.qh h3{font-size:15.5px;line-height:1.25}
.qh .lbl{margin-top:4px;display:block}
.qb{padding:12px 14px;flex-grow:1;display:flex;align-items:center}
.qb>*{width:100%}
.qf{padding:9px 14px;border-top:1px solid var(--r2);display:flex;justify-content:space-between;align-items:center;gap:8px;background:#FAFBFA}
.unav{display:flex;gap:10px;align-items:flex-start;font-size:11.5px;color:var(--i2);background:var(--paper);padding:12px;border:1px dashed var(--rule)}
.unav b{display:block;color:var(--ink);font-size:12.5px;margin-bottom:2px}
.unav.big{padding:28px;font-size:13px;align-items:center;margin:auto}

/* ---------- tray ---------- */
.trayname{font-family:'IBM Plex Sans Condensed',sans-serif;font-size:17px;font-weight:700;margin-top:-4px}
.traymeta{font-size:11.5px;color:var(--i3);margin-top:-6px}
.trows{display:flex;flex-direction:column;border-top:1px solid var(--r2)}
.trow{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--r2);font-size:12px}
.trow.off{opacity:.6}
.trow .num{font-family:'IBM Plex Mono',monospace;color:var(--i3);width:15px;flex-shrink:0;font-size:10.5px}
.trow .tt{flex-grow:1;line-height:1.35}

/* ---------- slide strip ---------- */
.striphead{display:flex;justify-content:space-between;align-items:center;padding:0 2px 6px}
.strip{gap:6px}
.thumb{display:grid;grid-template-columns:14px 1fr;grid-template-rows:auto auto;gap:1px 7px;background:#fff;border:1px solid var(--rule);padding:7px 8px;cursor:pointer;text-align:left;font:inherit}
.thumb:hover{border-color:var(--i3)}
.thumb.on{border:2px solid var(--amber);background:#FDFBF6}
.thumb.off{opacity:.55}
.thumb .n{grid-row:1/3;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--i3)}
.thumb .tn{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:12px;line-height:1.2}
.thumb .tc{font-size:10px;color:var(--i3)}

/* ---------- slide ---------- */
.slide{background:#fff;border:1px solid var(--rule);padding:22px 26px;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(17,24,32,.05)}
.slide.edit{padding:26px 30px;box-shadow:0 2px 12px rgba(17,24,32,.08)}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px}
.sh h2{font-size:19px}
.slide.edit .sh h2{font-size:22px}
.cols{display:grid;grid-template-columns:minmax(220px,.8fr) minmax(0,1.3fr);gap:24px;align-items:start;flex-grow:1}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:24px;flex-grow:1}
.stack{display:flex;flex-direction:column;gap:16px;flex-grow:1}
.chartwrap{min-width:0}
.chartwrap.full{flex-grow:1;display:flex;align-items:center}
.src{font-size:9px;color:#8E9DA8;border-top:1px solid var(--r2);padding-top:7px;margin-top:16px;line-height:1.45}
.ins{font-size:13.5px;line-height:1.6;color:var(--i2)}
.ins b{color:var(--ink);font-weight:600}
.ins.ph{color:#9AA7B2;font-style:italic}
.slide.edit .ins{font-size:14.5px}
.wordbox{border:2px solid var(--teal);background:#F7FBFA;padding:13px 15px;position:relative}
.wordbox.ro{border:0;background:0;padding:0}
.wbl{position:absolute;top:-9px;left:9px;background:#F7FBFA;padding:0 5px;font-family:'IBM Plex Sans Condensed',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-size:10px;color:var(--teal)}
.wtools{display:flex;gap:6px;margin-top:11px;border-top:1px solid #D7E6E2;padding-top:9px}
.ins[contenteditable]:focus{outline:none;background:#fff;box-shadow:0 0 0 2px #B6D8D1}
.cover{justify-content:space-between;min-height:300px}
.cover .big{font-size:34px;margin-top:10px;line-height:1.1}
.covmeta{font-size:13px;color:var(--i2);margin-top:14px;line-height:1.6}
.covfoot{display:flex;gap:12px;align-items:center;border-top:1px solid var(--r2);padding-top:12px}
.lockbar{background:var(--card);border:1px solid var(--rule);padding:11px 15px;margin-top:12px;font-size:12.5px;color:var(--i2);display:flex;gap:9px;align-items:center}
.lockbar b{color:var(--ink)}

/* ---------- panel ---------- */
.suggs{display:flex;flex-direction:column;gap:8px}
.sug{border:1px solid var(--rule);background:#fff;padding:10px 11px;font:inherit;font-size:12px;line-height:1.5;color:var(--i2);cursor:pointer;text-align:left;display:block}
.sug:hover{border-color:var(--teal);background:#F7FBFA}
.sug b{color:var(--ink);font-weight:600}
.sug .use{display:block;margin-top:7px;font-family:'IBM Plex Sans Condensed',sans-serif;text-transform:uppercase;letter-spacing:.07em;font-weight:600;font-size:10px;color:var(--teal)}
.opts{display:flex;flex-direction:column;gap:7px;margin-top:7px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--i2)}
.opt select{border:1px solid var(--rule);height:28px;background:#fff;font-size:12px;max-width:170px}

/* ---------- tables in charts ---------- */
.tw{overflow-x:auto;max-width:100%}
table.dt{border-collapse:collapse;width:100%;min-width:430px}
table.dt th{font-family:'IBM Plex Sans Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:10px;font-weight:600;color:var(--i3);background:#F7F8F7;border-bottom:1px solid var(--rule);padding:7px 8px;text-align:left}
table.dt td{padding:7px 8px;border-bottom:1px solid var(--r2);vertical-align:top;line-height:1.45}
table.dt td.n,table.dt th.n{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
table.dt tr.tot{background:#F7F8F7}

/* ---------- deck ---------- */
.deckwrap{padding:20px 26px 48px;max-width:1380px;margin:0 auto}
.deckbar{background:var(--card);border:1px solid var(--rule);padding:15px 19px;display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px;flex-wrap:wrap}
.deckbar .ck{padding:0}
.deck{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:18px}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(17,24,32,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:24px}
.sheet{background:#fff;border:1px solid var(--rule);padding:24px 26px;max-width:620px;width:100%;max-height:84vh;overflow:auto}
.sheet h3{font-size:19px;font-family:'IBM Plex Mono',monospace;font-weight:500}
.sheet .note{margin:8px 0 16px;font-size:12.5px}
.manifest{margin:0;padding-left:20px;font-size:12.5px;color:var(--i2);line-height:1.9}
.manifest b{color:var(--ink)}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--r2);margin-top:18px;padding-top:14px}

/* ---------- responsive ---------- */
@media(max-width:1180px){
  .three,.three.b{grid-template-columns:minmax(0,1fr)}
  .hint{display:none}
  .rail,.strip{flex-direction:row;overflow-x:auto;min-height:0;border-right:0;border-bottom:1px solid var(--rule);position:static;max-height:none}
  .rail button{white-space:nowrap;width:auto}
  .rail .sep,.rail .note,.rail .grow{display:none}
  .tray,.panel{position:static;min-height:0;max-height:none;border-left:0;border-top:1px solid var(--rule)}
  .deck{grid-template-columns:1fr}
}
@media(max-width:700px){
  table.dt{min-width:340px}
  .mid{padding:16px}
  .cols,.cols2{grid-template-columns:1fr}
  .mhead{flex-direction:column;align-items:stretch}
  .mhead input[type=search]{width:100%}
  .deckwrap{padding:16px}
}

/* ---------- print = the deck ---------- */
@media print{
  @page{size:A4 landscape;margin:10mm}
  .top,.rail,.tray,.panel,.strip,.deckbar,.lockbar,.scrim{display:none!important}
  body{background:#fff}
  .deckwrap{padding:0;max-width:none}
  .deck{display:block}
  .slide{border:0;box-shadow:none;page-break-after:always;break-after:page;min-height:160mm;padding:0 0 10mm}
  .wordbox{border:0;background:0;padding:0}
  .wbl{display:none}
  .wtools{display:none}
}
</style>
</head>

/* ------------------------------------------------------------------
   Formatters
------------------------------------------------------------------ */
const F = {
  int: n => n == null ? '—' : Math.round(n).toLocaleString('en-GB'),
  compact: n => {
    if (n == null) return '—';
    if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 1 : 2).replace(/\.0+$/, '') + ' M';
    if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, '') + ' K';
    return Math.round(n).toLocaleString('en-GB');
  },
  money: n => n == null ? '—' : '€' + Math.round(n).toLocaleString('en-GB'),
  moneyC: n => {
    if (n == null) return '—';
    if (n >= 1e6) return '€' + (n / 1e6).toFixed(2).replace(/\.?0+$/, '') + ' M';
    if (n >= 1e3) return '€' + (n / 1e3).toFixed(0) + ' k';
    return '€' + n.toFixed(2);
  },
  money2: n => n == null ? '—' : '€' + n.toFixed(2),
  pct1: n => n == null ? '—' : n.toFixed(1) + '%',
  pct2: n => n == null ? '—' : n.toFixed(2) + '%',
  pct3: n => n == null ? '—' : (n < 1 ? n.toFixed(2) : n.toFixed(1)) + '%',
  pts: n => n == null ? '—' : (n > 0 ? '+' : '') + (Math.abs(n) < 1 ? n.toFixed(2) : n.toFixed(1)) + ' pts',
  x: n => n == null ? '—' : n.toFixed(1) + '×',
  dec: n => n == null ? '—' : n.toFixed(1),
  hours: n => n == null ? '—' : n.toFixed(0) + ' h'
};

/* ------------------------------------------------------------------
   Metrics available on a breakdown chart
------------------------------------------------------------------ */
const METRICS = {
  convRate:     { label: 'Attributed buyer conversion rate', fmt: F.pct3, get: r => r.exposable ? r.buyers / r.exposable * 100 : null },
  sales:        { label: 'Attributed sales',                 fmt: F.moneyC, get: r => r.sales },
  buyers:       { label: 'Attributed buyers',                fmt: F.int,   get: r => r.buyers },
  txns:         { label: 'Attributed transactions',          fmt: F.int,   get: r => r.txns },
  impressions:  { label: 'Impressions',                      fmt: F.compact, get: r => r.impressions },
  clicks:       { label: 'Clicks',                           fmt: F.compact, get: r => r.clicks },
  ctr:          { label: 'Click-through rate',               fmt: F.pct2,  get: r => r.impressions ? r.clicks / r.impressions * 100 : null },
  salesPerBuyer:{ label: 'Attributed sales per buyer',       fmt: F.money2, get: r => r.salesPerBuyer },
  avgTxn:       { label: 'Average attributed transaction',   fmt: F.money2, get: r => r.avgTxn }
};

const short = n => n.replace(/ buyers$/, '').replace(/ · sponsored$/, '').replace(/^Nordmark /, '');

/* ------------------------------------------------------------------
   SVG chart primitives
------------------------------------------------------------------ */
const C = { teal: '#0F6E5C', purple: '#463BA0', amber: '#A8741A', grey: '#B9BFC4', ink: '#111820', faint: '#E5E9E7', mid: '#78899A' };
const PIE = ['#0F6E5C', '#463BA0', '#A8741A', '#7FB5A9', '#9A93C9'];
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function sv(w, h, inner, label) {
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${esc(label || 'chart')}" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;
}
function t(x, y, s, o = {}) {
  const fam = o.cond ? "'IBM Plex Sans Condensed'" : "'IBM Plex Mono'";
  return `<text x="${x}" y="${y}" font-family="${fam}" font-size="${o.size || 10}" fill="${o.fill || C.mid}" text-anchor="${o.anchor || 'start'}" font-weight="${o.weight || 400}">${esc(s)}</text>`;
}

/* grouped actual vs planned */
function chPaired(ctx, w, h) {
  const T = ctx.c.totals, big = h > 200;
  const pairs = [
    { lab: 'Impressions', a: T.impressions, e: T.estImpressions, fa: F.compact(T.impressions), fe: F.compact(T.estImpressions) },
    { lab: 'CPM', a: T.cpm, e: T.estCpm, fa: F.money2(T.cpm), fe: F.money2(T.estCpm) }
  ];
  const base = h - (big ? 40 : 30), gw = w / pairs.length, bw = Math.min(big ? 52 : 30, gw / 3.4);
  let o = `<line x1="0" y1="${base}" x2="${w}" y2="${base}" stroke="#D3D8D6"/>`;
  pairs.forEach((p, i) => {
    const mx = Math.max(p.a, p.e), cx = i * gw + gw / 2;
    const ha = p.a / mx * (base - 26), he = p.e / mx * (base - 26);
    o += `<rect x="${cx - bw - 3}" y="${base - ha}" width="${bw}" height="${ha}" fill="${C.purple}"/>`;
    o += `<rect x="${cx + 3}" y="${base - he}" width="${bw}" height="${he}" fill="${C.grey}"/>`;
    o += t(cx - bw / 2 - 3, base - ha - 7, p.fa, { size: big ? 14 : 11, fill: C.ink, anchor: 'middle', weight: 500 });
    o += t(cx + bw / 2 + 3, base - he - 7, p.fe, { size: big ? 11 : 9, anchor: 'middle' });
    o += t(cx, base + 15, p.lab, { size: big ? 12 : 10, fill: '#41505F', anchor: 'middle', cond: 1, weight: 600 });
    if (big) o += t(cx, base + 31, 'actual · planned', { size: 9, anchor: 'middle' });
  });
  return sv(w, h, o, 'Actual versus planned delivery');
}

/* daily bars (+ optional line), maturity shading */
function chDaily(ctx, w, h) {
  const d = ctx.c.daily, key = ctx.opts.series || 'impressions';
  const vals = d[key], line = key === 'impressions' ? d.clicks : null;
  const big = h > 200, base = h - (big ? 26 : 18), n = vals.length, bw = w / n;
  const lineScaled = line ? line.map(v => v * (Math.max(...vals) / Math.max(...line)) * 0.85) : null;
  const mx = Math.max(...vals, ...(lineScaled || [0])) || 1;
  let o = '';
  if (key === 'sales') o += `<rect x="${d.maturedTo * bw}" y="0" width="${(n - d.maturedTo) * bw}" height="${base}" fill="${C.amber}" opacity=".09"/>`;
  vals.forEach((v, i) => {
    const bh = v / mx * (base - 6), dim = key === 'sales' && i >= d.maturedTo;
    o += `<rect x="${i * bw + 1.5}" y="${base - bh}" width="${Math.max(2, bw - 3)}" height="${bh}" fill="${key === 'sales' ? C.teal : C.purple}" opacity="${dim ? .42 : 1}"/>`;
  });
  if (lineScaled) {
    o += `<polyline points="${lineScaled.map((v, i) => `${i * bw + bw / 2},${base - v / mx * (base - 6)}`).join(' ')}" fill="none" stroke="${C.amber}" stroke-width="${big ? 2.5 : 2}"/>`;
  }
  o += `<line x1="0" y1="${base}" x2="${w}" y2="${base}" stroke="#D3D8D6"/>`;
  if (big) {
    o += t(0, h - 8, ctx.c.id === 'meta' ? 'week 37' : '14 Sep · day 1', { size: 10 });
    o += t(w, h - 8, ctx.c.id === 'meta' ? 'this week' : 'today · day ' + ctx.c.day, { size: 10, anchor: 'end' });
  }
  return sv(w, h, o, 'Delivery by day');
}

/* funnel */
function chFunnel(ctx, w, h) {
  const steps = ctx.c.funnelSteps, big = h > 200;
  const L = big ? 160 : 112, rh = (h - 4) / steps.length - (big ? 10 : 6), mx = steps[0].value;
  let o = '';
  steps.forEach((s, i) => {
    const y = i * (rh + (big ? 10 : 6));
    const bw = Math.max(26, Math.sqrt(s.value / mx) * (w - L - (big ? 110 : 76)));
    const last = i === steps.length - 1;
    o += `<rect x="${L}" y="${y}" width="${bw}" height="${rh}" fill="${last ? C.teal : C.purple}" opacity="${last ? 1 : 1 - .11 * i}"/>`;
    o += t(L - 8, y + rh / 2 + 4, big ? s.name : short(s.name.replace(' Shoppers', '')), { size: big ? 11.5 : 9.5, fill: '#41505F', anchor: 'end', cond: 1, weight: 600 });
    o += t(L + bw + 8, y + rh / 2 + 4, F.compact(s.value), { size: big ? 13 : 10.5, fill: C.ink, weight: 500 });
  });
  return sv(w, h, o, 'Audience to buyers funnel');
}

/* horizontal bars by breakdown */
function chBars(ctx, w, h) {
  const rows = ctx.rows, m = METRICS[ctx.opts.metric];
  const media = ['impressions', 'clicks', 'ctr'].includes(ctx.opts.metric);
  const col = media ? C.purple : C.teal;
  const big = h > 200, L = big ? 190 : 132, RP = big ? 86 : 62;
  const pad = (ctx.opts.compare === 'average' && ctx.benchmark != null) ? (big ? 20 : 15) : 6;
  let data = rows.map(r => ({ name: r.name, v: m.get(r) })).filter(d => d.v != null);
  if (ctx.opts.sort === 'value') data.sort((a, b) => b.v - a.v);
  const rh = (h - pad - 6) / data.length - (big ? 9 : 6), mx = Math.max(...data.map(d => d.v)) || 1;
  let o = '';
  data.forEach((d, i) => {
    const y = pad + i * (rh + (big ? 9 : 6)), bw = d.v / mx * (w - L - RP);
    o += `<rect x="${L}" y="${y}" width="${Math.max(1, bw)}" height="${rh}" fill="${col}"/>`;
    o += t(L - 8, y + rh / 2 + 4, short(d.name), { size: big ? 11.5 : 9.5, fill: '#41505F', anchor: 'end', cond: 1, weight: 600 });
    o += t(L + bw + 7, y + rh / 2 + 4, m.fmt(d.v), { size: big ? 12.5 : 10.5, fill: C.ink, weight: 500 });
  });
  if (ctx.opts.compare === 'average' && ctx.benchmark != null) {
    const bx = L + ctx.benchmark / mx * (w - L - RP);
    o += `<line x1="${bx}" y1="${pad - 5}" x2="${bx}" y2="${h - 4}" stroke="${C.amber}" stroke-width="1.5" stroke-dasharray="4 3"/>`;
    o += t(Math.min(bx + 5, w - 150), pad - 10, 'campaign average ' + m.fmt(ctx.benchmark), { size: big ? 10 : 8.5, fill: C.amber, cond: 1, weight: 600 });
  }
  return sv(w, h, o, 'Breakdown chart');
}

/* four KPI tiles */
function chTiles(ctx, w, h) {
  const T = ctx.c.totals;
  const items = [
    ['Attributed sales', F.moneyC(T.sales)], ['Attributed transactions', F.int(T.transactions)],
    ['Attributed units', F.int(T.units)], ['Attributed ROAS', F.x(T.roas)]
  ];
  const big = h > 200, cols = 2, cw = w / cols, ch = h / 2;
  let o = `<rect x="0" y="0" width="${w}" height="${h}" fill="${C.faint}"/>`;
  items.forEach((it, i) => {
    const x = (i % cols) * cw, y = Math.floor(i / cols) * ch;
    o += `<rect x="${x + 1}" y="${y + 1}" width="${cw - 2}" height="${ch - 2}" fill="#fff"/>`;
    o += t(x + 14, y + ch / 2 + (big ? 2 : 0), it[1], { size: big ? 28 : 19, fill: C.ink, weight: 500 });
    o += t(x + 14, y + ch / 2 + (big ? 24 : 16), it[0], { size: big ? 11 : 9.5, cond: 1, weight: 600 });
  });
  return sv(w, h, o, 'Commerce totals');
}

/* big number with mini funnel */
function chBigNum(ctx, w, h) {
  const T = ctx.c.totals, big = h > 200;
  const mode = ctx.opts.mode || 'buyers';
  const a = mode === 'buyers' ? T.exposable : T.buyers;
  const b = mode === 'buyers' ? T.buyers : T.repeatBuyers;
  const headline = mode === 'buyers' ? F.int(T.buyers) : F.pct1(T.repeatRate);
  const sub = mode === 'buyers' ? 'attributed buyers' : 'bought at least twice';
  const rate = mode === 'buyers' ? F.pct3(T.convRate) + ' of exposable shoppers' : F.int(T.repeatBuyers) + ' repeat buyers';
  const labs = mode === 'buyers' ? ['Exposable Shoppers', 'Attributed Buyers'] : ['Attributed Buyers', 'Repeat Buyers'];
  const col = mode === 'buyers' ? C.teal : C.amber;
  const fx = big ? 230 : 150, rh = big ? 34 : 22;
  let o = t(0, big ? 46 : 32, headline, { size: big ? 52 : 34, fill: col, weight: 500 });
  o += t(0, big ? 70 : 50, sub, { size: big ? 13 : 11, fill: '#41505F', cond: 1, weight: 600 });
  o += t(0, big ? 96 : 70, rate, { size: big ? 12 : 10 });
  [[labs[0], a], [labs[1], b]].forEach((p, i) => {
    const y = (big ? 14 : 10) + i * (rh + 16);
    const bw = Math.max(30, Math.sqrt(p[1] / a) * (w - fx - (big ? 86 : 64)));
    o += `<rect x="${fx}" y="${y}" width="${bw}" height="${rh}" fill="${i ? col : C.purple}"/>`;
    o += t(fx, y - 5, p[0], { size: big ? 10.5 : 9, fill: '#41505F', cond: 1, weight: 600 });
    o += t(fx + bw + 8, y + rh / 2 + 4, F.compact(p[1]), { size: big ? 12.5 : 10.5, fill: C.ink, weight: 500 });
  });
  return sv(w, h, o, 'Headline number');
}

/* key/value rows */
function chRows(ctx, w, h) {
  const items = ctx.rowItems, big = h > 200;

    if (i) o += `<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="${C.faint}"/>`;
    o += t(0, y + rh / 2 + 4, it[0], { size: big ? 12.5 : 10.5, fill: '#41505F', cond: 1, weight: 600 });
    o += t(w, y + rh / 2 + 4, it[1], { size: big ? 14 : 11.5, fill: it[2] === 'warn' ? C.amber : (it[2] === 'off' ? C.mid : C.ink), anchor: 'end', weight: 500 });
  });
  return sv(w, h, o, 'Values');
}

/* two pies, campaign vs category */
function arcPath(cx, cy, r, a0, a1) {
  const p = (a) => [cx + r * Math.sin(a), cy - r * Math.cos(a)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M ${cx} ${cy} L ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`;
}
function onePie(cx, cy, r, vals) {
  let a = 0, o = '';
  const tot = vals.reduce((s, v) => s + v, 0) || 1;
  vals.forEach((v, i) => {
    const a1 = a + 2 * Math.PI * v / tot;
    o += `<path d="${arcPath(cx, cy, r, a, a1)}" fill="${PIE[i % PIE.length]}" stroke="#fff" stroke-width="1"/>`;
    a = a1;
  });
  return o;
}
function chPie2(ctx, w, h) {
  const p = ctx.c.profile[ctx.opts.attribute], big = h > 200;
  const r = Math.min(big ? 86 : 54, (h - (big ? 46 : 30)) / 2), cy = r + 6;
  let o = onePie(r + 4, cy, r, p.campaign) + onePie(r * 3 + 30, cy, r, p.category);
  o += t(r + 4, cy + r + 18, 'Campaign buyers', { size: big ? 11 : 9, fill: '#41505F', anchor: 'middle', cond: 1, weight: 600 });
  o += t(r * 3 + 30, cy + r + 18, 'Category buyers', { size: big ? 11 : 9, fill: '#41505F', anchor: 'middle', cond: 1, weight: 600 });
  const lx = r * 4 + 56;
  p.names.forEach((n, i) => {
    const y = 14 + i * (big ? 24 : 17), d = p.campaign[i] - p.category[i];
    o += `<rect x="${lx}" y="${y - 8}" width="9" height="9" fill="${PIE[i % PIE.length]}"/>`;
    o += t(lx + 15, y, `${n}`, { size: big ? 11.5 : 9.5, fill: '#41505F', cond: 1, weight: 600 });
    o += t(lx + 15, y + (big ? 12 : 8.5), `${p.campaign[i]}% · ${F.pts(d)} vs category`, { size: big ? 10.5 : 8.5, fill: d > 0 ? C.teal : C.mid });
  });
  return sv(w, h, o, 'Buyer profile versus category');
}

/* two donuts: e-commerce share */
function chDonut2(ctx, w, h) {
  const T = ctx.c.totals, big = h > 200;
  const r = Math.min(big ? 62 : 40, (h - 40) / 2), sw = big ? 16 : 11;
  const mk = (cx, pct, col, lab) => {
    const circ = 2 * Math.PI * r, cy = r + 8;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${C.faint}" stroke-width="${sw}"/>`
      + `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-dasharray="${circ * pct / 100} ${circ}" transform="rotate(-90 ${cx} ${cy})"/>`
      + t(cx, cy + (big ? 8 : 6), pct.toFixed(1) + '%', { size: big ? 22 : 15, fill: C.ink, anchor: 'middle', weight: 500 })
      + t(cx, cy + r + 20, lab, { size: big ? 11 : 9, fill: '#41505F', anchor: 'middle', cond: 1, weight: 600 });
  };
  let o = mk(r + 8, T.ecomShare, C.teal, 'Campaign') + mk(r * 3 + 36, T.catEcomShare, C.grey, 'Category');
  const dx = r * 4 + 70;
  o += t(dx, r - 4, F.pts(T.ecomShare - T.catEcomShare), { size: big ? 30 : 20, fill: C.amber, weight: 500 });
  o += t(dx, r + (big ? 18 : 14), 'e-commerce share of', { size: big ? 11.5 : 9.5, fill: '#41505F', cond: 1, weight: 600 });
  o += t(dx, r + (big ? 32 : 25), 'attributed sales vs category', { size: big ? 11.5 : 9.5, fill: '#41505F', cond: 1, weight: 600 });
  return sv(w, h, o, 'E-commerce share versus category');
}

/* histogram */
function chHist(ctx, w, h) {
  const d = ctx.c.ttp, big = h > 200, base = h - (big ? 26 : 18);
  const n = d.values.length, bw = w / n, mx = Math.max(...d.values);
  let o = `<line x1="0" y1="${base}" x2="${w}" y2="${base}" stroke="#D3D8D6"/>`;
  d.values.forEach((v, i) => {
    const bh = v / mx * (base - 14);
    o += `<rect x="${i * bw + 2}" y="${base - bh}" width="${bw - 4}" height="${bh}" fill="${C.teal}" opacity="${(.45 + .55 * v / mx).toFixed(2)}"/>`;
    o += t(i * bw + bw / 2, base - bh - 5, v + '%', { size: big ? 10.5 : 8, fill: C.ink, anchor: 'middle', weight: 500 });
    o += t(i * bw + bw / 2, base + (big ? 15 : 12), d.buckets[i], { size: big ? 10 : 8, anchor: 'middle' });
  });
  if (big) {
    const T = ctx.c.totals;
    o += t(0, h - 4, `median ${F.hours(T.medTTP)} · average ${F.hours(T.avgTTP)}`, { size: 11, fill: '#41505F' });
  }
  return sv(w, h, o, 'Time from exposure to purchase');
}

/* table (HTML, not svg) */
function chTable(ctx, big) {
  const rows = ctx.rows, fs = big ? 11.5 : 9.5;
  const cols = [
    ['Buyers', r => F.int(r.buyers)], ['Sales', r => F.moneyC(r.sales)],
    ['€/buyer', r => r.salesPerBuyer.toFixed(1)], ['Purch.', () => '1.1'],
    ['Basket', r => r.avgTxn.toFixed(1)], ['Conv.', r => F.pct3(METRICS.convRate.get(r))]
  ];
  const T = ctx.c.totals;
  let html = `<div class="tw"><table class="dt" style="font-size:${fs}px"><thead><tr><th>${esc(ctx.cutLabel)}</th>`
    + cols.map(c => `<th class="n">${c[0]}</th>`).join('') + `</tr></thead><tbody>`;
  html += `<tr class="tot"><td><b>Total</b></td><td class="n"><b>${F.int(T.buyers)}</b></td><td class="n"><b>${F.moneyC(T.sales)}</b></td><td class="n"><b>${T.salesPerBuyer.toFixed(1)}</b></td><td class="n"><b>1.1</b></td><td class="n"><b>${T.avgTxn.toFixed(1)}</b></td><td class="n"><b>${F.pct3(T.convRate)}</b></td></tr>`;
  rows.forEach(r => {
    html += `<tr><td>${esc(short(r.name))}</td>` + cols.map(c => `<td class="n">${c[1](r)}</td>`).join('') + `</tr>`;
  });
  return html + '</tbody></table></div>';
}

/* method table */
function chMethod(ctx, big) {
  const c = ctx.c;
  const rows = [
    ['Window', `${c.windowDays} days after a qualifying view or click. IAB default is 30 days; Nordmark discloses ${c.windowDays}.`],
    ['Credit', 'Last touch — the last qualifying event before the purchase takes the sale.'],
    ['Buyers', c.provenance === 'measured' ? 'Nordmark loyalty shoppers, resolved through the identity map. Match rate 96.3%.' : 'Not available — the partner returns totals, not shopper identities.'],
    ['Products', c.products],
    ['Numbers from', c.provenance === 'measured' ? 'Activate matched each exposure to a till or web receipt.' : 'Partner-reported totals. Shown as received, never blended with measured results.'],
    ['Maturity', `${c.maturity} — the window closes ${c.windowCloses}, so figures can still rise.`],
    ['Not claimed', 'No lift, no incrementality, no halo. Those need a hold-out group and come in a later phase.']
  ];
  return `<div class="tw"><table class="dt" style="font-size:${big ? 11.5 : 9.5}px"><tbody>`
    + rows.map(r => `<tr><td style="width:24%"><b>${r[0]}</b></td><td>${esc(r[1])}</td></tr>`).join('')
    + '</tbody></table></div>';
}

/* availability of a question for a campaign */
function availability(q, c) {
  if (c.provenance === 'partner') {
    if (q.onsiteOnly) return { ok: false, why: q.onsiteOnly };
    return { ok: true, partner: true };
  }
  return { ok: true };
}

/* build a render context for a question under current options */
function buildCtx(q, c, opts) {
  const o = Object.assign({}, q.defaults || {}, opts || {});
  const ctx = { c, q, opts: o };
  if (q.cuts) {
    let key = o.cut || q.cuts.find(k => c.cuts[k]) || null;
    if (!c.cuts[key]) key = q.cuts.find(k => c.cuts[k]);
    ctx.cutKey = key;
    ctx.rows = c.cuts[key] ? c.cuts[key].rows : [];
    ctx.cutLabel = c.cuts[key] ? c.cuts[key].label : '';
    const m = METRICS[o.metric];
    if (m && o.compare === 'average') {
      const T = c.totals;
      ctx.benchmark = o.metric === 'convRate' ? T.convRate
        : o.metric === 'ctr' ? T.ctr
          : ctx.rows.length ? ctx.rows.reduce((s, r) => s + (m.get(r) || 0), 0) / ctx.rows.length : null;
    }
  }
  if (q.rows) ctx.rowItems = q.rows(c);
  return ctx;
}

function renderChart(q, ctx, w, h) {
  if (q.chart === 'table') return chTable(ctx, h > 200);
  return q.chart(ctx, w, h);
}
function renderSlideChart(q, ctx, w, h) {
  if (q.slideChart === 'method') return chMethod(ctx, true);
  return renderChart(q, ctx, w, h);
}
function insightsFor(q, ctx) {
  try { return q.insights(ctx.c, ctx); } catch (e) { return ['']; }
}

function seedReport() {
  S.report = SEED.map(id => {

}

function slideCtx(slide) {
  const q = qById(slide.qid);
  return buildCtx(q, camp(), slide.opts);
}

function vBuilder() {
  if (!S.report.length) return `<div class="pad40"><div class="empty">No slides yet. <button class="btn sm" data-act="step" data-step="library">Pick some questions</button></div></div>`;
  S.sel = Math.min(S.sel, S.report.length - 1);
  const slide = S.report[S.sel], q = qById(slide.qid), c = camp();
  const av = availability(q, c);
  const ctx = slideCtx(slide);
  const sugg = av.ok ? insightsFor(q, ctx) : [];

  const strip = S.report.map((s, i) => {
    const qq = qById(s.qid), a = availability(qq, c);
    return `<button class="thumb ${i === S.sel ? 'on' : ''} ${a.ok ? '' : 'off'}" data-act="sel" data-i="${i}">
      <span class="n">${i + 1}</span>
      <span class="tn">${qq.slide}</span>
      <span class="tc">${a.ok ? 'Chapter ' + qq.chapter : 'unavailable'}</span></button>`;
  }).join('');

  const opts = [];
  if (q.cuts) {
    const avail = q.cuts.filter(k => c.cuts[k]);
    opts.push(sel('Broken down by', 'cut', avail.map(k => [k, c.cuts[k].label]), ctx.cutKey));
    if (q.chart === chBars) {
      opts.push(sel('Measure', 'metric', Object.keys(METRICS).map(k => [k, METRICS[k].label]), ctx.opts.metric));
      opts.push(sel('Compared with', 'compare', [['average', 'Campaign average'], ['none', 'Nothing']], ctx.opts.compare));
      opts.push(sel('Sorted by', 'sort', [['value', 'Value, highest first'], ['natural', 'As planned']], ctx.opts.sort));
    }
  }
  if (q.attributes) opts.push(sel('Attribute', 'attribute', q.attributes.map(a => [a, c.profile[a].label]), ctx.opts.attribute));
  if (q.id === 'daily' || q.id === 'buildup') opts.push(sel('Series', 'series', [['impressions', 'Impressions and clicks'], ['sales', 'Attributed sales']], ctx.opts.series));
  opts.push(sel('Layout', 'layout', [['text-left', 'Words left, chart right'], ['text-top', 'Words on top'], ['chart-only', 'Chart only']], slide.layout));

  return `<div class="three b">
    <aside class="strip">
      <div class="striphead"><span class="lbl">Slides · ${S.report.length}</span>
        <button class="btn sm" data-act="step" data-step="library">${ICON.plus}</button></div>
      ${strip}
    </aside>

    <main class="mid">
      <div class="mhead tight">
        <div>
          <div class="lbl">Slide ${S.sel + 1} of ${S.report.length} · ${q.q}</div>
          <h1 class="h2">${q.slide}</h1>
        </div>
        <div class="btnrow">
          <button class="btn sm" data-act="sel" data-i="${Math.max(0, S.sel - 1)}">Previous</button>
          <button class="btn sm" data-act="sel" data-i="${Math.min(S.report.length - 1, S.sel + 1)}">Next ${ICON.chev}</button>
          <button class="btn sm del" data-act="remove" data-i="${S.sel}">${ICON.x} Remove slide</button>
        </div>
      </div>
      ${av.ok ? slideEl(slide, S.sel, true) : `<div class="slide"><div class="unav big">${ICON.lock}<div><b>This slide cannot be built for ${c.name}</b><div>${av.why}. Switch campaign, or remove the slide.</div></div></div></div>`}
      <div class="lockbar">${ICON.lock} <b>Locked:</b> the chart, every number, the provenance badge and the source line come from the measurement run. Only the words in the green box are yours.</div>
    </main>

    <aside class="panel">
      <div class="lbl">Suggested words</div>
      <p class="note tight">Written from this chart's own numbers. Click one, then edit it on the slide.</p>
      <div class="suggs">${sugg.map((s, i) => `<button class="sug" data-act="usesug" data-i="${i}">${s}<span class="use">Use this ${ICON.chev}</span></button>`).join('')}</div>
      <button class="btn wide" data-act="clear">${ICON.wand} Clear the words</button>
      <div class="sep"></div>
      <div class="lbl">This chart</div>
      <div class="opts">${opts.join('')}</div>
      <div class="sep"></div>
      <div class="lbl">KPIs on this slide</div>
      <div class="chips pad6">${q.kpis.map(k => `<span class="p kpi">${k}</span>`).join('')}</div>
      <div class="grow"></div>
      <button class="btn pri wide" data-act="step" data-step="deck">Preview the deck ${ICON.chev}</button>
    </aside>
  </div>`;
}

function sel(label, key, options, value) {
  return `<label class="opt"><span>${label}</span>
    <select data-act="opt" data-key="${key}">
      ${options.map(([v, l]) => `<option value="${v}" ${v === value ? 'selected' : ''}>${l}</option>`).join('')}
    </select></label>`;
}

/* one rendered slide */
function slideEl(slide, idx, editable) {
  const q = qById(slide.qid), c = camp(), ctx = slideCtx(slide);
  const w = editable ? 560 : 420;
  const h = editable ? (slide.layout === 'chart-only' ? 330 : 280) : (slide.layout === 'chart-only' ? 230 : 190);
  const chart = renderSlideChart(q, ctx, w, h);
  const words = slide.text
    ? `<div class="ins" ${editable ? 'contenteditable="true" data-act="text"' : ''}>${slide.text}</div>`
    : `<div class="ins ph" ${editable ? 'contenteditable="true" data-act="text"' : ''}>Click a suggested sentence on the right, or type your own words here.</div>`;
  const wordBox = editable
    ? `<div class="wordbox"><span class="wbl">Your words</span>${words}
        <div class="wtools">
          <button class="btn sm" data-act="bold">Bold the numbers</button>
        </div></div>`
    : `<div class="wordbox ro">${words}</div>`;

  const inner = slide.layout === 'chart-only'
    ? `<div class="chartwrap full">${chart}</div>`
    : slide.layout === 'text-top'
      ? `<div class="stack">${wordBox}<div class="chartwrap">${chart}</div></div>`
      : `<div class="cols">${wordBox}<div class="chartwrap">${chart}</div></div>`;

  return `<div class="slide ${editable ? 'edit' : ''}">
    <div class="sh"><h2>${q.slide}</h2>${badge(c)}</div>
    ${inner}
    <div class="src">${srcLine(c, idx + 1, S.report.length)}${S.frozen ? ' · FROZEN ' + new Date().toLocaleDateString('en-GB') : ''}</div>
  </div>`;
}

/* ------------------------------------------------------------------
   Events
------------------------------------------------------------------ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'step') { S.step = el.dataset.step; render(); window.scrollTo(0, 0); }
  else if (act === 'chapter') { S.chapter = +el.dataset.n; render(); }
  else if (act === 'toggle') {
    const id = el.dataset.id;
    if (inReport(id)) S.report = S.report.filter(s => s.qid !== id);
    else {
      const q = qById(id), ctx = buildCtx(q, camp(), {});
      const slide = { qid: id, opts: Object.assign({}, q.defaults || {}, ctx.cutKey ? { cut: ctx.cutKey } : {}), text: insightsFor(q, ctx)[0], layout: 'text-left' };
      const lastIdx = S.report.findIndex(s => qById(s.qid).alwaysLast);
      if (q.alwaysLast || lastIdx < 0) S.report.push(slide); else S.report.splice(lastIdx, 0, slide);
    }
    render();
  }
  else if (act === 'remove') { S.report.splice(+el.dataset.i, 1); S.sel = Math.max(0, Math.min(S.sel, S.report.length - 1)); render(); }
  else if (act === 'up' || act === 'down') {
    const i = +el.dataset.i, j = act === 'up' ? i - 1 : i + 1;
    if (j >= 0 && j < S.report.length) { const t = S.report[i]; S.report[i] = S.report[j]; S.report[j] = t; }
    render();
  }
  else if (act === 'sel') { S.sel = +el.dataset.i; S.step = 'builder'; render(); }
  else if (act === 'usesug') {
    const slide = S.report[S.sel], ctx = slideCtx(slide);
    slide.text = insightsFor(qById(slide.qid), ctx)[+el.dataset.i];
    render();
  }
  else if (act === 'clear') { S.report[S.sel].text = ''; render(); }
  else if (act === 'bold') {
    const slide = S.report[S.sel];
    slide.text = (slide.text || '').replace(/<\/?b>/g, '')
      .replace(/(€?[\d][\d.,]*\s?(?:M|K|k|%|×|pts|h|days)?)/g, m => /\d/.test(m) ? `<b>${m}</b>` : m);
    render();
  }
  else if (act === 'pdf') { S.step = 'deck'; render(); setTimeout(() => window.print(), 60); }
  else if (act === 'pptx') { S.modal = 'pptx'; render(); }
  else if (act === 'closemodal') { S.modal = null; render(); }
});

document.addEventListener('change', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'campaign') { S.campaignId = el.value; S.sel = 0; render(); }
  else if (act === 'onlyav') { S.onlyAvailable = el.checked; render(); }
  else if (act === 'freeze') { S.frozen = el.checked; render(); }
  else if (act === 'opt') {
    const slide = S.report[S.sel], key = el.dataset.key;
    if (key === 'layout') slide.layout = el.value;
    else {
      slide.opts[key] = el.value;
      const ctx = slideCtx(slide);
      slide.text = insightsFor(qById(slide.qid), ctx)[0];
    }
    render();
  }
});

document.addEventListener('input', e => {
  const el = e.target.closest('[data-act="search"]');
  if (el) { S.search = el.value; const p = el.selectionStart; render(); const n = document.querySelector('[data-act="search"]'); if (n) { n.focus(); n.setSelectionRange(p, p); } }
});

document.addEventListener('blur', e => {
  const el = e.target.closest ? e.target.closest('[data-act="text"]') : null;
  if (el && S.report[S.sel]) S.report[S.sel].text = el.innerHTML;
}, true);

seedReport();
render();
</script>
