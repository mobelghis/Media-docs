}

/* two donuts — campaign vs category */
function cDonut2(c, f, w, h) {
  const big = h > 170, r = Math.min(big ? 58 : 38, (h - 46) / 2), sw = big ? 15 : 10;
  const mk = (cx, pct, col, lab) => {
    const circ = 2 * Math.PI * r, cy = r + 10;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${C.faint}" stroke-width="${sw}"/>`
      + `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-dasharray="${circ * pct / 100} ${circ}" transform="rotate(-90 ${cx} ${cy})"/>`
      + tx(cx, cy + (big ? 8 : 6), F.pct1(pct), { size: big ? 20 : 14, fill: C.ink, anchor: 'middle', weight: 500 })
      + tx(cx, cy + r + 20, lab, { size: big ? 11 : 9, fill: '#41505F', anchor: 'middle', cond: 1, weight: 600 });
  };
  let o = mk(r + 8, f.v.share, C.teal, 'Campaign') + mk(r * 3 + 34, f.v.cat, C.grey, 'Category');
  const dx = r * 4 + 62;
  o += tx(dx, r - 2, F.pts(f.v.d), { size: big ? 28 : 19, fill: C.amber, weight: 500 })
    + tx(dx, r + (big ? 18 : 14), 'e-commerce share of', { size: big ? 11 : 9.5, fill: '#41505F', cond: 1, weight: 600 })
    + tx(dx, r + (big ? 31 : 25), 'attributed sales vs category', { size: big ? 11 : 9.5, fill: '#41505F', cond: 1, weight: 600 });
  return sv(w, h, o, 'E-commerce share against the category');
}

/* profile pies */
function arcPath(cx, cy, r, a0, a1) {
  const p = a => [cx + r * Math.sin(a), cy - r * Math.cos(a)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M ${cx} ${cy} L ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`;
}
function onePie(cx, cy, r, vals, hi) {
  let a = 0, o = '';
  const tot = vals.reduce((s, v) => s + v, 0) || 1;
  vals.forEach((v, i) => {
    const a1 = a + 2 * Math.PI * v / tot;
    o += `<path d="${arcPath(cx, cy, r, a, a1)}" fill="${PIE[i % PIE.length]}" stroke="#fff" stroke-width="1" opacity="${hi == null || hi === i ? 1 : .42}"/>`;
    a = a1;
  });
  return o;
}
function cPie2(c, f, w, h) {
  const p = c.profile[f.chart.attribute], big = h > 170;
  const hi = p.names.indexOf(f.v.up.n);
  const r = Math.min(big ? 72 : 46, (h - (big ? 44 : 30)) / 2), cy = r + 6;
  let o = onePie(r + 4, cy, r, p.campaign, hi) + onePie(r * 3 + 26, cy, r, p.category, hi)
    + tx(r + 4, cy + r + 18, 'Campaign buyers', { size: big ? 11 : 9, fill: '#41505F', anchor: 'middle', cond: 1, weight: 600 })
    + tx(r * 3 + 26, cy + r + 18, 'Category buyers', { size: big ? 11 : 9, fill: '#41505F', anchor: 'middle', cond: 1, weight: 600 });
  const lx = r * 4 + 48;
  p.names.forEach((n, i) => {
    const y = 14 + i * (big ? 24 : 17), d = p.campaign[i] - p.category[i];
    o += `<rect x="${lx}" y="${y - 8}" width="9" height="9" fill="${PIE[i % PIE.length]}" opacity="${hi === i ? 1 : .45}"/>`
      + tx(lx + 15, y, n, { size: big ? 11 : 9.5, fill: hi === i ? C.ink : '#5B6775', cond: 1, weight: hi === i ? 700 : 600 })
      + tx(lx + 15, y + (big ? 12 : 8.5), `${p.campaign[i]}% · ${F.pts(d)}`, { size: big ? 10 : 8.5, fill: d > 0 ? C.teal : C.mid });
  });
  return sv(w, h, o, 'Buyer profile against the category');
}

/* time to purchase */
function cHist(c, f, w, h) {
  const d = c.ttp, big = h > 170, base = h - (big ? 26 : 18);
  const n = d.values.length, bw = w / n, mx = Math.max(...d.values);
  let o = `<line x1="0" y1="${base}" x2="${w}" y2="${base}" stroke="#D3D8D6"/>`;
  d.values.forEach((v, i) => {
    const bh = v / mx * (base - 16);
    o += `<rect x="${i * bw + 2}" y="${base - bh}" width="${bw - 4}" height="${bh}" fill="${i < 3 ? C.teal : '#C7D2CE'}"/>`
      + tx(i * bw + bw / 2, base - bh - 5, v + '%', { size: big ? 10.5 : 8, fill: C.ink, anchor: 'middle', weight: 500 })
      + tx(i * bw + bw / 2, base + (big ? 15 : 12), d.buckets[i], { size: big ? 9.5 : 8, anchor: 'middle' });
  });
  return sv(w, h, o, 'Time from exposure to purchase');
}

/* daily, with the open window shaded */
function cDaily(c, f, w, h) {
  const d = c.daily, big = h > 170, base = h - (big ? 26 : 18);
  const vals = d.sales, n = vals.length, bw = w / n, mx = Math.max(...vals) || 1;
  let o = `<rect x="${d.maturedTo * bw}" y="0" width="${(n - d.maturedTo) * bw}" height="${base}" fill="${C.amber}" opacity=".1"/>`;
  vals.forEach((v, i) => {
    const bh = v / mx * (base - 8), open = i >= d.maturedTo;
    o += `<rect x="${i * bw + 1.5}" y="${base - bh}" width="${Math.max(2, bw - 3)}" height="${bh}" fill="${C.teal}" opacity="${open ? .42 : 1}"/>`;
  });
  o += `<line x1="0" y1="${base}" x2="${w}" y2="${base}" stroke="#D3D8D6"/>`
    + tx(d.maturedTo * bw + 5, 12, 'still filling in', { size: big ? 10.5 : 9, fill: C.amber, cond: 1, weight: 600 });
  if (big) {
    o += tx(0, h - 7, d.labels[0], { size: 10 }) + tx(w, h - 7, 'yesterday', { size: 10, anchor: 'end' });
  }
  return sv(w, h, o, 'Attributed sales by day');
}

/* data quality rows */
function cQuality(c, f, w, h) {
  const items = c.quality, big = h > 170, rh = h / items.length;
  let o = '';
  items.forEach((q, i) => {
    const y = i * rh, bad = q.floor != null && q.value < q.floor;
    if (i) o += `<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="${C.faint}"/>`;
    o += tx(0, y + rh / 2 + 4, q.name, { size: big ? 11.5 : 10, fill: '#41505F', cond: 1, weight: 600 })
      + tx(w, y + rh / 2 + 4, q.value + q.unit, { size: big ? 13 : 11, fill: bad ? C.red : C.ink, anchor: 'end', weight: 500 })
      + (q.floor != null ? tx(w - (big ? 64 : 52), y + rh / 2 + 4, 'floor ' + q.floor + q.unit, { size: big ? 9.5 : 8.5, anchor: 'end' }) : '');
  });
  return sv(w, h, o, 'Data quality');
}

const CHART = { paired: cPaired, bars: cBars, funnel: cFunnel, bignum: cBigNum, repeat: cRepeat, donut2: cDonut2, pie2: cPie2, hist: cHist, daily: cDaily, quality: cQuality };
function drawChart(c, f, w, h) {
  const fn = CHART[f.chart && f.chart.k];
  if (!fn) return '';
  try { return fn(c, f, w, h); } catch (e) { return ''; }
}

/* ==================================================================
   THE COMPOSER — the sixth role.
   Decides which findings share a page, which layout fits, what the
   page is called, and why they belong together. It places; it never
   computes. Every number on a slide came from the engine.

   The rule it works to: a slide has room for one chart and up to two
   supporting numbers. Leaving that space empty wastes a page, so a
   finding that can be said in one number rides along as a callout
   instead of taking a page of its own.
================================================================== */

const SMALL_CHARTS = ['paired', 'bignum', 'repeat', 'donut2', 'quality', 'daily'];
const chartSize = f => (f.chart && SMALL_CHARTS.includes(f.chart.k)) ? 'small' : 'large';

const CHAPTER_TITLES = {
  delivery: 'What we bought',
  conversion: 'Who bought',
  commerce: 'What it sold',
  shoppers: 'Who they are',
  method: 'How solid this is'
};

function compose(findings, c, goal) {
  const slides = [];
  const placed = new Set();
  const pool = findings.filter(f => f.chapter !== 'method');
  const methodFindings = findings.filter(f => f.chapter === 'method');

  /* ---- 1. cover ---- */
  slides.push({ layout: 'cover', findings: [], title: c.name, no: 1,
    reason: 'Every deck opens with what the campaign actually was, so nobody has to ask in the meeting.' });

  /* a finding can ride along as a callout if it can be said in one number */
  const canRide = f => !!f.stat && !f.opportunity && f.direction !== 'opportunity' && !f.isLead;

  /* take up to n callouts, preferring the same chapter, then anything left */
  function takeRiders(hostChapter, n) {
    const same = pool.filter(f => !placed.has(f.id) && f.chapter === hostChapter && canRide(f));
    const other = pool.filter(f => !placed.has(f.id) && f.chapter !== hostChapter && canRide(f));
    const picked = [...same, ...other].slice(0, n);
    picked.forEach(f => placed.add(f.id));
    return picked;
  }

  /* ---- 2. the lead takes the second page, with at most one rider ---- */
  const lead = findings.find(f => f.isLead && f.chapter !== 'method') || pool[0];
  if (lead) {
    placed.add(lead.id);
    const riders = takeRiders(lead.chapter, goal === 'budget' && lead.direction === 'opportunity' ? 0 : 1);
    slides.push({
      layout: 'hero', findings: [lead], riders, title: lead.title,
      reason: riders.length
        ? `The strongest finding opens the deck. ${riders.length === 1 ? 'One further number' : 'Two further numbers'} from the same part of the story sits underneath it rather than taking a page.`
        : (goal === 'budget' && lead.direction === 'opportunity'
          ? 'This is the ask, so nothing shares the page with it.'
          : 'The strongest finding opens the deck on its own.')
    });
  }

  /* ---- 3. the rest: one chart per page, riders fill the space below ---- */
  const order = ['delivery', 'conversion', 'commerce', 'shoppers'];
  let guard = 0;
  while (pool.some(f => !placed.has(f.id)) && guard++ < 40) {
    // the next unplaced finding whose chart deserves the page, in chapter order
    const remaining = pool.filter(f => !placed.has(f.id));
    const host = order.map(ch => remaining.find(f => f.chapter === ch && chartSize(f) === 'large'))
      .find(Boolean) || remaining[0];
    if (!host) break;
    placed.add(host.id);

    // a small-chart partner shares the page as a second chart; otherwise take number riders
    const partner = pool.find(f => !placed.has(f.id) && f.chapter === host.chapter && chartSize(f) === 'small');
    if (partner && chartSize(host) === 'small') {
      placed.add(partner.id);
      slides.push({
        layout: 'pair', findings: [host, partner], riders: takeRiders(host.chapter, 1),
        title: CHAPTER_TITLES[host.chapter],
        reason: `Both are ${CHAPTER_TITLES[host.chapter].toLowerCase()} findings with compact charts, so they share a page instead of leaving half of two pages empty.`
      });
    } else {
      const riders = takeRiders(host.chapter, 2);
      slides.push({
        layout: 'chartstats', findings: [host], riders, title: host.title,
        reason: riders.length
          ? `This chart needs the full width, so the ${riders.length === 1 ? 'next finding rides' : 'next two findings ride'} along the bottom as ${riders.length === 1 ? 'a number' : 'numbers'} instead of taking ${riders.length === 1 ? 'a page' : 'two pages'}.`
          : 'This chart needs the full width and nothing left fits beside it.'
      });
    }
  }

  /* ---- 4. method ---- */
  if (methodFindings.length) {
    slides.push({ layout: 'method', findings: methodFindings, riders: [], title: CHAPTER_TITLES.method,
      reason: 'The rules and the maturity belong together, in words rather than charts, and they travel with every deck.' });
  }

  /* ---- 5. the actions page ---- */
  const withReco = findings.filter(f => f.reco && f.chapter !== 'method');
  if (withReco.length) {
    slides.push({ layout: 'actions', findings: withReco.slice(0, 5), riders: [], title: 'What we would do next',
      reason: 'Every recommendation collected in one place, so the meeting ends with a list rather than a feeling.' });
  }

  slides.forEach((s, i) => { s.no = i + 1; });
  const riderCount = slides.reduce((n, s) => n + (s.riders ? s.riders.length : 0), 0);
  return {
    slides,
    stats: {
      findings: findings.length,
      slides: slides.length,
      riders: riderCount,
      shared: slides.filter(s => (s.riders && s.riders.length) || s.layout === 'pair').length,
      wouldHaveBeen: findings.length + 3
    }
  };
}

        <tbody>

function trendChart(rows, key, w, h) {
  if (!rows.length) return '<div class="empty">No weeks in range.</div>';
  const vals = rows.map(r => r[key] || 0), mx = Math.max(...vals) || 1;
  const base = h - 26, bw = w / rows.length;
  let o = '';
  rows.forEach((r, i) => {
    const bh = (r[key] || 0) / mx * (base - 10);
    o += `<rect x="${i * bw + 3}" y="${base - bh}" width="${bw - 6}" height="${bh}" fill="#0F6E5C" opacity="${.5 + .5 * (r[key] || 0) / mx}"/>`;
    if (i % 2 === 0) o += `<text x="${i * bw + bw / 2}" y="${h - 8}" font-family="'IBM Plex Mono'" font-size="9" fill="#78899A" text-anchor="middle">${weekById(r.key).label}</text>`;
  });
  o += `<line x1="0" y1="${base}" x2="${w}" y2="${base}" stroke="#D3D8D6"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="Week by week">${o}</svg>`;
}

/* ---------- deep dive ---------- */
function vDeep() {
  const rows = filterFacts(S.filters);
  const d = S.deep;

  g.sort((a, b) => ((b[d.sortKey] || 0) - (a[d.sortKey] || 0)) * (d.sortDir < 0 ? 1 : -1));
  const shown = g.slice(0, d.limit);
  const T = total(rows);
  return `<div class="wrap">
    ${vFilters()}
    <section class="panel">
      <div class="phead"><h2>Deep dive</h2><span class="lbl">${g.length.toLocaleString('en-GB')} rows at this grain · showing ${shown.length}</span></div>

        <div><span class="lbl">Rows — pick your dimensions</span>
          <div class="chips">${DIM_DEFS.map(x => `<button class="chip ${d.dims.includes(x.key) ? 'on' : ''}" data-act="dim" data-k="${x.key}">${x.label}${d.dims.includes(x.key) ? `<span class="ord">${d.dims.indexOf(x.key) + 1}</span>` : ''}</button>`).join('')}</div></div>
        <div><span class="lbl">Columns — pick your fields</span>
          <div class="chips">${Object.keys(MEASURE_DEFS).map(k => `<button class="chip ${d.measures.includes(k) ? 'on' : ''}" data-act="meas" data-k="${k}">${MEASURE_DEFS[k].label}</button>`).join('')}</div></div>
      </div>
      <div class="tw"><table class="dt sticky">
        <thead><tr>
          ${d.dims.map(k => `<th>${DIM_DEFS.find(x => x.key === k).label}</th>`).join('')}
          ${d.measures.map(k => `<th class="n sortable ${d.sortKey === k ? 'sorted' : ''}" data-act="sort" data-k="${k}">${MEASURE_DEFS[k].label}${d.sortKey === k ? (d.sortDir < 0 ? ' ▾' : ' ▴') : ''}</th>`).join('')}
        </tr></thead>
        <tbody>
          <tr class="tot">${d.dims.map((k, i) => `<td>${i === 0 ? '<b>Total</b>' : ''}</td>`).join('')}${d.measures.map(k => `<td class="n"><b>${MEASURE_DEFS[k].fmt(T[k])}</b></td>`).join('')}</tr>
          ${shown.map(r => `<tr>${d.dims.map(k => `<td>${r[k]}</td>`).join('')}${d.measures.map(k => `<td class="n">${MEASURE_DEFS[k].fmt(r[k])}</td>`).join('')}</tr>`).join('')}
        </tbody></table></div>
      <div class="deepfoot">

        <button class="btn sm" data-act="csv">${ICO.dl} Download CSV</button>
        <span class="note">Rates and ratios are recalculated at each row's own grain, never averaged. Buyers do not add up across rows — a shopper reached by two ads is one buyer in each.</span>
      </div>
    </section>
  </div>`;
}

/* ---------- evidence ---------- */
function vEvidence() {
  if (!S.c) return `<div class="wrap"><div class="empty">Pick a campaign first.</div></div>`;
  const r = S.run, groups = {};
  r.rejected.forEach(f => f.rejections.forEach(x => { (groups[x.rule] = groups[x.rule] || []).push({ f, why: x.why }); }));
  const tabs = [['rejected', 'Killed by the Skeptic', r.rejected.length], ['dropped', 'Survived, not used', r.dropped.length],
                ['used', 'In the story', storyFindings().length], ['agents', 'The six roles', 6]];
  let body = '';
  if (S.evidenceFilter === 'rejected') {
    body = Object.keys(groups).map(rule => `<div class="egroup"><h3>${rule}<span class="egn">${groups[rule].length}</span></h3>
      ${groups[rule].map(({ f, why }) => `<div class="erow"><div class="et">${f.title || f.type}${f.measureLabel ? `<span class="em">on ${f.measureLabel.toLowerCase()}</span>` : ''}</div><div class="ew">${why}</div></div>`).join('')}</div>`).join('')
      || '<div class="empty">Nothing was rejected.</div>';
  } else if (S.evidenceFilter === 'dropped') {
    body = `<div class="egroup"><h3>Survived the Skeptic, did not make the cut<span class="egn">${r.dropped.length}</span></h3>
      ${r.dropped.map(f => `<div class="erow"><div class="et">${f.title || f.type}${f.measureLabel ? `<span class="em">on ${f.measureLabel.toLowerCase()}</span>` : ''}</div><div class="ew">${f.dropped || 'Scored below the findings that were chosen.'} <span class="sc">score ${f.score.toFixed(3)}</span></div></div>`).join('')}</div>`;
  } else if (S.evidenceFilter === 'used') {
    body = `<div class="egroup"><h3>Chosen for the story<span class="egn">${storyFindings().length}</span></h3>
      ${storyFindings().map((f, i) => `<div class="erow"><div class="et">${i + 1}. ${f.title}</div><div class="ew">${f.sentence.replace(/<[^>]+>/g, '')} <span class="sc">score ${f.score.toFixed(3)}</span></div></div>`).join('')}</div>`;
  } else {
    body = `<div class="agents">${AGENTS.map((a, i) => `<div class="acard"><div class="anum">${i + 1}</div>
      <div><h3>${a.name}</h3><p>${a.job}</p><div class="astat">${agentStat(a.id)}</div></div></div>`).join('')}</div>
      <div class="rulebox"><h3>The rule that keeps this honest</h3>
      <p>Every number was worked out in code, from the measurement run. The only thing written by language is the wording. If the engine cannot compute a number, nothing is allowed to say one.</p></div>`;
  }
  return `<div class="wrap">${vAgentBar()}
    <section class="headline"><div class="lbl">The working</div>
      <h1>${r.stats.scanned} raised · ${r.rejected.length} killed · ${storyFindings().length} told</h1>
      <p class="sub">A leader must be <b>${(r.stats.threshold * 100).toFixed(0)}%</b> clear of the next slice before the engine calls it a difference. The more slices examined, the further clear it has to be.</p></section>
    <div class="etabs">${tabs.map(([k, l, n]) => `<button data-act="efilter" data-f="${k}" class="${S.evidenceFilter === k ? 'on' : ''}">${l}<span class="cnt">${n}</span></button>`).join('')}</div>
    ${body}</div>`;
}
function agentStat(id) {
  const r = S.run;
  if (id === 'scout') return `raised <b>${r.stats.scanned}</b> from <b>${r.stats.cells}</b> slices`;
  if (id === 'skeptic') return `killed <b>${r.rejected.length}</b>, caveated <b>${r.kept.filter(f => f.caveats.length).length}</b>`;
  if (id === 'advisor') return `recommendation on all <b>${r.kept.length}</b> survivors`;
  if (id === 'explainer') return `wrote <b>${r.kept.length}</b> sentences`;
  if (id === 'editor') return `chose <b>${storyFindings().length}</b>, dropped <b>${r.dropped.length}</b>`;
  return `packed into <b>${S.comp ? S.comp.slides.length : 0}</b> slides, <b>${S.comp ? S.comp.stats.shared : 0}</b> pages shared`;
}

             ['Products in scope', c.productCount + ' promoted items'],
             ['Audiences', c.segments.join(', ')],
             ['Ad groups · ads', c.adgroupCount + ' · ' + c.adCount],
             ['Budget', F.money(c.budget) + ' booked, ' + F.money(T.spend) + ' spent']].map(k =>
            `<div><span class="lbl">${k[0]}</span><b>${k[1]}</b></div>`).join('')}
        </div></div>
      <div class="covfoot">${badge(c)}<span class="note">Attributed results · not incremental · ${c.maturity.toLowerCase()}, window closes ${c.windowCloses}</span></div>
      ${note}</div>`;
  }
  if (s.layout === 'method') {
    return `<div class="slide">
      <div class="sh"><h2>${s.title}</h2><span class="p lock">${ICO.lock} Travels with every deck</span></div>
      <table class="dt"><tbody>
        ${[['Window', `${c.windowDays} days after a qualifying view or click. The IAB default is 30 days; ${PROGRAM.retailer} discloses ${c.windowDays}.`],
           ['Credit', 'Last touch — the last qualifying event before the purchase takes the sale.'],
           ['Buyers', c.provenance === 'measured' ? 'Loyalty shoppers, resolved through the identity map.' : 'Not available — the partner returns totals, not identities.'],
           ['Products', c.products],
           ['Numbers from', c.provenance === 'measured' ? 'Activate matched each exposure to a till or web receipt.' : 'Partner-reported totals, shown as received and never blended.'],
           ['Maturity', `${c.maturity} — the window closes ${c.windowCloses}, so figures can still rise.`],
           ['Not claimed', 'No lift, no incrementality, no halo. Those need a hold-out group and come later.']].map(r =>
          `<tr><td style="width:22%"><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join('')}
      </tbody></table>
      ${s.findings.map(f => `<p class="ins meth">${S.edits[f.id] != null ? S.edits[f.id] : f.sentence}</p>`).join('')}
      <div class="src">${srcLine(c, s.no, total)}</div>${note}</div>`;
  }
  if (s.layout === 'actions') {
    return `<div class="slide">
      <div class="sh"><h2>${s.title}</h2><span class="p lock">${ICO.lock} Your words</span></div>
      <ol class="recos">${s.findings.map(f => `<li><b>${f.title}.</b> ${f.reco}</li>`).join('')}</ol>
      <div class="src">${srcLine(c, s.no, total)}</div>${note}</div>`;
  }
  if (s.layout === 'pair') {
    return `<div class="slide">
      <div class="sh"><h2>${s.title}</h2>${badge(c)}</div>
      ${s.tie ? `<p class="tie">${s.tie}</p>` : ''}
      <div class="pairgrid">${s.findings.map(f => `<div class="pairhalf">
        <h3>${f.title}</h3>
        <div class="chartbox">${drawChart(c, f, 330, 150)}</div>
        <p class="ins">${S.edits[f.id] != null ? S.edits[f.id] : f.sentence}</p>
      </div>`).join('')}</div>
      ${riderStrip(s)}
      <div class="src">${srcLine(c, s.no, total)}</div>${note}</div>`;
  }
  // hero / single
  const f = s.findings[0];
  return `<div class="slide">
    <div class="sh"><h2>${s.title}</h2>${badge(c)}</div>
    <div class="scols">
      <div><p class="ins">${S.edits[f.id] != null ? S.edits[f.id] : f.sentence}</p>
        ${f.reco ? `<p class="ins reco-s"><b>Recommendation.</b> ${f.reco}</p>` : ''}
        ${f.opportunity ? `<p class="ins opp-s"><b>${F.money(f.opportunity.moved)}</b> moved → <b>+${F.int(f.opportunity.gained)}</b> buyers, <b>${F.moneyC(f.opportunity.gainedSales)}</b> of sales, no extra budget.</p>` : ''}</div>
      <div>${drawChart(c, f, 440, s.layout === 'hero' ? 215 : 190)}</div>
    </div>
    ${riderStrip(s)}
    <div class="src">${srcLine(c, s.no, total)}</div>${note}</div>`;
}

/* ---------- archive ---------- */
function vArchive() {
  return `<div class="wrap">
    <section class="headline"><div class="lbl">${ICO.box} Archive</div>
      <h1>Nothing you remove is thrown away</h1>
      <p class="sub">Findings you take out of a story stay here with the reason and the time, and go back in exactly where they were.</p></section>
    ${S.archive.length ? `<div class="egroup"><h3>Removed from this story<span class="egn">${S.archive.length}</span></h3>
      ${S.archive.map((a, i) => `<div class="erow arow">
        <div class="et">${a.f.title}<span class="em">${CHAPTERS[a.f.chapter].label} · removed ${a.at}</span></div>
        <div class="ew">${a.f.sentence.replace(/<[^>]+>/g, '')}</div>
        <button class="btn sm" data-act="restore" data-id="${a.f.id}">${ICO.plus} Put it back</button>
      </div>`).join('')}</div>` : '<div class="empty">The archive is empty. Remove a finding from the story and it will appear here.</div>'}
    ${S.run ? `<div class="egroup"><h3>Never shown: killed by the Skeptic<span class="egn">${S.run.rejected.length}</span></h3>
      <div class="erow"><div class="et">Kept for the record</div><div class="ew">These were raised and rejected. They are listed in full under <button class="linkb" data-act="view" data-view="evidence">Evidence</button>, with the reason each one was killed. They are never silently deleted.</div></div></div>` : ''}
  </div>`;
}

/* ---------- modal ---------- */
function vModal() {
  if (!S.modal || !S.comp) return '';
  const c = S.c;
  return `<div class="scrim" data-act="closemodal"><div class="sheet" role="dialog" aria-label="Export">
    <h3>${c.name.replace(/[^A-Za-z0-9]+/g, '_')}.pptx</h3>
    <p class="note">In the shipped product this writes a native PowerPoint — real text boxes, real tables, vector charts, the retailer's master. Here it is the manifest the Composer produced.</p>
    <ol class="manifest">${S.comp.slides.map(s => `<li><b>${s.title}</b><span class="mlay">${s.layout}${s.findings.length > 1 ? ` · ${s.findings.length} findings` : ''}</span></li>`).join('')}</ol>
    <div class="mfoot"><div class="note">${S.comp.stats.findings} findings → ${S.comp.slides.length} slides · ${S.comp.stats.merged} shared pages</div>
      <button class="btn pri" data-act="closemodal">Close</button></div></div></div>`;
}

/* ---------- render ---------- */
function render() {
  const v = S.view === 'program' ? vProgram() : S.view === 'deep' ? vDeep() : S.view === 'story' ? vStory()
    : S.view === 'evidence' ? vEvidence() : S.view === 'deck' ? vDeck() : vArchive();
  document.getElementById('app').innerHTML = vHeader() + v + vModal();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;
  if (a === 'view') { S.view = el.dataset.view; render(); window.scrollTo(0, 0); }
  else if (a === 'drill') { S.drill.push(el.dataset.id); render(); }
  else if (a === 'undrill') { S.drill = S.drill.slice(0, +el.dataset.i); render(); }
  else if (a === 'clearfilters') { S.filters = { weekFrom: 'w34', weekTo: 'w42', campaigns: [], adgroups: [], ads: [] }; S.drill = []; render(); }
  else if (a === 'build') { loadCampaign(el.dataset.id); S.view = 'story'; render(); window.scrollTo(0, 0); }
  else if (a === 'goal') { S.goal = el.dataset.goal; S.removed = {}; S.edits = {}; S.archive = []; recompose(); render(); }
  else if (a === 'rerun') { S.removed = {}; S.edits = {}; S.archive = []; recompose(); render(); }
  else if (a === 'remove') {
    const f = S.run.story.find(x => x.id === el.dataset.id);
    S.removed[f.id] = true;
    S.archive.unshift({ f, at: new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) });
    S.comp = compose(storyFindings(), S.c, S.goal); render();
  }
  else if (a === 'restore') {
    delete S.removed[el.dataset.id];
    S.archive = S.archive.filter(x => x.f.id !== el.dataset.id);
    S.comp = compose(storyFindings(), S.c, S.goal); render();
  }
  else if (a === 'why') { S.openFinding = S.openFinding === el.dataset.id ? null : el.dataset.id; render(); }
  else if (a === 'slidewhy') { S.openSlide = S.openSlide === +el.dataset.no ? null : +el.dataset.no; render(); }
  else if (a === 'efilter') { S.evidenceFilter = el.dataset.f; render(); }
  else if (a === 'moveup' || a === 'movedown') {
    const arr = S.run.story, i = arr.findIndex(f => f.id === el.dataset.id), j = a === 'moveup' ? i - 1 : i + 1;
    if (j >= 0 && j < arr.length) { const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
    S.comp = compose(storyFindings(), S.c, S.goal); render();
  }
  else if (a === 'dim') {
    const k = el.dataset.k, d = S.deep;
    if (d.dims.includes(k)) { if (d.dims.length > 1) d.dims = d.dims.filter(x => x !== k); }
    else if (d.dims.length < 4) d.dims.push(k);
    render();
  }
  else if (a === 'meas') {
    const k = el.dataset.k, d = S.deep;
    if (d.measures.includes(k)) { if (d.measures.length > 1) d.measures = d.measures.filter(x => x !== k); }
    else d.measures.push(k);
    render();
  }
  else if (a === 'sort') {
    if (S.deep.sortKey === el.dataset.k) S.deep.sortDir *= -1; else { S.deep.sortKey = el.dataset.k; S.deep.sortDir = -1; }
    render();
  }
  else if (a === 'more') { S.deep.limit += 40; render(); }
  else if (a === 'csv') downloadCsv();
  else if (a === 'pptx') { S.modal = 1; render(); }
  else if (a === 'closemodal') { S.modal = null; render(); }
  else if (a === 'pdf') { S.view = 'deck'; render(); setTimeout(() => window.print(), 80); }
});

document.addEventListener('change', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.act === 'filter') { S.filters[el.dataset.k] = el.value; S.drill = []; render(); }
  else if (el.dataset.act === 'mfilter') {
    S.filters[el.dataset.k] = [...el.selectedOptions].map(o => o.value);
    if (el.dataset.k === 'campaigns') { S.filters.adgroups = []; S.filters.ads = []; }
    if (el.dataset.k === 'adgroups') S.filters.ads = [];
    S.drill = []; render();
  }
  else if (el.dataset.act === 'drillmeasure') { S.drillMeasure = el.value; render(); }
});

document.addEventListener('blur', e => {
  const el = e.target.closest ? e.target.closest('[data-act="edit"]') : null;
  if (el) S.edits[el.dataset.id] = el.innerHTML;
}, true);

async function downloadCsv() {
  const rows = filterFacts(S.filters), d = S.deep;
  const g = groupBy2(rows, d.dims);
  const head = [...d.dims.map(k => DIM_DEFS.find(x => x.key === k).label), ...d.measures.map(k => MEASURE_DEFS[k].label)];
  const body = g.map(r => [...d.dims.map(k => `"${String(r[k]).replace(/"/g, '""')}"`), ...d.measures.map(k => r[k] == null ? '' : (Math.round(r[k] * 1000) / 1000))].join(','));
  const csv = head.join(',') + '\n' + body.join('\n');
  try {
    const downloads = window.claude && claude.use ? await claude.use('downloads') : null;
    if (downloads) { await downloads.save({ filename: 'retail_media_deep_dive.csv', data: csv }); return; }
  } catch (e) { /* viewer declined or unavailable — fall through */ }
  const a2 = document.createElement('a');
  a2.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a2.download = 'retail_media_deep_dive.csv'; a2.click();
  setTimeout(() => URL.revokeObjectURL(a2.href), 2000);
}

render();
</script>
