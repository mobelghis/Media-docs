<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retail Media Measurement Console</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111820;--i2:#41505F;--i3:#78899A;--paper:#EFF1EF;--card:#fff;--rule:#D3D8D6;--r2:#E5E9E7;
  --teal:#0F6E5C;--tealw:#E4EFEC;--purple:#463BA0;--purplew:#E8E6F4;--amber:#A8741A;--amberw:#F6EEDD;--red:#A33A2A;--redw:#F7E7E4;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 'IBM Plex Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.n,.v,.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.lbl{font-family:'IBM Plex Sans Condensed',sans-serif;text-transform:uppercase;letter-spacing:.09em;font-weight:600;font-size:11px;color:var(--i3)}
h1,h2,h3{font-family:'IBM Plex Sans Condensed',sans-serif;margin:0;letter-spacing:-.005em}
.grow{flex-grow:1}
.note{font-size:12px;color:var(--i3);line-height:1.55;margin:0}
.empty{padding:26px;text-align:center;color:var(--i3);background:var(--card);border:1px dashed var(--rule)}
.wrap{max-width:1180px;margin:0 auto;padding:20px 24px 60px}
.linkb{background:0;border:0;color:var(--teal);text-decoration:underline;cursor:pointer;padding:0}

/* header */
.top{background:var(--ink);color:#DDE3E4;position:sticky;top:0;z-index:20}
.topin{display:flex;gap:15px;align-items:center;padding:10px 24px;flex-wrap:wrap}
.mk{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:#fff}
.mk span{color:var(--i3)}
.pk{display:flex;gap:7px;align-items:baseline;border-left:1px solid #2C3742;padding-left:14px}
.pk b{font-size:13px;color:#fff;font-weight:600}
.pk .lbl{color:#7C8C99}
.pk select{background:#1E2A36;color:#fff;border:1px solid #33414F;height:28px;padding:0 6px;font-size:12.5px}
.sy{font-size:11.5px;color:#8E9DA8;display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:#3FA97F}
.tabs{background:#1A242E;display:flex;align-items:center;gap:2px;padding:0 24px;border-top:1px solid #26323D;overflow-x:auto}
.tabs button{background:0;border:0;color:#94A4B1;font-family:'IBM Plex Sans Condensed',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-size:12px;padding:11px 14px;cursor:pointer;border-bottom:2px solid transparent;display:flex;gap:7px;align-items:center;white-space:nowrap}
.tabs button:hover{color:#fff}
.tabs button.on{color:#fff;border-bottom-color:var(--amber)}
.cnt{font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:#2A3744;padding:1px 5px;letter-spacing:0}
.tabs button.on .cnt{background:var(--amber);color:#fff}
.hint{font-size:11.5px;color:#8E9DA8}

/* agent bar */
.agentbar{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--purple);padding:11px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.agentbar.running{border-left-color:var(--amber);background:#FCFBF7}
.abl{display:flex;align-items:center;gap:7px;font-family:'IBM Plex Sans Condensed',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-weight:700;font-size:11.5px;color:var(--purple)}
.astep{display:flex;align-items:baseline;gap:7px;font-size:12.5px}
.an{font-family:'IBM Plex Sans Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-size:11px;color:var(--i3)}
.av{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:500}
.al{color:var(--i2);font-size:12px}
.al em{font-style:normal;color:var(--red)}
.arrow{color:#C3CBD2;display:flex}
.scanned{font-size:11.5px;color:var(--i3);font-family:'IBM Plex Mono',monospace}

/* goals */
.goals{background:var(--card);border:1px solid var(--rule);padding:14px 16px;margin-bottom:18px}
.gbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:9px 0 10px}
.gbtns button{text-align:left;background:#fff;border:1px solid var(--rule);padding:10px 12px;cursor:pointer;display:block}
.gbtns button:hover{border-color:var(--i3)}
.gbtns button.on{border:2px solid var(--teal);background:#F7FBFA;padding:9px 11px}
.gbtns b{display:block;font-family:'IBM Plex Sans Condensed',sans-serif;font-size:14px}
.gbtns span{display:block;font-size:11.5px;color:var(--i3);line-height:1.45;margin-top:2px}

/* headline */
.headline{margin:0 0 18px}
.headline h1{font-size:28px;line-height:1.2;margin-top:5px;max-width:30ch}
.headline .sub{color:var(--i2);font-size:13.5px;margin:8px 0 0;max-width:80ch}

/* finding cards */
.fcards{display:flex;flex-direction:column;gap:14px}
.fcard{background:var(--card);border:1px solid var(--rule);display:flex;border-left:4px solid var(--teal)}
.fcard.down{border-left-color:var(--amber)}
.fcard.opportunity{border-left-color:var(--purple)}
.fcard.caveat{border-left-color:#B9BFC4}
.fnum{width:42px;flex-shrink:0;display:flex;justify-content:center;padding-top:16px;font-family:'IBM Plex Mono',monospace;color:var(--i3);font-size:13px}
.fmain{flex-grow:1;min-width:0;padding:14px 18px 0 0}
.fhead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.fhead h3{font-size:19px;line-height:1.25;margin-top:3px}
.facts{display:flex;gap:2px;flex-shrink:0}
.ico{width:24px;height:24px;border:0;background:0;color:#AEB8C0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.ico:hover{color:var(--ink)}
.ico.del:hover{color:var(--red)}
.fbody{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:22px;margin-top:12px;align-items:start}
.said{font-size:14.5px;line-height:1.6;color:var(--i2)}
.said b{color:var(--ink);font-weight:600}
.said[contenteditable]:focus{outline:none;background:#F7FBFA;box-shadow:0 0 0 2px #B6D8D1}
.reco{margin-top:12px;background:#F7FBFA;border:1px solid #CFE3DE;padding:10px 12px;font-size:13.5px;line-height:1.55;color:var(--i2)}
.reco b{color:var(--ink)}
.rl{display:block;font-family:'IBM Plex Sans Condensed',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-size:10px;color:var(--teal);margin-bottom:4px}
.opp{margin-top:10px;border:1px solid var(--purplew);background:#FAF9FD;padding:10px 12px}
.opl{font-family:'IBM Plex Sans Condensed',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-size:10px;color:var(--purple);margin-bottom:6px}
.oprow{display:flex;gap:8px;align-items:baseline;font-size:12.5px;color:var(--i3);padding:3px 0;flex-wrap:wrap}
.oprow b{font-family:'IBM Plex Mono',monospace;color:var(--purple);font-size:14px}
.caveats{margin-top:10px;font-size:11.5px;color:var(--i3);line-height:1.5}
.caveats div{display:flex;gap:6px;align-items:flex-start;padding:2px 0}
.forced{margin-top:8px;font-size:11.5px;color:var(--amber);font-style:italic}
.fchart{min-width:0}
.ffoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--r2);margin-top:14px;padding:9px 0}
.why{font-family:'IBM Plex Sans Condensed',sans-serif;text-transform:uppercase;letter-spacing:.07em;font-weight:600;font-size:10.5px;color:var(--i3);cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.why:hover{color:var(--ink)}
.why-panel{border-top:1px solid var(--r2);padding:12px 0 14px}
table.kv{border-collapse:collapse;width:100%;max-width:560px;margin:7px 0 9px}
table.kv td{padding:5px 0;border-bottom:1px solid var(--r2);font-size:12.5px;color:var(--i2)}
table.kv td.n{text-align:right;font-family:'IBM Plex Mono',monospace;color:var(--ink)}
.p{font-family:'IBM Plex Sans Condensed',sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:2px 7px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.p.meas{background:var(--tealw);color:var(--teal)}
.p.part{background:var(--amberw);color:#8A5E10}
.p.lock{background:var(--paper);color:var(--i3);border:1px dashed #B9BFC4}
.removedbar{margin-top:14px;font-size:12.5px;color:var(--i3);background:var(--card);border:1px dashed var(--rule);padding:10px 14px}
.endbar{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;border:1px solid var(--rule);background:#fff;font-family:'IBM Plex Sans Condensed',sans-serif;text-transform:uppercase;letter-spacing:.07em;font-weight:600;font-size:11.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.sm{height:28px;padding:0 9px;font-size:10.5px}
.btnrow{display:flex;gap:8px;align-items:center}

/* evidence */
.etabs{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap}
.etabs button{background:#fff;border:1px solid var(--rule);padding:8px 12px;cursor:pointer;font-family:'IBM Plex Sans Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-size:11px;display:flex;gap:7px;align-items:center}
.etabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.etabs .cnt{background:var(--paper);color:var(--i2)}
.etabs button.on .cnt{background:#2A3744;color:#fff}
.egroup{background:var(--card);border:1px solid var(--rule);margin-bottom:12px}
.egroup h3{font-size:14px;padding:11px 15px;border-bottom:1px solid var(--r2);background:#F7F8F7;display:flex;justify-content:space-between;align-items:center}
.egn{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--i3);font-weight:400}
.erow{padding:10px 15px;border-bottom:1px solid var(--r2);display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:baseline}
.erow:last-child{border-bottom:0}
.et{font-weight:600;font-size:13px}
.em{display:block;font-weight:400;font-size:11px;color:var(--i3);font-family:'IBM Plex Mono',monospace;margin-top:2px}
.ew{font-size:12.5px;color:var(--i2);line-height:1.55}
.sc{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--i3)}
.agents{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.acard{background:var(--card);border:1px solid var(--rule);padding:14px 16px;display:flex;gap:13px}
.anum{width:28px;height:28px;background:var(--purplew);color:var(--purple);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:13px;flex-shrink:0}
.acard h3{font-size:15px}
.acard p{margin:4px 0 0;font-size:12.5px;color:var(--i2);line-height:1.5}
.astat{margin-top:8px;font-size:12px;color:var(--i3);font-family:'IBM Plex Mono',monospace}
.astat b{color:var(--ink)}
.rulebox{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--teal);padding:15px 18px;margin-top:12px}
.rulebox h3{font-size:15px}
.rulebox p{margin:5px 0 0;font-size:13px;color:var(--i2);line-height:1.6;max-width:80ch}

/* deck */
.deckbar{background:var(--card);border:1px solid var(--rule);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:16px;flex-wrap:wrap}
.h2{font-size:20px}
.deck{display:flex;flex-direction:column;gap:14px}
.slide{background:#fff;border:1px solid var(--rule);padding:24px 28px;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(17,24,32,.05)}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px}
.sh h2{font-size:20px}
.scols{display:grid;grid-template-columns:minmax(220px,.85fr) minmax(0,1.15fr);gap:24px;align-items:start;flex-grow:1}
.ins{font-size:13.5px;line-height:1.6;color:var(--i2);margin:0}
.ins b{color:var(--ink);font-weight:600}
.reco-s{margin-top:11px;padding-top:10px;border-top:1px solid var(--r2)}
.src{font-size:9px;color:#8E9DA8;border-top:1px solid var(--r2);padding-top:7px;margin-top:16px;line-height:1.45}
.cover{min-height:260px;justify-content:space-between}
.cover .big{font-size:32px;margin-top:8px}
.covmeta{font-size:15px;color:var(--i2);margin-top:14px;line-height:1.5;max-width:60ch}
.covfoot{display:flex;gap:12px;align-items:center;border-top:1px solid var(--r2);padding-top:12px}
.recos{margin:0;padding-left:20px;font-size:13.5px;color:var(--i2);line-height:1.65}
.recos li{margin-bottom:8px}
.recos b{color:var(--ink)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(17,24,32,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:24px}
.sheet{background:#fff;border:1px solid var(--rule);padding:24px 26px;max-width:620px;width:100%;max-height:84vh;overflow:auto}
.sheet h3{font-size:18px;font-family:'IBM Plex Mono',monospace;font-weight:500}
.sheet .note{margin:8px 0 14px}
.manifest{margin:0;padding-left:20px;font-size:12.5px;color:var(--i2);line-height:1.85}
.manifest b{color:var(--ink)}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--r2);margin-top:16px;padding-top:14px}

/* responsive */
@media(max-width:980px){
  .fbody,.scols{grid-template-columns:minmax(0,1fr)}
  .gbtns{grid-template-columns:minmax(0,1fr)}
  .erow{grid-template-columns:minmax(0,1fr);gap:4px}
  .hint{display:none}
}
@media(max-width:640px){
  .wrap{padding:16px 14px 50px}
  .headline h1{font-size:22px}
  .fnum{width:30px}
  .fmain{padding-right:12px}
  .agentbar{gap:10px}
  .arrow{display:none}
}

/* print = the deck */
@media print{
  @page{size:A4 landscape;margin:10mm}
  .top,.agentbar,.goals,.deckbar,.etabs,.endbar,.removedbar,.scrim{display:none!important}
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .slide{border:0;box-shadow:none;page-break-after:always;break-after:page;min-height:155mm;padding:0 0 10mm}
}

/* ---------- program landing ---------- */
.filters{background:var(--card);border:1px solid var(--rule);padding:12px 16px;display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.fgroup{display:flex;flex-direction:column;gap:5px;min-width:0}
.fgroup.end{margin-left:auto;align-items:flex-end;gap:8px}
.frow{display:flex;gap:6px;align-items:center}
.frow .to{font-size:11.5px;color:var(--i3)}
.filters select{border:1px solid var(--rule);background:#fff;font-size:12.5px;padding:3px 6px;min-width:140px}
.filters select[multiple]{min-width:190px;max-width:230px}
.fcount{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--i3)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:16px}
.kpi{background:#fff;padding:12px 14px}
.kv{font-family:'IBM Plex Mono',monospace;font-size:23px;font-weight:500;line-height:1.15;margin-top:4px}
.ks{font-size:11px;color:var(--i3);margin-top:3px}
.cols2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.panel{background:var(--card);border:1px solid var(--rule);padding:14px 16px 16px;margin-bottom:14px}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:12px}
.phead h2{font-size:17px}
.phead select{border:1px solid var(--rule);background:#fff;font-size:12px;height:28px}
.crumbs{display:flex;align-items:center;gap:4px;margin-top:5px;flex-wrap:wrap}
.crumb{background:0;border:0;padding:0;font-family:'IBM Plex Sans Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-size:10.5px;color:var(--teal);cursor:pointer}
.crumb.on{color:var(--ink);cursor:default}
.csep{color:#C3CBD2;display:flex}
.dbars{display:flex;flex-direction:column;gap:5px}
.dbar{display:grid;grid-template-columns:155px minmax(0,1fr) 78px 16px;gap:10px;align-items:center;background:0;border:0;padding:4px 2px;text-align:left;cursor:default;font:inherit}
.dbar.can{cursor:pointer}
.dbar.can:hover .dfill{background:var(--purple)}
.dbar.can:hover .dname{color:var(--ink)}
.dname{font-family:'IBM Plex Sans Condensed',sans-serif;font-size:12px;font-weight:600;color:var(--i2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtrack{background:var(--r2);height:17px;display:block}
.dfill{background:var(--teal);height:17px;display:block}
.dval{font-family:'IBM Plex Mono',monospace;font-size:12px;text-align:right}
.dgo{color:#C3CBD2;display:flex}
.tw{overflow-x:auto}
table.dt{border-collapse:collapse;width:100%;min-width:620px}
table.dt th{font-family:'IBM Plex Sans Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:10px;font-weight:600;color:var(--i3);background:#F7F8F7;border-bottom:1px solid var(--rule);padding:8px 9px;text-align:left;white-space:nowrap}
table.dt td{padding:9px;border-bottom:1px solid var(--r2);font-size:12.5px;vertical-align:top;line-height:1.45}
table.dt td.n,table.dt th.n{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
table.dt tr.tot{background:#F7F8F7}
table.dt tr.sel{background:#F2F8F6}
table.dt tr.muted td{color:var(--i3)}
table.dt .sub{font-size:11px;color:var(--i3);margin-top:2px}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--ink)}
th.sorted{color:var(--ink);background:#EDF2F0}
.p.live{background:var(--purplew);color:var(--purple)}
.p.fin{background:#E8ECF1;color:#3A4756}
.p.plan{background:var(--paper);color:var(--i3);border:1px dashed #B9BFC4}
.btn.in{background:var(--tealw);border-color:var(--teal);color:var(--teal)}
.btn.add{background:var(--teal);border-color:var(--teal);color:#fff}

/* ---------- deep dive ---------- */
.chooser{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--r2)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.chip{background:#fff;border:1px solid var(--rule);padding:4px 9px;font-size:11.5px;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.chip:hover{border-color:var(--i3)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .ord{font-family:'IBM Plex Mono',monospace;font-size:9.5px;background:var(--amber);padding:0 4px}
.deepfoot{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}
.deepfoot .note{flex:1 1 320px}
table.dt.sticky thead th{position:sticky;top:0;z-index:2}

/* ---------- composer / deck ---------- */
.composernote{background:#FAF9FD;border:1px solid var(--purplew);border-left:4px solid var(--purple);padding:11px 15px;font-size:12.5px;color:var(--i2);display:flex;gap:9px;align-items:center;margin-bottom:14px}
.covnote{font-size:13.5px;color:var(--i2);margin:8px 0 0;max-width:70ch}
.covgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 18px;margin-top:16px}
.covgrid b{display:block;font-size:12.5px;font-weight:600;margin-top:2px;line-height:1.4}
.tie{font-size:13px;color:var(--i2);margin:0 0 14px;font-style:italic}
.pairgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;flex-grow:1}
.pairhalf h3{font-size:14.5px;margin-bottom:8px}
.chartbox{margin-bottom:9px}
.meth{margin-top:12px}
.opp-s{margin-top:9px;color:var(--purple)}

</head>
<body>
<div id="app"></div>
<script>
/* ==================================================================
   THE STORY ENGINE
   Five roles. Findings are detected by arithmetic; only the wording
   is written. No number in this file comes from language generation.
     SCOUT     finds every candidate worth a look
     SKEPTIC   tries to kill each one
     ADVISOR   turns survivors into a recommendation with a number
     EXPLAINER says it in one sentence
     EDITOR    picks, de-duplicates, orders, writes the headline
================================================================== */

/* ---------- formatters ---------- */
const F = {
  int: n => n == null ? '—' : Math.round(n).toLocaleString('en-GB'),
  compact: n => {
    if (n == null) return '—';
    if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 1 : 2).replace(/\.?0+$/, '') + ' M';
    if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, '') + ' K';
    return Math.round(n).toLocaleString('en-GB');
  },
  money: n => n == null ? '—' : '€' + Math.round(n).toLocaleString('en-GB'),
  moneyC: n => {
    if (n == null) return '—';
    if (n >= 1e6) return '€' + (n / 1e6).toFixed(2).replace(/\.?0+$/, '') + ' M';
    if (n >= 1e3) return '€' + Math.round(n / 1e3) + ' k';
    return '€' + n.toFixed(2);
  },
  money2: n => n == null ? '—' : '€' + n.toFixed(2),
  pct1: n => n == null ? '—' : n.toFixed(1) + '%',
  pct2: n => n == null ? '—' : n.toFixed(2) + '%',
  pct3: n => n == null ? '—' : (Math.abs(n) < 1 ? n.toFixed(2) : n.toFixed(1)) + '%',
  pts: n => n == null ? '—' : (n > 0 ? '+' : '') + (Math.abs(n) < 1 ? n.toFixed(2) : n.toFixed(1)) + ' pts',
  x: n => n == null ? '—' : n.toFixed(1) + '×',
  dec: n => n == null ? '—' : n.toFixed(1),
  hours: n => n == null ? '—' : Math.round(n) + ' h'
};
const shortName = s => s.replace(/ buyers$/, '').replace(/ · sponsored$/, '').replace(/^Nordmark /, '').replace(/ Granola.*$/, '');

/* ---------- metric definitions on a breakdown ---------- */
const METRICS = {
  convRate:    { label: 'conversion rate',        short: 'Conversion rate',       fmt: F.pct3,   kind: 'rate',  needs: 'shopper', get: (r, T) => r.exposable ? r.buyers / r.exposable * 100 : null, total: T => T.convRate },
  ctr:         { label: 'click-through rate',     short: 'Click-through rate',    fmt: F.pct2,   kind: 'rate',  needs: 'media',   get: r => r.impressions ? r.clicks / r.impressions * 100 : null,  total: T => T.ctr },
  buyers:      { label: 'attributed buyers',      short: 'Attributed buyers',     fmt: F.int,    kind: 'count', needs: 'shopper', get: r => r.buyers,  total: T => T.buyers },
  sales:       { label: 'attributed sales',       short: 'Attributed sales',      fmt: F.moneyC, kind: 'count', needs: 'shopper', get: r => r.sales,   total: T => T.sales },
  salesPerBuyer:{label: 'sales per buyer',        short: 'Sales per buyer',       fmt: F.money2, kind: 'rate',  needs: 'shopper', get: r => r.salesPerBuyer, total: T => T.salesPerBuyer },
  avgTxn:      { label: 'average transaction',    short: 'Average transaction',   fmt: F.money2, kind: 'rate',  needs: 'shopper', get: r => r.avgTxn,  total: T => T.avgTxn },
  salesPerK:   { label: 'sales per 1,000 ads',    short: 'Sales per 1,000 ads',   fmt: F.money2, kind: 'rate',  needs: 'shopper', get: r => r.impressions ? r.sales / r.impressions * 1000 : null, total: T => T.sales / T.impressions * 1000 },
  cpBuyer:     { label: 'cost per buyer',         short: 'Cost per buyer',        fmt: F.money2, kind: 'rate',  needs: 'shopper', lowerBetter: true,
                 get: (r, T) => r.buyers ? (r.impressions / T.impressions * T.spend) / r.buyers : null, total: T => T.cpBuyer },
  impressions: { label: 'impressions',            short: 'Impressions',           fmt: F.compact, kind: 'count', needs: 'media', get: r => r.impressions, total: T => T.impressions }
};
const spendOf = (r, T) => r.impressions / T.impressions * T.spend;

/* ---------- chapters ---------- */
const CHAPTERS = {
  delivery:   { n: 1, label: 'What we bought' },
  conversion: { n: 2, label: 'Who bought' },
  commerce:   { n: 3, label: 'What it sold' },
  shoppers:   { n: 4, label: 'Who they are' },
  method:     { n: 5, label: 'How solid it is' }
};

/* ==================================================================
   SCOUT — enumerate candidates
================================================================== */
function scout(c) {
  const T = c.T, out = [];
  let cells = 0;
  const add = f => { f.id = f.id || (f.type + ':' + (f.cut || '') + ':' + (f.slice || '') + ':' + (f.metric || '')); out.push(f); };

  /* -- plan vs actual -- */
  if (c.hasPlan && T.estImpressions) {
    const mult = T.impressions / T.estImpressions;
    add({ type: 'plan_delivery', chapter: 'delivery', weight: 1.0, direction: mult >= 1 ? 'up' : 'down',
      effect: Math.abs(mult - 1), base: T.impressions, baseKind: 'impressions',
      v: { mult, actual: T.impressions, planned: T.estImpressions },
      chart: { k: 'paired' } });
  }
  if (c.hasPlan && T.estCpm) {
    const eff = T.cpm / T.estCpm;
    add({ type: 'plan_cpm', chapter: 'delivery', weight: 0.85, direction: eff <= 1 ? 'up' : 'down',
      effect: Math.abs(1 - eff), base: T.impressions, baseKind: 'impressions',
      v: { eff, cpm: T.cpm, est: T.estCpm }, chart: { k: 'paired' } });
  }

  /* -- benchmark on headline rates -- */
  ['ctr', 'convRate', 'cpBuyer', 'repeatRate'].forEach(k => {
    const b = benchFor(k, c);
    const actual = k === 'repeatRate' ? T.repeatRate : (k === 'cpBuyer' ? T.cpBuyer : T[k]);
    if (b == null || actual == null) return;
    const lower = k === 'cpBuyer';
    const better = lower ? actual < b : actual > b;
    add({ type: 'bench', chapter: k === 'ctr' ? 'delivery' : (k === 'repeatRate' ? 'shoppers' : 'conversion'),
      metric: k, weight: 0.8, direction: better ? 'up' : 'down',
      effect: Math.abs(actual - b) / b, base: T.buyers, baseKind: 'buyers',
      v: { actual, bench: b, better }, chart: { k: k === 'repeatRate' ? 'repeat' : 'bignum' } });
  });

  /* -- per-cut outliers -- */
  Object.keys(c.cuts).forEach(cutKey => {
    const cut = c.cuts[cutKey];
    cut.metrics.forEach(mk => {
      const m = METRICS[mk]; if (!m) return;
      const vals = cut.rows.map(r => ({ r, v: m.get(r, T) })).filter(x => x.v != null);
      if (vals.length < 2) return;
      cells += vals.length;
      const ref = m.total(T);
      const sorted = vals.slice().sort((a, b) => b.v - a.v);
      const hi = m.lowerBetter ? sorted[sorted.length - 1] : sorted[0];
      const lo = m.lowerBetter ? sorted[0] : sorted[sorted.length - 1];
      // separation: how far clear of the runner-up is the leader? (robust to a noisy mean)
      const n = sorted.length;
      const hiNext = m.lowerBetter ? sorted[n - 2] : sorted[1];
      const loNext = m.lowerBetter ? sorted[1] : sorted[n - 2];
      const sepHi = hiNext && hiNext.v ? Math.abs(hi.v - hiNext.v) / Math.abs(hiNext.v) : 0;
      const sepLo = loNext && loNext.v ? Math.abs(loNext.v - lo.v) / Math.abs(loNext.v) : 0;
      if (m.kind === 'rate' && ref) {
        add({ type: 'outlier_high', chapter: chapterFor(cutKey, mk), cut: cutKey, slice: hi.r.name, metric: mk,
          weight: weightFor(cutKey, mk), direction: 'up',
          effect: Math.abs(hi.v - ref) / ref, separation: sepHi, runnerUp: hiNext && hiNext.r.name, runnerUpV: hiNext && hiNext.v,
          base: hi.r.buyers, baseKind: 'buyers', imp: hi.r.impressions,
          v: { value: hi.v, ref, row: hi.r, rows: cut.rows, runnerUp: hiNext && hiNext.r, runnerUpV: hiNext && hiNext.v },
          chart: { k: 'bars', cut: cutKey, metric: mk } });
        add({ type: 'outlier_low', chapter: chapterFor(cutKey, mk), cut: cutKey, slice: lo.r.name, metric: mk,
          weight: weightFor(cutKey, mk) * 0.9, direction: 'down',
          effect: Math.abs(lo.v - ref) / ref, separation: sepLo, runnerUp: loNext && loNext.r.name, runnerUpV: loNext && loNext.v,
          base: lo.r.buyers, baseKind: 'buyers', imp: lo.r.impressions,
          v: { value: lo.v, ref, row: lo.r, rows: cut.rows, runnerUp: loNext && loNext.r, runnerUpV: loNext && loNext.v },
          chart: { k: 'bars', cut: cutKey, metric: mk } });
      }
      if (m.kind === 'count') {
        const tot = vals.reduce((s, x) => s + x.v, 0);
        const share = sorted[0].v / tot;
        if (share >= 0.42) {
          add({ type: 'concentration', chapter: chapterFor(cutKey, mk), cut: cutKey, slice: sorted[0].r.name, metric: mk,
            weight: weightFor(cutKey, mk) * 0.95, direction: 'up',
            effect: share - 1 / vals.length, base: sorted[0].r.buyers, baseKind: 'buyers', imp: sorted[0].r.impressions,
            v: { share: share * 100, value: sorted[0].v, n: vals.length, rows: cut.rows },
            chart: { k: 'bars', cut: cutKey, metric: mk } });
        }
      }
    });

    /* -- size / performance mismatch: the reallocation opportunity -- */
    if (cut.hasOwnAudience) {
      const m = METRICS.convRate;
      const rows = cut.rows.filter(r => r.exposable);
      if (rows.length >= 2) {
        const withRate = rows.map(r => ({ r, v: m.get(r, T) }));
        const biggest = withRate.slice().sort((a, b) => b.r.exposable - a.r.exposable)[0];
        const best = withRate.slice().sort((a, b) => b.v - a.v)[0];
        if (biggest.r.name !== best.r.name && best.v > biggest.v * 1.5) {
          add({ type: 'mismatch', chapter: 'conversion', cut: cutKey, slice: biggest.r.name, metric: 'convRate',
            weight: 1.25, direction: 'opportunity',
            effect: (best.v - biggest.v) / biggest.v, base: biggest.r.buyers, baseKind: 'buyers', imp: biggest.r.impressions,
            v: { weak: biggest.r, weakRate: biggest.v, strong: best.r, strongRate: best.v, rows: cut.rows },
            chart: { k: 'bars', cut: cutKey, metric: 'convRate' } });
        }
      }
    }
  });

  /* -- funnel drop -- */
  if (c.funnel && c.funnel.length > 2) {
    let worst = null;
    for (let i = 1; i < c.funnel.length - 1; i++) {
      const drop = 1 - c.funnel[i].value / c.funnel[i - 1].value;
      if (!worst || drop > worst.drop) worst = { drop, from: c.funnel[i - 1], to: c.funnel[i] };
    }
    if (worst && worst.drop > 0.15) {
      add({ type: 'funnel_drop', chapter: 'delivery', weight: 0.95, direction: 'down',
        effect: worst.drop, base: worst.to.value, baseKind: 'shoppers',
        v: worst, chart: { k: 'funnel' } });
    }
  }

  /* -- category benchmarks -- */
  if (c.T.ecomShare != null) {
    const d = c.T.ecomShare - c.T.catEcomShare;
    add({ type: 'ecom', chapter: 'shoppers', weight: 0.9, direction: d > 0 ? 'up' : 'down',
      effect: Math.abs(d) / c.T.catEcomShare, base: c.T.buyers, baseKind: 'buyers',
      v: { share: c.T.ecomShare, cat: c.T.catEcomShare, d }, chart: { k: 'donut2' } });
  }
  if (c.profile) {
    Object.keys(c.profile).forEach(attr => {
      const p = c.profile[attr];
      const items = p.names.map((n, i) => ({ n, share: p.campaign[i], d: p.campaign[i] - p.category[i] }));
      const up = items.slice().sort((a, b) => b.d - a.d)[0];
      cells += items.length;
      add({ type: 'profile', chapter: 'shoppers', cut: attr, slice: up.n, weight: 0.85, direction: 'up',
        effect: Math.abs(up.d) / Math.max(1, up.share - up.d), base: c.T.buyers, baseKind: 'buyers',
        v: { up, items, attr, label: p.label }, chart: { k: 'pie2', attribute: attr } });
    });
  }

  /* -- timing -- */
  if (c.ttp && c.T.medTTP != null) {
    const early = c.ttp.values.slice(0, 3).reduce((s, v) => s + v, 0);
    add({ type: 'timing', chapter: 'shoppers', weight: 0.75, direction: 'up',
      effect: early / 100, base: c.T.buyers, baseKind: 'buyers',
      v: { med: c.T.medTTP, avg: c.T.avgTTP, early, windowDays: c.windowDays }, chart: { k: 'hist' } });
  }

  /* -- data quality -- */
  (c.quality || []).forEach(q => {
    if (q.floor != null && q.value < q.floor) {
      add({ type: 'quality_low', chapter: 'method', slice: q.name, weight: 1.1, direction: 'down',
        effect: (q.floor - q.value) / q.floor, base: c.T.buyers, baseKind: 'buyers',
        v: q, chart: { k: 'quality' } });
    }
  });

  /* -- maturity: always raised, never dropped -- */
  const open = c.daily.sales.length - c.daily.maturedTo;
  add({ type: 'maturity', chapter: 'method', weight: 1.4, direction: 'caveat', always: true,
    effect: open / c.daily.sales.length, base: c.T.buyers, baseKind: 'buyers',
    v: { open, closes: c.windowCloses, windowDays: c.windowDays, maturity: c.maturity },
    chart: { k: 'daily', series: 'sales' } });

  // one concentration story per breakdown — the strongest one
  const bestConc = {};
  out.forEach(f => {
    if (f.type !== 'concentration') return;
    const k = f.cut;
    if (!bestConc[k] || f.v.share > bestConc[k].v.share) bestConc[k] = f;
  });
  const trimmed = out.filter(f => f.type !== 'concentration' || bestConc[f.cut] === f);
  trimmed.forEach(f => { f.cells = cells; });
  return { findings: trimmed, cells };
}

function chapterFor(cutKey, mk) {
  if (mk === 'ctr' || mk === 'impressions') return 'delivery';
  if (mk === 'convRate') return 'conversion';
  if (cutKey === 'channel' || cutKey === 'banner') return 'shoppers';
  return 'commerce';
}
function weightFor(cutKey, mk) {
  const cw = { segment: 1.15, placement: 1.0, creative: 0.95, product: 0.9, banner: 0.8, channel: 0.85 }[cutKey] || 0.8;
  const mw = { convRate: 1.2, sales: 1.1, cpBuyer: 1.05, salesPerK: 1.0, buyers: 1.0, ctr: 0.9, salesPerBuyer: 0.8, avgTxn: 0.7, impressions: 0.6 }[mk] || 0.8;
  return cw * mw;
}

/* ==================================================================
   SKEPTIC — try to kill each finding
================================================================== */
const MIN_BUYERS = 400;
const MIN_IMPRESSIONS = 250000;

function skeptic(findings, c) {
  const T = c.T;
  // threshold grows with how many cells we looked at: more looks, bigger gap required
  const cells = findings.length ? findings[0].cells : 1;
  // the more slices we look at, the further clear of the pack a leader must be
  const mcThreshold = 0.10 + 0.02 * Math.log2(Math.max(2, cells));

  findings.forEach(f => {
    f.rejections = []; f.caveats = [];

    if (f.always) { f.kept = true; return; }

    // 1. base size
    if (['outlier_high', 'outlier_low', 'concentration', 'mismatch'].includes(f.type)) {
      if (f.baseKind === 'buyers' && f.base != null && f.base < MIN_BUYERS) {
        f.rejections.push({ rule: 'Base too small', why: `Only ${F.int(f.base)} attributed buyers behind this slice — under the ${F.int(MIN_BUYERS)} we need before calling a difference real.` });
      }
      if (f.imp != null && f.imp < MIN_IMPRESSIONS) {
        f.rejections.push({ rule: 'Base too small', why: `Only ${F.compact(f.imp)} impressions on this slice — under the ${F.compact(MIN_IMPRESSIONS)} minimum.` });
      }
    }

    // 2. is it actually clear of the pack? (and we looked at a lot of slices)
    if (['outlier_high', 'outlier_low'].includes(f.type)) {
      if (f.separation == null || f.separation < mcThreshold) {
        f.rejections.push({
          rule: 'Too close to call',
          why: `${shortName(f.slice)} sits only ${((f.separation || 0) * 100).toFixed(0)}% clear of the next ${(c.cuts[f.cut] || {}).noun || 'slice'} (${shortName(f.runnerUp || '')}). Across ${cells} slices examined, a leader needs to be ${(mcThreshold * 100).toFixed(0)}% clear before we call it a difference.`
        });
      }
    }

    // 3. provenance
    if (c.provenance === 'partner') {
      const m = f.metric && METRICS[f.metric];
      if ((m && m.needs === 'shopper') || ['mismatch', 'profile', 'ecom', 'timing', 'bench'].includes(f.type)) {
        if (!(f.type === 'bench' && f.metric === 'ctr')) {
          f.rejections.push({ rule: 'Partner-reported', why: 'This needs shopper-level detail. The partner returns totals only, so the number cannot be stood behind.' });
        }
      }
    }

    // 4. missing plan inputs
    if (['plan_delivery', 'plan_cpm'].includes(f.type) && !c.hasPlan) {
      f.rejections.push({ rule: 'Input missing', why: 'No planned spend or impressions were supplied for this campaign.' });
    }

    // 5. maturity — a caveat, never a kill
    if (['outlier_high', 'outlier_low', 'concentration', 'mismatch', 'bench'].includes(f.type) && c.daily.maturedTo < c.daily.sales.length) {
      const open = c.daily.sales.length - c.daily.maturedTo;
      f.caveats.push(`The ${c.windowDays}-day window is still open on the last ${open} days, so this figure can still rise.`);
    }
    if (f.type === 'profile' || f.type === 'ecom') {
      f.caveats.push('Compared with category buyers over the same period, on the same definition.');
    }
    if (f.type === 'mismatch') {
      f.caveats.push('The reallocation figure assumes the stronger audience holds its rate on extra budget. It is smaller than this audience\'s current reach, so that is reasonable — but it is an estimate, not a promise.');
    }

    f.kept = f.rejections.length === 0;
  });

  findings.forEach(f => {
    const reliability = f.baseKind === 'buyers' && f.base
      ? Math.min(1, Math.log10(Math.max(10, f.base)) / Math.log10(5000))
      : 0.9;
    f.reliability = reliability;
    f.score = f.effect * reliability * f.weight;
  });

  return { mcThreshold, cells };
}

/* ==================================================================
   EXPLAINER + ADVISOR — wording and the recommendation
================================================================== */
function describe(f, c, goal) {
  const T = c.T;
  const m = f.metric && METRICS[f.metric];
  f.measureLabel = m ? m.short : null;
  const cut = f.cut && c.cuts[f.cut];
  const noun = cut ? cut.noun : 'line';
  const firm = goal === 'renewal' ? 'We recommend' : goal === 'budget' ? 'We would push for' : 'Worth considering';

  switch (f.type) {
    case 'plan_delivery': {
      const up = f.v.mult >= 1;
      f.title = up ? 'We delivered more than we sold' : 'Delivery came in under plan';
      f.sentence = `The campaign delivered <b>${F.compact(f.v.actual)}</b> impressions against a planned <b>${F.compact(f.v.planned)}</b> — <b>${F.x(f.v.mult)}</b> the booked volume at no extra cost.`;
      f.reco = up
        ? `${firm} holding the same budget next flight: the over-delivery is free reach we can show on the plan.`
        : `${firm} checking inventory availability before committing the same volume again.`;
      f.stat = { v: F.x(f.v.mult), l: 'impressions against plan' };
      return f;
    }
    case 'plan_cpm': {
      const cheaper = f.v.eff <= 1;
      f.title = cheaper ? 'Cheaper per thousand than planned' : 'More expensive per thousand than planned';
      f.sentence = `The effective CPM was <b>${F.money2(f.v.cpm)}</b> against <b>${F.money2(f.v.est)}</b> planned — <b>${Math.round(Math.abs(1 - f.v.eff) * 100)}%</b> ${cheaper ? 'cheaper' : 'dearer'} per thousand ads.`;
      f.reco = cheaper
        ? `${firm} reinvesting the saving rather than cutting the budget — the same money buys more reach than the plan assumed.`
        : `${firm} revisiting the floor price on this inventory before the next flight.`;
      f.stat = { v: F.money2(f.v.cpm), l: `CPM · ${F.money2(f.v.est)} planned` };
      return f;
    }
    case 'bench': {
      const k = f.metric, b = f.v;
      const name = { ctr: 'Click-through rate', convRate: 'Conversion rate', cpBuyer: 'Cost per buyer', repeatRate: 'Repeat purchase' }[k];
      const fmt = k === 'cpBuyer' ? F.money2 : (k === 'ctr' ? F.pct2 : F.pct3);
      f.title = `${name} ${b.better ? 'ahead of' : 'behind'} comparable campaigns`;
      f.sentence = `${name} came in at <b>${fmt(b.actual)}</b> against <b>${fmt(b.bench)}</b> across comparable campaigns — <b>${Math.round(Math.abs(b.actual - b.bench) / b.bench * 100)}%</b> ${b.better ? 'better' : 'worse'}.`;
      f.reco = b.better
        ? `${firm} using this as the benchmark in the next brief rather than the category norm.`
        : `${firm} looking at targeting and creative together before repeating this set-up.`;
      f.stat = { v: fmt(b.actual), l: `${name.toLowerCase()} · ${fmt(b.bench)} benchmark` };
      return f;
    }
    case 'outlier_high': {
      f.title = `${shortName(f.slice)} is the strongest ${noun}`;
      f.sentence = `The <b>${shortName(f.slice).toLowerCase()}</b> ${noun} reached <b>${m.fmt(f.v.value)}</b> on ${m.label} against a campaign average of <b>${m.fmt(f.v.ref)}</b> — <b>${F.x(f.v.value / f.v.ref)}</b> the average.`;
      f.reco = `${firm} weighting the next flight towards ${shortName(f.slice).toLowerCase()} and briefing more inventory against it.`;
      f.stat = { v: m.fmt(f.v.value), l: `${shortName(f.slice).toLowerCase()} · ${m.label}` };
      return f;
    }
    case 'outlier_low': {
      f.title = `${shortName(f.slice)} is the weakest ${noun}`;
      f.sentence = `The <b>${shortName(f.slice).toLowerCase()}</b> ${noun} came in at <b>${m.fmt(f.v.value)}</b> on ${m.label} against a campaign average of <b>${m.fmt(f.v.ref)}</b>.`;
      f.reco = `${firm} either reworking this ${noun} or moving its share of the budget to the ${noun}s that are carrying the campaign.`;
      f.stat = { v: m.fmt(f.v.value), l: `${shortName(f.slice).toLowerCase()} · ${m.label}` };
      return f;
    }
    case 'concentration': {
      f.title = `${shortName(f.slice)} carries the campaign`;
      f.sentence = `<b>${shortName(f.slice)}</b> accounts for <b>${F.pct1(f.v.share)}</b> of ${m.label} on its own, out of ${f.v.n} ${noun}s.`;
      f.reco = `${firm} treating this as a dependency as much as a strength — one ${noun} carrying ${F.pct1(f.v.share)} is a risk if it saturates.`;
      f.stat = { v: F.pct1(f.v.share), l: `${shortName(f.slice).toLowerCase()} share of ${m.label}` };
      return f;
    }
    case 'mismatch': {
      const weakSpend = spendOf(f.v.weak, T), strongSpend = spendOf(f.v.strong, T);
      const weakEff = f.v.weak.buyers / weakSpend;     // buyers per €
      const strongEff = f.v.strong.buyers / strongSpend;
      const moveShare = 0.3;
      const moved = weakSpend * moveShare;
      const gained = Math.round(moved * (strongEff - weakEff));
      const gainedSales = Math.round(gained * f.v.strong.salesPerBuyer);
      f.opportunity = { moved, gained, gainedSales, weakSpend, strongSpend, moveShare };
      f.title = 'The biggest audience is the weakest one';
      f.sentence = `<b>${shortName(f.v.weak.name)}</b> was the largest audience at <b>${F.compact(f.v.weak.exposable)}</b> shoppers but converted at <b>${F.pct3(f.v.weakRate)}</b>, while <b>${shortName(f.v.strong.name).toLowerCase()}</b> converted at <b>${F.pct3(f.v.strongRate)}</b> from <b>${F.compact(f.v.strong.exposable)}</b>.`;
      f.reco = `${firm} moving <b>${Math.round(moveShare * 100)}%</b> of the ${shortName(f.v.weak.name).toLowerCase()} budget — about <b>${F.money(moved)}</b> — into ${shortName(f.v.strong.name).toLowerCase()}. At the rates both audiences actually achieved, that is roughly <b>${F.int(gained)} more buyers</b> and <b>${F.moneyC(gainedSales)}</b> of attributed sales for the same total spend.`;
      f.stat = { v: '+' + F.int(gained), l: 'buyers if the budget moved' };
      return f;
    }
    case 'funnel_drop': {
      f.title = `The audience thins between ${f.v.from.name.replace(' Shoppers', '').toLowerCase()} and ${f.v.to.name.replace(' Shoppers', '').toLowerCase()}`;
      f.sentence = `<b>${F.pct1(f.v.drop * 100)}</b> of the audience is lost between <b>${f.v.from.name}</b> (${F.compact(f.v.from.value)}) and <b>${f.v.to.name}</b> (${F.compact(f.v.to.value)}) — the largest drop in the funnel.`;
      f.reco = `${firm} looking at this step first: recovering even a tenth of it is cheaper than buying the equivalent reach.`;
      f.stat = { v: '−' + F.pct1(f.v.drop * 100), l: `lost before ${f.v.to.name.replace(' Shoppers', '').toLowerCase()}` };
      return f;
    }
    case 'ecom': {
      const up = f.v.d > 0;
      f.title = up ? 'A visible lift in online share' : 'Online share below the category';
      f.sentence = `E-commerce took <b>${F.pct1(f.v.share)}</b> of attributed sales against <b>${F.pct1(f.v.cat)}</b> for the category over the same period — <b>${F.pts(f.v.d)}</b>.`;
      f.reco = up
        ? `${firm} pairing the next flight with the online slot, since that is where the campaign moved share.`
        : `${firm} testing an online-weighted flight, since the campaign did not shift the channel mix.`;
      f.stat = { v: F.pts(f.v.d), l: 'e-commerce share vs category' };
      return f;
    }
    case 'profile': {
      f.title = `Buyers skew ${f.v.up.n.toLowerCase()}`;
      f.sentence = `<b>${f.v.up.n}</b> make up <b>${f.v.up.share}%</b> of campaign buyers against <b>${f.v.up.share - f.v.up.d}%</b> of category buyers — <b>${F.pts(f.v.up.d)}</b> on ${f.v.label.toLowerCase()}.`;
      f.reco = `${firm} building the next audience around ${f.v.up.n.toLowerCase()} rather than the whole category.`;
      f.stat = { v: F.pts(f.v.up.d), l: `${f.v.up.n.toLowerCase()} against the category` };
      return f;
    }
    case 'timing': {
      f.title = 'Most buying happens in the first three days';
      f.sentence = `Half of attributed purchases land within <b>${F.hours(f.v.med)}</b> of exposure and <b>${f.v.early}%</b> within three days, against a <b>${f.v.windowDays}-day</b> window.`;
      f.reco = `${firm} concentrating weight in the first days of a flight, where the response actually is.`;
      f.stat = { v: F.hours(f.v.med), l: 'median time to purchase' };
      return f;
    }
    case 'quality_low': {
      f.title = `${f.v.name} is below our floor`;
      f.sentence = `${f.v.name} came in at <b>${f.v.value}${f.v.unit}</b> against a floor of <b>${f.v.floor}${f.v.unit}</b>.`;
      f.reco = `Flag this before the result is presented — it affects how much of the campaign we can stand behind.`;
      f.stat = { v: f.v.value + f.v.unit, l: f.v.name.toLowerCase() };
      return f;
    }
    case 'maturity': {
      f.title = 'This read is not finished yet';
      f.sentence = `The ${f.v.windowDays}-day window is still open on the last <b>${f.v.open} days</b> and closes on <b>${f.v.closes}</b>. Every figure here is a floor, not a verdict.`;
      f.reco = `Present these numbers as ${f.v.maturity.toLowerCase()}, and agree now to re-issue the report once the window closes.`;
      f.stat = { v: f.v.open + ' wks', l: 'still inside the window' };
      return f;
    }
  }
  f.title = 'Finding'; f.sentence = ''; f.reco = '';
  return f;
}

/* ==================================================================
   EDITOR — select, de-duplicate, order, headline
================================================================== */
const GOALS = {
  renewal: {
    label: 'Renewal pitch',
    hint: 'Lead with what worked. One clear opportunity. Close on the ask.',
    boost: f => (f.direction === 'up' ? 1.45 : f.direction === 'opportunity' ? 1.25 : f.type === 'quality_low' ? 0.5 : 0.6),
    minDown: 0, wantOpportunity: true,
    lead: picked => picked.find(f => f.direction === 'up' && f.chapter !== 'method')
  },
  honest: {
    label: 'Honest review',
    hint: 'Balanced. What did not work is in, at full weight, including data quality.',
    boost: f => (f.type === 'quality_low' ? 1.5 : 1),
    minDown: 2, wantOpportunity: true,
    lead: picked => picked.find(f => f.direction === 'opportunity') || picked.find(f => f.direction === 'down')
  },
  budget: {
    label: 'Ask for more budget',
    hint: 'Lead with headroom and the money left on the table.',
    boost: f => (f.direction === 'opportunity' ? 1.9 : f.type === 'funnel_drop' ? 1.55 : f.direction === 'down' ? 1.15 : 0.9),
    minDown: 1, wantOpportunity: true,
    lead: picked => picked.find(f => f.direction === 'opportunity') || picked.find(f => f.type === 'funnel_drop')
  }
};

function editor(findings, c, goal, maxSlides) {
  const g = GOALS[goal];
  const kept = findings.filter(f => f.kept);
  kept.forEach(f => { f.goalScore = f.score * g.boost(f); });

  const order = ['delivery', 'conversion', 'commerce', 'shoppers', 'method'];
  const picked = [];
  const usedSlices = new Set();
  const usedTypes = {};

  // maturity always travels with the deck
  const maturity = kept.find(f => f.type === 'maturity');

  const pool = kept.filter(f => f.type !== 'maturity').sort((a, b) => b.goalScore - a.goalScore);

  for (const f of pool) {
    if (picked.length >= maxSlides - 1) break;
    const sliceKey = (f.cut || '') + '|' + (f.slice || '');
    if (f.slice && usedSlices.has(sliceKey)) { f.dropped = 'Already covered by another finding about the same slice.'; continue; }
    const tcount = usedTypes[f.type] || 0;
    if (tcount >= (f.type === 'outlier_high' || f.type === 'outlier_low' ? 2 : 1)) { f.dropped = 'The story already makes this point.'; continue; }
    const chCount = picked.filter(p => p.chapter === f.chapter).length;
    if (chCount >= 3) { f.dropped = 'Enough already said in this chapter.'; continue; }
    picked.push(f); usedSlices.add(sliceKey); usedTypes[f.type] = tcount + 1;
  }

  // the opportunity always travels — it is the recommendation the deck exists for
  if (g.wantOpportunity && !picked.some(p => p.direction === 'opportunity')) {
    const opp = pool.find(f => f.direction === 'opportunity' && !picked.includes(f));
    if (opp) { opp.forced = 'Kept because every story needs one thing to do next.'; opp.dropped = null; picked.push(opp); }
  }
  // the honest minimum of genuinely negative findings
  const downs = picked.filter(p => p.direction === 'down');
  if (downs.length < g.minDown) {
    const extra = pool.filter(f => !picked.includes(f) && f.direction === 'down')
      .sort((a, b) => b.score - a.score).slice(0, g.minDown - downs.length);
    extra.forEach(f => { f.forced = 'Kept so the report is not only good news.'; f.dropped = null; picked.push(f); });
  }

  if (maturity) picked.push(maturity);
  picked.sort((a, b) => order.indexOf(a.chapter) - order.indexOf(b.chapter) || b.goalScore - a.goalScore);

  // the goal decides what the reader meets first
  const lead = g.lead(picked);
  if (lead) {
    const i = picked.indexOf(lead);
    if (i > 0) { picked.splice(i, 1); picked.unshift(lead); lead.isLead = true; }
    else if (i === 0) lead.isLead = true;
  }
  picked.forEach((f, i) => { f.slideNo = i + 1; f.selected = true; });

  // headline
  const T = c.T;
  const opp = picked.find(f => f.direction === 'opportunity');
  let headline;
  if (goal === 'budget' && opp && opp.opportunity) {
    headline = `The same budget, spent where it worked, was worth about ${F.int(opp.opportunity.gained)} more buyers`;
  } else if (goal === 'honest') {
    headline = `${F.moneyC(T.sales)} of attributed sales on ${F.money(T.spend)} of media — concentrated in two of ${c.cuts.segment ? c.cuts.segment.rows.length : 4} audiences`;
  } else {
    headline = `Every €1 of media is linked to ${F.money2(T.roas)} of Aurelia sales at Nordmark`;
  }
  return { picked, headline, goal: g };
}

/* ==================================================================
   RUN — the whole pipeline
================================================================== */
function runEngine(c, goal, maxSlides) {
  const t0 = performance.now ? performance.now() : 0;
  const { findings, cells } = scout(c);
  const sk = skeptic(findings, c);
  findings.forEach(f => describe(f, c, goal));
  const ed = editor(findings, c, goal, maxSlides || 9);
  const t1 = performance.now ? performance.now() : 0;
  return {
    all: findings,
    kept: findings.filter(f => f.kept),
    rejected: findings.filter(f => !f.kept),
    dropped: findings.filter(f => f.kept && !f.selected),
    story: ed.picked,
    headline: ed.headline,
    goal: ed.goal,
    stats: { cells, scanned: findings.length, kept: findings.filter(f => f.kept).length, used: ed.picked.length, threshold: sk.mcThreshold, ms: Math.max(1, Math.round(t1 - t0)) }
  };
}

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const jitter = (v, pct) => v * (1 + (rnd() - 0.5) * 2 * pct);

/* ---------- generate the fact table ---------- */
const FACTS = [];
(function build() {
  CAMPAIGN_DEFS.forEach(cm => {
    if (cm.state === 'planned') return;
    const wFrom = weekById(cm.from).idx, wTo = weekById(cm.to).idx;
    const nWeeks = wTo - wFrom + 1;
    const totalImp = cm.plannedImpressions * (cm.id === 'cm1' ? 1.79 : cm.id === 'cm4' ? 0.92 : cm.id === 'cm2' ? 1.03 : 1.05);
    cm.adgroups.forEach(g => {
      const seg = SEGMENTS.find(s => s.id === g.segment);
      g.ads.forEach(ad => {
        for (let wi = wFrom; wi <= wTo; wi++) {
          // weekly delivery curve: ramp up, peak, taper
          const t = (wi - wFrom) / Math.max(1, nWeeks - 1);
          const curve = 0.6 + 0.8 * Math.sin(Math.PI * Math.min(1, t * 1.15));
          BANNERS.forEach(b => {
            cm.products.forEach(pid => {
              const prod = PRODUCTS.find(p => p.id === pid);
              const prodW = 1 / cm.products.length * (pid === cm.products[0] ? 1.7 : pid === cm.products[1] ? 1.1 : 0.7);
              const imp = Math.round(jitter(totalImp * g.share * ad.w * b.w * prodW * curve / nWeeks, 0.12));
              if (imp < 200) return;
              const ctrBase = cm.provenance === 'partner' ? 0.0063 : (cm.id === 'cm3' ? 0.055 : 0.0028);
              const creativeLift = ad.creative === 'Recipe video' ? 1.55 : ad.creative === 'Lifestyle breakfast' ? 1.08 : ad.creative === 'Ingredient close-up' ? 1.02 : 0.93;
              const clicks = Math.round(imp * jitter(ctrBase * g.ctrLift / 1.5 * creativeLift, 0.1));
              const spend = cm.spend * (imp / totalImp);
              // conversion: segment quality drives it, with a small creative effect
              const convBase = cm.convBase;
              const buyers = Math.max(0, Math.round(imp * jitter(convBase * seg.lift * b.lift * (ad.creative === 'Recipe video' ? 0.55 : 1), 0.15)));
              if (buyers === 0) return;
              const txns = Math.round(buyers * jitter(1.11, 0.03));
              const units = Math.round(txns * jitter(1.10, 0.04));
              const sales = +(units * prod.price * jitter(1, 0.05)).toFixed(2);
              const raw = CHANNELS.map(ch => ch.id === 'c3' ? (b.id === 'b3' ? 0.46 : 0.02) : ch.w);
              const rawSum = raw.reduce((a, x) => a + x, 0);
              CHANNELS.forEach((ch, ci) => {
                const chW = raw[ci] / rawSum;
                const cb = Math.round(buyers * chW);
                if (cb < 1) return;
                FACTS.push({
                  program: PROGRAM.id, campaign: cm.id, adgroup: g.id, ad: ad.id,
                  placement: g.placement, banner: b.name, channel: ch.name,
                  segment: seg.name, creative: ad.creative, product: prod.name, upc: prod.upc,
                  category: prod.cat, week: WEEKS[wi].id,
                  impressions: Math.round(imp * chW), clicks: Math.round(clicks * chW),
                  spend: +(spend * chW).toFixed(2), buyers: cb,
                  txns: Math.round(txns * chW), units: Math.round(units * chW),
                  sales: +(sales * chW).toFixed(2)
                });
              });
            });
          });
        }
      });
    });
  });
})();

/* spend is booked at campaign level: scale the generated rows so each campaign sums to its real spend */
(function normaliseSpend() {
  CAMPAIGN_DEFS.forEach(cm => {
    const rows = FACTS.filter(r => r.campaign === cm.id);
    const got = rows.reduce((s, r) => s + r.spend, 0);
    if (!got) return;
    const k = cm.spend / got;
    rows.forEach(r => { r.spend = +(r.spend * k).toFixed(4); });
  });
})();

/* ---------- lookups ---------- */
const CAMPAIGN_BY_ID = {}; CAMPAIGN_DEFS.forEach(c => CAMPAIGN_BY_ID[c.id] = c);
const ADGROUPS = []; const ADS = [];
CAMPAIGN_DEFS.forEach(c => c.adgroups.forEach(g => {
  ADGROUPS.push(Object.assign({ campaign: c.id }, g));
  g.ads.forEach(a => ADS.push(Object.assign({ campaign: c.id, adgroup: g.id }, a)));
}));
const nameOf = {
  campaign: id => (CAMPAIGN_BY_ID[id] || {}).name || id,
  adgroup: id => (ADGROUPS.find(g => g.id === id) || {}).name || id,
  ad: id => (ADS.find(a => a.id === id) || {}).name || id
};

/* ---------- aggregation ---------- */
const MEASURE_DEFS = {
  impressions: { label: 'Impressions', fmt: v => F.compact(v), sum: true },
  clicks:      { label: 'Clicks', fmt: v => F.compact(v), sum: true },
  spend:       { label: 'Media spend', fmt: v => F.money(v), sum: true },
  buyers:      { label: 'Attributed buyers', fmt: v => F.int(v), sum: true },
  sales:       { label: 'Attributed sales', fmt: v => F.moneyC(v), sum: true },
  txns:        { label: 'Attributed transactions', fmt: v => F.int(v), sum: true },
  units:       { label: 'Attributed units', fmt: v => F.int(v), sum: true },
  ctr:         { label: 'Click-through rate', fmt: v => F.pct2(v), derive: r => r.impressions ? r.clicks / r.impressions * 100 : null },
  cpm:         { label: 'CPM', fmt: v => F.money2(v), derive: r => r.impressions ? r.spend / r.impressions * 1000 : null },
  roas:        { label: 'Attributed ROAS', fmt: v => F.x(v), derive: r => r.spend ? r.sales / r.spend : null },
  cpBuyer:     { label: 'Cost per buyer', fmt: v => F.money2(v), derive: r => r.buyers ? r.spend / r.buyers : null },
  salesPerBuyer:{ label: 'Sales per buyer', fmt: v => F.money2(v), derive: r => r.buyers ? r.sales / r.buyers : null },
  avgTxn:      { label: 'Average transaction', fmt: v => F.money2(v), derive: r => r.txns ? r.sales / r.txns : null },
  unitsPerTxn: { label: 'Units per transaction', fmt: v => F.dec(v), derive: r => r.txns ? r.units / r.txns : null },
  pricePerUnit:{ label: 'Price per unit', fmt: v => F.money2(v), derive: r => r.units ? r.sales / r.units : null }
};
const SUM_KEYS = ['impressions', 'clicks', 'spend', 'buyers', 'sales', 'txns', 'units'];

function emptyAgg() { const o = {}; SUM_KEYS.forEach(k => o[k] = 0); return o; }
function addInto(o, r) { SUM_KEYS.forEach(k => o[k] += r[k] || 0); return o; }
function withDerived(o) {
  Object.keys(MEASURE_DEFS).forEach(k => { const d = MEASURE_DEFS[k].derive; if (d) o[k] = d(o); });
  return o;
}

function filterFacts(f) {
  return FACTS.filter(r => {
    if (f.campaigns && f.campaigns.length && !f.campaigns.includes(r.campaign)) return false;
    if (f.adgroups && f.adgroups.length && !f.adgroups.includes(r.adgroup)) return false;
    if (f.ads && f.ads.length && !f.ads.includes(r.ad)) return false;
    if (f.weekFrom && weekById(r.week).idx < weekById(f.weekFrom).idx) return false;
    if (f.weekTo && weekById(r.week).idx > weekById(f.weekTo).idx) return false;
    if (f.dims) for (const k in f.dims) { const v = f.dims[k]; if (v && v.length && !v.includes(r[k])) return false; }
    return true;
  });
}
function total(rows) { return withDerived(rows.reduce((o, r) => addInto(o, r), emptyAgg())); }
function groupBy(rows, key) {
  const m = new Map();
  rows.forEach(r => { const k = r[key]; if (!m.has(k)) m.set(k, emptyAgg()); addInto(m.get(k), r); });
  return [...m.entries()].map(([k, v]) => Object.assign({ key: k, name: nameOf[key] ? nameOf[key](k) : k }, withDerived(v)));
}
function groupBy2(rows, keys) {
  const m = new Map();
  rows.forEach(r => {
    const k = keys.map(x => r[x]).join('␟');
    if (!m.has(k)) m.set(k, { _k: keys.map(x => r[x]), agg: emptyAgg() });
    addInto(m.get(k).agg, r);
  });
  return [...m.values()].map(v => {
    const o = withDerived(v.agg);
    keys.forEach((x, i) => o[x] = nameOf[x] ? nameOf[x](v._k[i]) : v._k[i]);
    o._raw = v._k;
    return o;
  });
}

const DIM_DEFS = [
  { key: 'campaign', label: 'Campaign' }, { key: 'adgroup', label: 'Ad group' }, { key: 'ad', label: 'Ad' },
  { key: 'segment', label: 'Audience segment' }, { key: 'placement', label: 'Placement' },
  { key: 'banner', label: 'Retail banner' }, { key: 'channel', label: 'Purchase channel' },
  { key: 'creative', label: 'Creative' }, { key: 'category', label: 'Product category' },
  { key: 'product', label: 'Product' }, { key: 'upc', label: 'UPC' }, { key: 'week', label: 'Week' }
];
const HIERARCHY = ['campaign', 'adgroup', 'ad'];

/* ==================================================================
   DERIVE — build the shape the story engine expects, from the facts.
   Nothing here invents a measure: everything is aggregated or declared.
================================================================== */

const BENCH = {
  ctr:        { measured: 0.22, partner: 0.58, label: 'comparable campaigns' },
  convRate:   { measured: 0.19, partner: 0.09, label: 'comparable campaigns' },
  cpBuyer:    { measured: 3.40, partner: 7.80, label: 'comparable campaigns' },
  repeatRate: { measured: 7.40, partner: null, label: 'comparable campaigns' }
};

/* a deterministic little helper for the things that live outside the fact table */
function hashSeed(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; }

function deriveCampaign(cmId, extraFilter) {
  const def = CAMPAIGN_BY_ID[cmId];
  const rows = filterFacts(Object.assign({ campaigns: [cmId] }, extraFilter || {}));
  const T0 = total(rows);
  const wFrom = weekById(def.from), wTo = weekById(def.to);
  const today = weekById('w40');                       // "now" = week 40
  const liveWeeks = WEEKS.filter(w => w.idx >= wFrom.idx && w.idx <= Math.min(wTo.idx, today.idx));
  const seed = hashSeed(cmId);

  /* ---- totals ---- */
  const exposable = [...new Set(def.adgroups.map(g => g.segment))].reduce((s, id) => s + SEGMENTS.find(x => x.id === id).size, 0);
  const reached = Math.round(T0.impressions / (def.provenance === 'partner' ? 2.1 : 9.3));
  const T = Object.assign({}, T0, {
    estImpressions: def.plannedImpressions,
    estCpm: def.plannedSpend / def.plannedImpressions * 1000,
    estSpend: def.plannedSpend,
    exposable: Math.round(exposable),
    exported: Math.round(exposable * 1.08),
    targeted: Math.round(exposable),
    exposed: def.provenance === 'partner' ? null : Math.round(reached * 1.08),
    reached: reached,
    frequency: T0.impressions / reached,
    transactions: T0.txns,
    convRate: T0.buyers / exposable * 100,
    margin: def.provenance === 'partner' ? null : T0.sales * 0.295,
    repeatBuyers: def.provenance === 'partner' ? null : Math.round(T0.buyers * (0.082 + seed * 0.03)),
    repeatRate: def.provenance === 'partner' ? null : (0.082 + seed * 0.03) * 100,
    ecomShare: def.provenance === 'partner' ? null : (() => {
      const ec = rows.filter(r => r.channel === 'E-commerce').reduce((s, r) => s + r.sales, 0);
      return T0.sales ? ec / T0.sales * 100 : null;
    })(),
    catEcomShare: 3.0,
    avgTTP: def.provenance === 'partner' ? null : 96 + seed * 40,
    medTTP: def.provenance === 'partner' ? null : 54 + seed * 30
  });

  /* ---- cuts ---- */
  const segShare = {};
  [...new Set(def.adgroups.map(g => g.segment))].forEach(id => {
    const s = SEGMENTS.find(x => x.id === id);
    segShare[s.name] = s.size;
  });
  const mkCut = (key, label, noun, metrics, hasOwnAudience, exposableFor) => {
    const g = groupBy(rows, key).filter(r => r.buyers > 0);
    if (g.length < 2) return null;
    return {
      label, noun, metrics, hasOwnAudience,
      rows: g.map(r => ({
        name: r.name, buyers: r.buyers, sales: r.sales, txns: r.txns,
        impressions: r.impressions, clicks: r.clicks, spend: r.spend,
        salesPerBuyer: r.salesPerBuyer, avgTxn: r.avgTxn,
        exposable: exposableFor ? exposableFor(r) : null
      })).sort((a, b) => b.sales - a.sales)
    };
  };
  const cuts = {};
  const add = (k, c) => { if (c) cuts[k] = c; };
  add('segment', mkCut('segment', 'Audience segment', 'audience', ['convRate', 'buyers', 'sales', 'salesPerBuyer', 'ctr', 'cpBuyer'], true, r => Math.round(segShare[r.name] || 0) || null));
  add('adgroup', mkCut('adgroup', 'Ad group', 'ad group', ['ctr', 'salesPerK', 'sales', 'buyers', 'cpBuyer'], false));
  add('ad', mkCut('ad', 'Ad', 'ad', ['ctr', 'salesPerK', 'buyers', 'sales'], false));
  add('placement', mkCut('placement', 'Placement', 'placement', ['ctr', 'salesPerK', 'sales', 'buyers', 'cpBuyer'], false));
  add('banner', mkCut('banner', 'Retail banner', 'banner', ['sales', 'buyers', 'ctr'], false));
  add('channel', mkCut('channel', 'Purchase channel', 'channel', ['sales', 'buyers', 'avgTxn'], false));
  add('product', mkCut('product', 'Product', 'product', ['sales', 'buyers', 'avgTxn'], false));
  add('creative', mkCut('creative', 'Creative', 'creative', ['ctr', 'salesPerK', 'buyers', 'sales'], false));

  /* ---- funnel ---- */
  const funnel = def.provenance === 'partner'
    ? [{ name: 'Exported Shoppers', value: T.exported }, { name: 'Targeted Shoppers', value: T.targeted },
       { name: 'Reached Shoppers', value: T.reached }, { name: 'Attributed Buyers', value: T.buyers }]
    : [{ name: 'Exported Shoppers', value: T.exported }, { name: 'Targeted Shoppers', value: T.targeted },
       { name: 'Exposed Shoppers', value: T.exposed }, { name: 'Reached Shoppers', value: T.reached },
       { name: 'Attributed Buyers', value: T.buyers }];

  /* ---- by week ---- */
  const byWeek = groupBy(rows, 'week');
  const wk = liveWeeks.map(w => byWeek.find(b => b.key === w.id) || { impressions: 0, clicks: 0, sales: 0 });
  const isLive = def.state === 'live';
  const daily = {
    labels: liveWeeks.map(w => w.label),
    impressions: wk.map(x => Math.round(x.impressions / 1000)),
    clicks: wk.map(x => +(x.clicks / 1000).toFixed(1)),
    sales: wk.map(x => Math.round(x.sales / 1000)),
    maturedTo: isLive ? Math.max(1, liveWeeks.length - 2) : liveWeeks.length
  };

  /* ---- profile, timing, quality: declared tables, not in the fact grain ---- */
  const p1 = Math.round(38 + seed * 14);
  const profile = def.provenance === 'partner' ? null : {
    lifestage: { label: 'Lifestage', names: ['Families', 'Young adults 18–39', 'Older couples 40–64', '65 and over'],
      campaign: [p1, Math.round(23 - seed * 3), Math.round(22 - seed * 2), 100 - p1 - Math.round(23 - seed * 3) - Math.round(22 - seed * 2)],
      category: [38, 24, 22, 16] },
    consostyle: { label: 'Consostyle', names: ['Gourmet', 'Nutrition', 'Convenience', 'Budget', 'Deal seekers'],
      campaign: [Math.round(24 + seed * 10), 24, 19, 15, 100 - Math.round(24 + seed * 10) - 24 - 19 - 15],
      category: [21, 22, 24, 18, 15] }
  };
  const ttp = def.provenance === 'partner' ? null :
    { buckets: ['<24h', '1–2d', '2–3d', '3–5d', '5–7d', '7–9d', '9–11d', '11–13d', '13–14d'], values: [34, 22, 14, 9, 7, 5, 4, 3, 2] };
  const quality = def.provenance === 'partner'
    ? [{ name: 'Campaign ID recognition rate', value: 100, floor: 98, unit: '%' },
       { name: 'Partner file freshness', value: 4, floor: null, unit: ' days' }]
    : [{ name: 'Shopper identity match rate', value: +(94.4 + seed * 3).toFixed(1), floor: 95, unit: '%' },
       { name: 'Campaign ID recognition rate', value: 99.8, floor: 98, unit: '%' },
       { name: 'Product mapping rate', value: +(96.2 + seed * 2).toFixed(1), floor: 95, unit: '%' },
       { name: 'Attribution eligibility rate', value: +(86.5 + seed * 4).toFixed(1), floor: 85, unit: '%' },
       { name: 'Attribution link creation rate', value: +(93.1 + seed * 3).toFixed(1), floor: 90, unit: '%' },
       { name: 'Late-arriving data rate', value: +(1.2 + seed).toFixed(1), floor: null, unit: '%' }];

  const windowCloses = new Date(wTo.start.getTime() + (6 + def.windowDays) * 864e5);
  return {
    id: cmId, name: def.name, advertiser: PROGRAM.advertiser, kind: def.kind,
    provenance: def.provenance, state: def.state, note: def.note,
    flight: `${wFrom.label} – ${new Date(wTo.start.getTime() + 6 * 864e5).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}`,
    windowDays: def.windowDays,
    windowCloses: windowCloses.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }),
    day: Math.min((today.idx - wFrom.idx + 1) * 7, (wTo.idx - wFrom.idx + 1) * 7),
    ofDays: (wTo.idx - wFrom.idx + 1) * 7,
    maturity: def.state === 'live' ? 'Maturing' : 'Final',
    products: def.products.map(p => PRODUCTS.find(x => x.id === p).name).join(', '),
    productCount: def.products.length,
    hasPlan: true, budget: def.plannedSpend,
    adgroupCount: def.adgroups.length,
    adCount: def.adgroups.reduce((s, g) => s + g.ads.length, 0),
    segments: [...new Set(def.adgroups.map(g => SEGMENTS.find(s => s.id === g.segment).name))],
    T, cuts, funnel, daily, profile, ttp, quality
  };
}

/* benchmark lookup keyed by provenance rather than campaign id */
function benchFor(k, c) { const b = BENCH[k]; return b ? b[c.provenance] : null; }

/* ==================================================================
   Charts — drawn from the same numbers the engine reasons about
================================================================== */
const C = { teal: '#0F6E5C', purple: '#463BA0', amber: '#A8741A', grey: '#B9BFC4', ink: '#111820', mid: '#78899A', faint: '#E5E9E7', red: '#A33A2A' };
const PIE = ['#0F6E5C', '#463BA0', '#A8741A', '#7FB5A9', '#9A93C9'];
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function sv(w, h, inner, label) {
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${esc(label || 'chart')}" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;
}
function tx(x, y, s, o = {}) {
  const fam = o.cond ? "'IBM Plex Sans Condensed'" : "'IBM Plex Mono'";
  return `<text x="${x}" y="${y}" font-family="${fam}" font-size="${o.size || 10}" fill="${o.fill || C.mid}" text-anchor="${o.anchor || 'start'}" font-weight="${o.weight || 400}">${esc(s)}</text>`;
}

/* actual vs planned */
function cPaired(c, f, w, h) {
  const T = c.T, big = h > 170;
  const pairs = f.type === 'plan_cpm'
    ? [{ lab: 'CPM', a: T.cpm, e: T.estCpm, fa: F.money2(T.cpm), fe: F.money2(T.estCpm) }]
    : [{ lab: 'Impressions', a: T.impressions, e: T.estImpressions, fa: F.compact(T.impressions), fe: F.compact(T.estImpressions) },
       { lab: 'CPM', a: T.cpm, e: T.estCpm, fa: F.money2(T.cpm), fe: F.money2(T.estCpm) }];
  const base = h - (big ? 34 : 26), gw = w / pairs.length, bw = Math.min(big ? 56 : 34, gw / 3.4);
  let o = `<line x1="0" y1="${base}" x2="${w}" y2="${base}" stroke="#D3D8D6"/>`;
  pairs.forEach((p, i) => {
    const mx = Math.max(p.a, p.e), cx = i * gw + gw / 2;
    const ha = p.a / mx * (base - 24), he = p.e / mx * (base - 24);
    o += `<rect x="${cx - bw - 3}" y="${base - ha}" width="${bw}" height="${ha}" fill="${C.purple}"/>`
      + `<rect x="${cx + 3}" y="${base - he}" width="${bw}" height="${he}" fill="${C.grey}"/>`
      + tx(cx - bw / 2 - 3, base - ha - 7, p.fa, { size: big ? 14 : 11, fill: C.ink, anchor: 'middle', weight: 500 })
      + tx(cx + bw / 2 + 3, base - he - 7, p.fe, { size: big ? 11 : 9, anchor: 'middle' })
      + tx(cx, base + 15, p.lab, { size: big ? 11.5 : 10, fill: '#41505F', anchor: 'middle', cond: 1, weight: 600 })
      + (big ? tx(cx, base + 29, 'actual · planned', { size: 9.5, anchor: 'middle' }) : '');
  });
  return sv(w, h, o, 'Actual against planned');
}

/* breakdown bars, with the leader marked */
function cBars(c, f, w, h) {
  const cut = c.cuts[f.chart.cut], m = METRICS[f.chart.metric], T = c.T;
  const media = ['impressions', 'clicks', 'ctr'].includes(f.chart.metric);
  const big = h > 170, L = big ? 180 : 130, RP = big ? 84 : 60;
  const pad = 18;
  let data = cut.rows.map(r => ({ name: r.name, v: m.get(r, T) })).filter(d => d.v != null)
    .sort((a, b) => m.lowerBetter ? a.v - b.v : b.v - a.v);
  const rh = (h - pad - 6) / data.length - (big ? 9 : 6), mx = Math.max(...data.map(d => d.v)) || 1;
  const ref = m.total(T);
  let o = '';
  data.forEach((d, i) => {
    const y = pad + i * (rh + (big ? 9 : 6)), bw = Math.max(1, d.v / mx * (w - L - RP));
    const isHit = d.name === f.slice || (f.v && f.v.weak && d.name === f.v.weak.name) || (f.v && f.v.strong && d.name === f.v.strong.name);
    const col = f.type === 'mismatch'
      ? (f.v.strong.name === d.name ? C.teal : (f.v.weak.name === d.name ? C.amber : C.grey))
      : (isHit ? (media ? C.purple : C.teal) : '#C7D2CE');
    o += `<rect x="${L}" y="${y}" width="${bw}" height="${rh}" fill="${col}"/>`
      + tx(L - 8, y + rh / 2 + 4, shortName(d.name), { size: big ? 11.5 : 9.5, fill: isHit ? C.ink : '#5B6775', anchor: 'end', cond: 1, weight: isHit ? 700 : 600 })
      + tx(L + bw + 7, y + rh / 2 + 4, m.fmt(d.v), { size: big ? 12.5 : 10.5, fill: isHit ? C.ink : '#5B6775', weight: isHit ? 600 : 400 });
  });
  if (ref) {
    const bx = L + ref / mx * (w - L - RP);
    o += `<line x1="${bx}" y1="${pad - 6}" x2="${bx}" y2="${h - 4}" stroke="${C.ink}" stroke-width="1.2" stroke-dasharray="4 3" opacity=".55"/>`
      + tx(Math.min(bx + 5, w - 140), pad - 10, 'campaign average ' + m.fmt(ref), { size: big ? 10 : 8.5, fill: '#41505F', cond: 1, weight: 600 });
  }
  return sv(w, h, o, 'Breakdown');
}

/* funnel */
function cFunnel(c, f, w, h) {
  const steps = c.funnel, big = h > 170;
  const L = big ? 150 : 110, rh = (h - 4) / steps.length - (big ? 9 : 6), mx = steps[0].value;
  let o = '';
  steps.forEach((s, i) => {
    const y = i * (rh + (big ? 9 : 6));
    const bw = Math.max(26, Math.sqrt(s.value / mx) * (w - L - (big ? 104 : 74)));
    const last = i === steps.length - 1;
    const isDrop = f.type === 'funnel_drop' && (s.name === f.v.to.name);
    o += `<rect x="${L}" y="${y}" width="${bw}" height="${rh}" fill="${last ? C.teal : (isDrop ? C.amber : C.purple)}" opacity="${last || isDrop ? 1 : 1 - .1 * i}"/>`
      + tx(L - 8, y + rh / 2 + 4, big ? s.name : s.name.replace(' Shoppers', ''), { size: big ? 11.5 : 9.5, fill: '#41505F', anchor: 'end', cond: 1, weight: 600 })
      + tx(L + bw + 8, y + rh / 2 + 4, F.compact(s.value), { size: big ? 12.5 : 10.5, fill: C.ink, weight: 500 });
    if (i > 0 && f.type === 'funnel_drop' && s.name === f.v.to.name) {
      o += tx(L + bw + 8, y + rh / 2 + (big ? 17 : 14), '−' + F.pct1(f.v.drop * 100), { size: big ? 10.5 : 9, fill: C.amber, weight: 600 });
    }
  });
  return sv(w, h, o, 'Audience funnel');
}

/* headline number + comparison */
function cBigNum(c, f, w, h) {
  const big = h > 170;
  const b = f.v, k = f.metric;
  const fmt = k === 'cpBuyer' ? F.money2 : (k === 'ctr' ? F.pct2 : F.pct3);
  const name = { ctr: 'Click-through rate', convRate: 'Conversion rate', cpBuyer: 'Cost per buyer' }[k] || 'This campaign';
  const col = b.better ? C.teal : C.amber;
  let o = tx(0, big ? 44 : 32, fmt(b.actual), { size: big ? 48 : 32, fill: col, weight: 500 })
    + tx(0, big ? 66 : 50, name + ' · this campaign', { size: big ? 12 : 10.5, fill: '#41505F', cond: 1, weight: 600 });
  const barY = big ? 90 : 66, bh = big ? 22 : 15, L = 0, W = w - (big ? 90 : 70);
  const mx = Math.max(b.actual, b.bench);
  [[b.actual, col, 'This campaign'], [b.bench, C.grey, 'Comparable campaigns']].forEach((p, i) => {
    const y = barY + i * (bh + (big ? 26 : 19));
    o += `<rect x="${L}" y="${y}" width="${Math.max(4, p[0] / mx * W)}" height="${bh}" fill="${p[1]}"/>`
      + tx(L, y - 5, p[2], { size: big ? 10.5 : 9, fill: '#41505F', cond: 1, weight: 600 })

}

/* repeat buyers */
function cRepeat(c, f, w, h) {

  const L = 0, W = w - (big ? 96 : 72), barY = big ? 92 : 68, bh = big ? 24 : 16;
  [['Attributed buyers', T.buyers, C.teal], ['Repeat buyers', T.repeatBuyers, C.amber]].forEach((p, i) => {
    const y = barY + i * (bh + (big ? 28 : 20));
    const bw = Math.max(4, p[1] / T.buyers * W);
    o += `<rect x="${L}" y="${y}" width="${bw}" height="${bh}" fill="${p[2]}"/>`
      + tx(L, y - 5, p[0], { size: big ? 10.5 : 9, fill: '#41505F', cond: 1, weight: 600 })
