CAMPAIGN_DEFS.forEach(c => c.adgroups.forEach(g => {
  ADGROUPS.push(Object.assign({ campaign: c.id }, g));
  g.ads.forEach(a => ADS.push(Object.assign({ campaign: c.id, adgroup: g.id }, a)));
}));
const nameOf = {
  campaign: id => (CAMPAIGN_BY_ID[id] || {}).name || id,
  adgroup: id => (ADGROUPS.find(g => g.id === id) || {}).name || id,
  ad: id => (ADS.find(a => a.id === id) || {}).name || id
};

/* The decomposition chain. Every step below is a measured quantity:
     all brand sales by reached shoppers  →  what we can link to an ad  →  how it splits.
   Nothing here needs a control group. */
(function decomposition() {
  FACTS.forEach(r => {
    const cm = CAMPAIGN_BY_ID[r.campaign];
    // of the brand buying these shoppers did in the window, the share a qualifying exposure precedes
    const linkRate = cm.provenance === 'partner' ? 0.34 : (/Email/i.test(cm.kind) ? 0.61 : 0.48);
    r.allBrandSales = +(r.sales / linkRate).toFixed(2);
    r.unlinkedSales = +(r.allBrandSales - r.sales).toFixed(2);
    // post-click against post-view, within what we credit
    const clickShare = cm.provenance === 'partner' ? 0.41 : (/Email/i.test(cm.kind) ? 0.72 : 0.27);
    r.clickSales = +(r.sales * clickShare).toFixed(2);
    r.viewSales = +(r.sales - r.clickSales).toFixed(2);
  });
})();

/* ---------- aggregation ---------- */
const MEASURE_DEFS = {
  impressions: { label: 'Impressions', fmt: v => F.compact(v), sum: true },
  clicks:      { label: 'Clicks', fmt: v => F.compact(v), sum: true },
  spend:       { label: 'Media spend', fmt: v => F.money(v), sum: true },
  buyers:      { label: 'Attributed buyers', fmt: v => F.int(v), sum: true },
  newBuyers:   { label: 'New-to-brand buyers', fmt: v => F.int(v), sum: true },
  lapsedBuyers:{ label: 'Lapsed buyers won back', fmt: v => F.int(v), sum: true },
  directSales: { label: 'Direct sales (promoted products)', fmt: v => F.moneyC(v), sum: true },
  haloSales:   { label: 'Halo sales (brand\'s other products)', fmt: v => F.moneyC(v), sum: true },
  allBrandSales:{ label: 'All brand sales by reached shoppers', fmt: v => F.moneyC(v), sum: true },
  unlinkedSales:{ label: 'Brand sales we cannot link to an ad', fmt: v => F.moneyC(v), sum: true },
  clickSales:  { label: 'Sales after a click', fmt: v => F.moneyC(v), sum: true },
  viewSales:   { label: 'Sales after a view only', fmt: v => F.moneyC(v), sum: true },
  newBuyerSales:{ label: 'Sales to new or lapsed buyers', fmt: v => F.moneyC(v), sum: true },
  existingBuyerSales:{ label: 'Sales to existing buyers', fmt: v => F.moneyC(v), sum: true },
  linkRate:    { label: 'Share of brand sales we can link', fmt: v => F.pct1(v), derive: r => r.allBrandSales ? r.sales / r.allBrandSales * 100 : null },
  sales:       { label: 'Attributed sales', fmt: v => F.moneyC(v), sum: true },
  txns:        { label: 'Attributed transactions', fmt: v => F.int(v), sum: true },
  units:       { label: 'Attributed units', fmt: v => F.int(v), sum: true },
  ctr:         { label: 'Click-through rate', fmt: v => F.pct2(v), derive: r => r.impressions ? r.clicks / r.impressions * 100 : null },
  cpm:         { label: 'CPM', fmt: v => F.money2(v), derive: r => r.impressions ? r.spend / r.impressions * 1000 : null },
  roas:        { label: 'Attributed ROAS', fmt: v => F.x(v), derive: r => r.spend ? r.sales / r.spend : null },
  cpBuyer:     { label: 'Cost per buyer', fmt: v => F.money2(v), derive: r => r.buyers ? r.spend / r.buyers : null },
  salesPerBuyer:{ label: 'Sales per buyer', fmt: v => F.money2(v), derive: r => r.buyers ? r.sales / r.buyers : null },
  avgTxn:      { label: 'Average transaction', fmt: v => F.money2(v), derive: r => r.txns ? r.sales / r.txns : null },
  unitsPerTxn: { label: 'Units per transaction', fmt: v => F.dec(v), derive: r => r.txns ? r.units / r.txns : null },
  pricePerUnit:{ label: 'Price per unit', fmt: v => F.money2(v), derive: r => r.units ? r.sales / r.units : null },
  newShare:    { label: 'New-to-brand share', fmt: v => F.pct1(v), derive: r => r.buyers ? (r.newBuyers + r.lapsedBuyers) / r.buyers * 100 : null },
  cpNewBuyer:  { label: 'Cost per new or lapsed buyer', fmt: v => F.money2(v), derive: r => (r.newBuyers + r.lapsedBuyers) ? r.spend / (r.newBuyers + r.lapsedBuyers) : null }
};
const SUM_KEYS = ['impressions', 'clicks', 'spend', 'buyers', 'sales', 'txns', 'units', 'newBuyers', 'lapsedBuyers', 'directSales', 'haloSales', 'allBrandSales', 'unlinkedSales', 'clickSales', 'viewSales', 'newBuyerSales', 'existingBuyerSales'];

function emptyAgg() { const o = {}; SUM_KEYS.forEach(k => o[k] = 0); return o; }
function addInto(o, r) { SUM_KEYS.forEach(k => o[k] += r[k] || 0); return o; }
function withDerived(o) {
  Object.keys(MEASURE_DEFS).forEach(k => { const d = MEASURE_DEFS[k].derive; if (d) o[k] = d(o); });
  return o;
}

function filterFacts(f) {
  return FACTS.filter(r => {
    if (f.campaigns && f.campaigns.length && !f.campaigns.includes(r.campaign)) return false;
    if (f.adgroups && f.adgroups.length && !f.adgroups.includes(r.adgroup)) return false;
    if (f.ads && f.ads.length && !f.ads.includes(r.ad)) return false;
    if (f.weekFrom && weekById(r.week).idx < weekById(f.weekFrom).idx) return false;
    if (f.weekTo && weekById(r.week).idx > weekById(f.weekTo).idx) return false;
    if (f.dims) for (const k in f.dims) { const v = f.dims[k]; if (v && v.length && !v.includes(r[k])) return false; }
    return true;
  });
}
function total(rows) { return withDerived(rows.reduce((o, r) => addInto(o, r), emptyAgg())); }
function groupBy(rows, key) {
  const m = new Map();
  rows.forEach(r => { const k = r[key]; if (!m.has(k)) m.set(k, emptyAgg()); addInto(m.get(k), r); });
  return [...m.entries()].map(([k, v]) => Object.assign({ key: k, name: nameOf[key] ? nameOf[key](k) : k }, withDerived(v)));
}
function groupBy2(rows, keys) {
  const m = new Map();
  rows.forEach(r => {
    const k = keys.map(x => r[x]).join('␟');
    if (!m.has(k)) m.set(k, { _k: keys.map(x => r[x]), agg: emptyAgg() });
    addInto(m.get(k).agg, r);
  });
  return [...m.values()].map(v => {
    const o = withDerived(v.agg);
    keys.forEach((x, i) => o[x] = nameOf[x] ? nameOf[x](v._k[i]) : v._k[i]);
    o._raw = v._k;
    return o;
  });
}

const DIM_DEFS = [
  { key: 'campaign', label: 'Campaign' }, { key: 'adgroup', label: 'Ad group' }, { key: 'ad', label: 'Ad' },
  { key: 'segment', label: 'Audience segment' }, { key: 'placement', label: 'Placement' },
  { key: 'banner', label: 'Retail banner' }, { key: 'channel', label: 'Purchase channel' },
  { key: 'creative', label: 'Creative' }, { key: 'category', label: 'Product category' },
  { key: 'product', label: 'Product' }, { key: 'upc', label: 'UPC' }, { key: 'week', label: 'Week' }
];
const HIERARCHY = ['campaign', 'adgroup', 'ad'];

/* ==================================================================
   DERIVE — build the shape the story engine expects, from the facts.
   Nothing here invents a measure: everything is aggregated or declared.
================================================================== */

const BENCH = {
  onsite_search:  { ctr: 0.22, convRate: 0.19, cpBuyer: 3.40, repeatRate: 7.4, label: 'comparable onsite sponsored-product campaigns' },
  onsite_display: { ctr: 0.12, convRate: 0.14, cpBuyer: 4.10, repeatRate: 6.8, label: 'comparable onsite display campaigns' },
  email:          { ctr: 4.80, convRate: 1.90, cpBuyer: 1.60, repeatRate: 9.1, label: 'comparable email campaigns' },
  walled:         { ctr: 0.58, convRate: 0.09, cpBuyer: 7.80, repeatRate: null, label: 'comparable offsite campaigns' }
};
function benchKey(def) {
  if (def.provenance === 'partner') return 'walled';
  if (/Email/i.test(def.kind)) return 'email';
  if (/display/i.test(def.kind)) return 'onsite_display';
  return 'onsite_search';
}

/* a deterministic little helper for the things that live outside the fact table */
function hashSeed(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; }

function deriveCampaign(cmId, extraFilter) {
  const def = CAMPAIGN_BY_ID[cmId];
  const rows = filterFacts(Object.assign({ campaigns: [cmId] }, extraFilter || {}));
  const T0 = total(rows);
  const wFrom = weekById(def.from), wTo = weekById(def.to);
  const today = weekById('w40');                       // "now" = week 40
  const liveWeeks = WEEKS.filter(w => w.idx >= wFrom.idx && w.idx <= Math.min(wTo.idx, today.idx));
  const seed = hashSeed(cmId);

  /* ---- totals ---- */
  const exposable = [...new Set(def.adgroups.map(g => g.segment))].reduce((s, id) => s + SEGMENTS.find(x => x.id === id).size, 0);
  const reached = Math.round(T0.impressions / (def.provenance === 'partner' ? 2.1 : 9.3));
  const T = Object.assign({}, T0, {
    estImpressions: def.plannedImpressions,
    estCpm: def.plannedSpend / def.plannedImpressions * 1000,
    estSpend: def.plannedSpend,
    exposable: Math.round(exposable),
    exported: Math.round(exposable * 1.08),
    targeted: Math.round(exposable),
    exposed: def.provenance === 'partner' ? null : Math.round(reached * 1.08),
    reached: reached,
    frequency: T0.impressions / reached,
    transactions: T0.txns,
    convRate: T0.buyers / exposable * 100,
    margin: def.provenance === 'partner' ? null : T0.sales * 0.295,
    repeatBuyers: def.provenance === 'partner' ? null : Math.round(T0.buyers * (0.082 + seed * 0.03)),
    repeatRate: def.provenance === 'partner' ? null : (0.082 + seed * 0.03) * 100,
    ecomShare: def.provenance === 'partner' ? null : (() => {
      const ec = rows.filter(r => r.channel === 'E-commerce').reduce((s, r) => s + r.sales, 0);
      return T0.sales ? ec / T0.sales * 100 : null;
    })(),
    catEcomShare: 3.0,
    newShare: T0.buyers ? (T0.newBuyers + T0.lapsedBuyers) / T0.buyers * 100 : null,
    cpNewBuyer: (T0.newBuyers + T0.lapsedBuyers) ? T0.spend / (T0.newBuyers + T0.lapsedBuyers) : null,
    haloShare: T0.sales ? T0.haloSales / T0.sales * 100 : null,
    avgTTP: def.provenance === 'partner' ? null : 96 + seed * 40,
    medTTP: def.provenance === 'partner' ? null : 54 + seed * 30
  });

  /* ---- cuts ---- */
  const segShare = {};
  [...new Set(def.adgroups.map(g => g.segment))].forEach(id => {
    const s = SEGMENTS.find(x => x.id === id);
    segShare[s.name] = s.size;
  });
  const mkCut = (key, label, noun, metrics, hasOwnAudience, exposableFor) => {
    const g = groupBy(rows, key).filter(r => r.buyers > 0);
    if (g.length < 2) return null;
    return {
      label, noun, metrics, hasOwnAudience,
      rows: g.map(r => ({
        name: r.name, buyers: r.buyers, sales: r.sales, txns: r.txns,
        impressions: r.impressions, clicks: r.clicks, spend: r.spend,
        newBuyers: r.newBuyers, lapsedBuyers: r.lapsedBuyers, directSales: r.directSales, haloSales: r.haloSales,
        salesPerBuyer: r.salesPerBuyer, avgTxn: r.avgTxn,
        exposable: exposableFor ? exposableFor(r) : null
      })).sort((a, b) => b.sales - a.sales)
    };
  };
  const cuts = {};
  const add = (k, c) => { if (c) cuts[k] = c; };
  add('segment', mkCut('segment', 'Audience segment', 'audience', ['convRate', 'buyers', 'sales', 'salesPerBuyer', 'ctr', 'cpBuyer', 'newShare', 'cpNewBuyer'], true, r => Math.round(segShare[r.name] || 0) || null));
  add('adgroup', mkCut('adgroup', 'Ad group', 'ad group', ['ctr', 'salesPerK', 'sales', 'buyers', 'cpBuyer'], false));
  add('ad', mkCut('ad', 'Ad', 'ad', ['ctr', 'salesPerK', 'buyers', 'sales'], false));
  add('placement', mkCut('placement', 'Placement', 'placement', ['ctr', 'salesPerK', 'sales', 'buyers', 'cpBuyer'], false));
  add('banner', mkCut('banner', 'Retail banner', 'banner', ['sales', 'buyers', 'ctr'], false));
  add('channel', mkCut('channel', 'Purchase channel', 'channel', ['sales', 'buyers', 'avgTxn'], false));
  add('product', mkCut('product', 'Product', 'product', ['sales', 'buyers', 'avgTxn'], false));
  add('creative', mkCut('creative', 'Creative', 'creative', ['ctr', 'salesPerK', 'buyers', 'sales'], false));

  /* ---- funnel ---- */
  const funnel = def.provenance === 'partner'
    ? [{ name: 'Exported Shoppers', value: T.exported }, { name: 'Targeted Shoppers', value: T.targeted },
       { name: 'Reached Shoppers', value: T.reached }, { name: 'Attributed Buyers', value: T.buyers }]
    : [{ name: 'Exported Shoppers', value: T.exported }, { name: 'Targeted Shoppers', value: T.targeted },
       { name: 'Exposed Shoppers', value: T.exposed }, { name: 'Reached Shoppers', value: T.reached },
       { name: 'Attributed Buyers', value: T.buyers }];

  /* ---- by week ---- */
  const byWeek = groupBy(rows, 'week');
  const wk = liveWeeks.map(w => byWeek.find(b => b.key === w.id) || { impressions: 0, clicks: 0, sales: 0 });
  const isLive = def.state === 'live';
  const daily = {
    labels: liveWeeks.map(w => w.label),
    impressions: wk.map(x => Math.round(x.impressions / 1000)),
    clicks: wk.map(x => +(x.clicks / 1000).toFixed(1)),
    sales: wk.map(x => Math.round(x.sales / 1000)),
    maturedTo: isLive ? Math.max(1, liveWeeks.length - 2) : liveWeeks.length
  };

  /* ---- profile, timing, quality: declared tables, not in the fact grain ---- */
  const p1 = Math.round(38 + seed * 14);
  const profile = def.provenance === 'partner' ? null : {
    lifestage: { label: 'Lifestage', names: ['Families', 'Young adults 18–39', 'Older couples 40–64', '65 and over'],
      campaign: [p1, Math.round(23 - seed * 3), Math.round(22 - seed * 2), 100 - p1 - Math.round(23 - seed * 3) - Math.round(22 - seed * 2)],
      category: [38, 24, 22, 16] },
    consostyle: { label: 'Consostyle', names: ['Gourmet', 'Nutrition', 'Convenience', 'Budget', 'Deal seekers'],
      campaign: [Math.round(24 + seed * 10), 24, 19, 15, 100 - Math.round(24 + seed * 10) - 24 - 19 - 15],
      category: [21, 22, 24, 18, 15] }
  };
  const ttp = def.provenance === 'partner' ? null :
    { buckets: ['<24h', '1–2d', '2–3d', '3–5d', '5–7d', '7–9d', '9–11d', '11–13d', '13–14d'], values: [34, 22, 14, 9, 7, 5, 4, 3, 2] };
  const quality = def.provenance === 'partner'
    ? [{ name: 'Campaign ID recognition rate', value: 100, floor: 98, unit: '%' },
       { name: 'Partner file freshness', value: 4, floor: null, unit: ' days' }]
    : [{ name: 'Shopper identity match rate', value: +(94.4 + seed * 3).toFixed(1), floor: 95, unit: '%' },
       { name: 'Campaign ID recognition rate', value: 99.8, floor: 98, unit: '%' },
       { name: 'Product mapping rate', value: +(96.2 + seed * 2).toFixed(1), floor: 95, unit: '%' },
       { name: 'Attribution eligibility rate', value: +(86.5 + seed * 4).toFixed(1), floor: 85, unit: '%' },
       { name: 'Attribution link creation rate', value: +(93.1 + seed * 3).toFixed(1), floor: 90, unit: '%' },
       { name: 'Late-arriving data rate', value: +(1.2 + seed).toFixed(1), floor: null, unit: '%' }];

  const windowCloses = new Date(wTo.start.getTime() + (6 + def.windowDays) * 864e5);
  return {
    id: cmId, name: def.name, advertiser: PROGRAM.advertiser, kind: def.kind,
    provenance: def.provenance, state: def.state, note: def.note,
    flight: `${wFrom.label} – ${new Date(wTo.start.getTime() + 6 * 864e5).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}`,
    windowDays: def.windowDays,
    windowCloses: windowCloses.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }),
    day: Math.min((today.idx - wFrom.idx + 1) * 7, (wTo.idx - wFrom.idx + 1) * 7),
    ofDays: (wTo.idx - wFrom.idx + 1) * 7,
    maturity: def.state === 'live' ? 'Maturing' : 'Final',
    products: def.products.map(p => PRODUCTS.find(x => x.id === p).name).join(', '),
    productCount: def.products.length,
    hasPlan: true, budget: def.plannedSpend,
    benchKey: benchKey(def), benchLabel: BENCH[benchKey(def)].label,
    adgroupCount: def.adgroups.length,
    adCount: def.adgroups.reduce((s, g) => s + g.ads.length, 0),
    segments: [...new Set(def.adgroups.map(g => SEGMENTS.find(s => s.id === g.segment).name))],
    T, cuts, funnel, daily, profile, ttp, quality
  };
}

/* benchmark lookup keyed by provenance rather than campaign id */
function benchFor(k, c) { const b = BENCH[c.benchKey || 'onsite_search']; return b ? b[k] : null; }

/* ==================================================================
   Charts — drawn from the same numbers the engine reasons about
================================================================== */
const C = { teal: '#0F6E5C', purple: '#463BA0', amber: '#A8741A', grey: '#B9BFC4', ink: '#111820', mid: '#78899A', faint: '#E5E9E7', red: '#A33A2A' };
const PIE = ['#0F6E5C', '#463BA0', '#A8741A', '#7FB5A9', '#9A93C9'];
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function sv(w, h, inner, label) {
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${esc(label || 'chart')}" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;
}
function tx(x, y, s, o = {}) {
  const fam = o.cond ? "'IBM Plex Sans Condensed'" : "'IBM Plex Mono'";
  return `<text x="${x}" y="${y}" font-family="${fam}" font-size="${o.size || 10}" fill="${o.fill || C.mid}" text-anchor="${o.anchor || 'start'}" font-weight="${o.weight || 400}">${esc(s)}</text>`;
}

/* actual vs planned */
function cPaired(c, f, w, h) {
  const T = c.T, big = h > 170;
  const pairs = f.type === 'plan_cpm'
    ? [{ lab: 'CPM', a: T.cpm, e: T.estCpm, fa: F.money2(T.cpm), fe: F.money2(T.estCpm) }]
    : [{ lab: 'Impressions', a: T.impressions, e: T.estImpressions, fa: F.compact(T.impressions), fe: F.compact(T.estImpressions) },
       { lab: 'CPM', a: T.cpm, e: T.estCpm, fa: F.money2(T.cpm), fe: F.money2(T.estCpm) }];
  const base = h - (big ? 34 : 26), gw = w / pairs.length, bw = Math.min(big ? 56 : 34, gw / 3.4);
  let o = `<line x1="0" y1="${base}" x2="${w}" y2="${base}" stroke="#D3D8D6"/>`;
  pairs.forEach((p, i) => {
    const mx = Math.max(p.a, p.e), cx = i * gw + gw / 2;
    const ha = p.a / mx * (base - 24), he = p.e / mx * (base - 24);
    o += `<rect x="${cx - bw - 3}" y="${base - ha}" width="${bw}" height="${ha}" fill="${C.purple}"/>`
      + `<rect x="${cx + 3}" y="${base - he}" width="${bw}" height="${he}" fill="${C.grey}"/>`
      + tx(cx - bw / 2 - 3, base - ha - 7, p.fa, { size: big ? 14 : 11, fill: C.ink, anchor: 'middle', weight: 500 })
      + tx(cx + bw / 2 + 3, base - he - 7, p.fe, { size: big ? 11 : 9, anchor: 'middle' })
      + tx(cx, base + 15, p.lab, { size: big ? 11.5 : 10, fill: '#41505F', anchor: 'middle', cond: 1, weight: 600 })
      + (big ? tx(cx, base + 29, 'actual · planned', { size: 9.5, anchor: 'middle' }) : '');
  });
  return sv(w, h, o, 'Actual against planned');
}

/* breakdown bars, with the leader marked */
function cBars(c, f, w, h) {
  const cut = c.cuts[f.chart.cut], m = METRICS[f.chart.metric], T = c.T;
  const media = ['impressions', 'clicks', 'ctr'].includes(f.chart.metric);
  const big = h > 170, L = big ? 180 : 130, RP = big ? 84 : 60;
  const pad = 18;
  let data = cut.rows.map(r => ({ name: r.name, v: m.get(r, T) })).filter(d => d.v != null)
    .sort((a, b) => m.lowerBetter ? a.v - b.v : b.v - a.v);
  const rh = (h - pad - 6) / data.length - (big ? 9 : 6), mx = Math.max(...data.map(d => d.v)) || 1;
  const ref = m.total(T);
  let o = '';
  data.forEach((d, i) => {
    const y = pad + i * (rh + (big ? 9 : 6)), bw = Math.max(1, d.v / mx * (w - L - RP));
    const isHit = d.name === f.slice || (f.v && f.v.weak && d.name === f.v.weak.name) || (f.v && f.v.strong && d.name === f.v.strong.name);
    const col = f.type === 'mismatch'
      ? (f.v.strong.name === d.name ? C.teal : (f.v.weak.name === d.name ? C.amber : C.grey))
      : (isHit ? (media ? C.purple : C.teal) : '#C7D2CE');
    o += `<rect x="${L}" y="${y}" width="${bw}" height="${rh}" fill="${col}"/>`
      + tx(L - 8, y + rh / 2 + 4, shortName(d.name), { size: big ? 11.5 : 9.5, fill: isHit ? C.ink : '#5B6775', anchor: 'end', cond: 1, weight: isHit ? 700 : 600 })
      + tx(L + bw + 7, y + rh / 2 + 4, m.fmt(d.v), { size: big ? 12.5 : 10.5, fill: isHit ? C.ink : '#5B6775', weight: isHit ? 600 : 400 });
  });
  if (ref) {
    const bx = L + ref / mx * (w - L - RP);
    o += `<line x1="${bx}" y1="${pad - 6}" x2="${bx}" y2="${h - 4}" stroke="${C.ink}" stroke-width="1.2" stroke-dasharray="4 3" opacity=".55"/>`
      + tx(Math.min(bx + 5, w - 140), pad - 10, 'campaign average ' + m.fmt(ref), { size: big ? 10 : 8.5, fill: '#41505F', cond: 1, weight: 600 });
  }
  return sv(w, h, o, 'Breakdown');
}

/* funnel */
function cFunnel(c, f, w, h) {
  const steps = c.funnel, big = h > 170;
  const L = big ? 150 : 110, rh = (h - 4) / steps.length - (big ? 9 : 6), mx = steps[0].value;
  let o = '';
  steps.forEach((s, i) => {
    const y = i * (rh + (big ? 9 : 6));
    const bw = Math.max(26, Math.sqrt(s.value / mx) * (w - L - (big ? 104 : 74)));
    const last = i === steps.length - 1;
    const isDrop = f.type === 'funnel_drop' && (s.name === f.v.to.name);
    o += `<rect x="${L}" y="${y}" width="${bw}" height="${rh}" fill="${last ? C.teal : (isDrop ? C.amber : C.purple)}" opacity="${last || isDrop ? 1 : 1 - .1 * i}"/>`
      + tx(L - 8, y + rh / 2 + 4, big ? s.name : s.name.replace(' Shoppers', ''), { size: big ? 11.5 : 9.5, fill: '#41505F', anchor: 'end', cond: 1, weight: 600 })
      + tx(L + bw + 8, y + rh / 2 + 4, F.compact(s.value), { size: big ? 12.5 : 10.5, fill: C.ink, weight: 500 });
    if (i > 0 && f.type === 'funnel_drop' && s.name === f.v.to.name) {
      o += tx(L + bw + 8, y + rh / 2 + (big ? 17 : 14), '−' + F.pct1(f.v.drop * 100), { size: big ? 10.5 : 9, fill: C.amber, weight: 600 });
    }

}

/* headline number + comparison */
function cBigNum(c, f, w, h) {

  let o = tx(0, big ? 44 : 32, fmt(b.actual), { size: big ? 48 : 32, fill: col, weight: 500 })
    + tx(0, big ? 66 : 50, name + ' · this campaign', { size: big ? 12 : 10.5, fill: '#41505F', cond: 1, weight: 600 });
  const barY = big ? 90 : 66, bh = big ? 22 : 15, L = 0, W = w - (big ? 90 : 70);

  [[b.actual, col, 'This campaign'], [b.bench, C.grey, 'Comparable campaigns']].forEach((p, i) => {

/* two donuts — campaign vs category */
function cDonut2(c, f, w, h) {

}

/* profile pies */
function arcPath(cx, cy, r, a0, a1) {
  const p = a => [cx + r * Math.sin(a), cy - r * Math.cos(a)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M ${cx} ${cy} L ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`;
}
function onePie(cx, cy, r, vals, hi) {
  let a = 0, o = '';
  const tot = vals.reduce((s, v) => s + v, 0) || 1;
  vals.forEach((v, i) => {
    const a1 = a + 2 * Math.PI * v / tot;
    o += `<path d="${arcPath(cx, cy, r, a, a1)}" fill="${PIE[i % PIE.length]}" stroke="#fff" stroke-width="1" opacity="${hi == null || hi === i ? 1 : .42}"/>`;
    a = a1;
  });
  return o;
}
function cPie2(c, f, w, h) {
  const p = c.profile[f.chart.attribute], big = h > 170;
  const hi = p.names.indexOf(f.v.up.n);
  const r = Math.min(big ? 72 : 46, (h - (big ? 44 : 30)) / 2), cy = r + 6;
  let o = onePie(r + 4, cy, r, p.campaign, hi) + onePie(r * 3 + 26, cy, r, p.category, hi)
    + tx(r + 4, cy + r + 18, 'Campaign buyers', { size: big ? 11 : 9, fill: '#41505F', anchor: 'middle', cond: 1, weight: 600 })
    + tx(r * 3 + 26, cy + r + 18, 'Category buyers', { size: big ? 11 : 9, fill: '#41505F', anchor: 'middle', cond: 1, weight: 600 });
  const lx = r * 4 + 48;
  p.names.forEach((n, i) => {
    const y = 14 + i * (big ? 24 : 17), d = p.campaign[i] - p.category[i];
    o += `<rect x="${lx}" y="${y - 8}" width="9" height="9" fill="${PIE[i % PIE.length]}" opacity="${hi === i ? 1 : .45}"/>`
      + tx(lx + 15, y, n, { size: big ? 11 : 9.5, fill: hi === i ? C.ink : '#5B6775', cond: 1, weight: hi === i ? 700 : 600 })
      + tx(lx + 15, y + (big ? 12 : 8.5), `${p.campaign[i]}% · ${F.pts(d)}`, { size: big ? 10 : 8.5, fill: d > 0 ? C.teal : C.mid });
  });
  return sv(w, h, o, 'Buyer profile against the category');
}

/* time to purchase */
function cHist(c, f, w, h) {
  const d = c.ttp, big = h > 170, base = h - (big ? 26 : 18);
  const n = d.values.length, bw = w / n, mx = Math.max(...d.values);
  let o = `<line x1="0" y1="${base}" x2="${w}" y2="${base}" stroke="#D3D8D6"/>`;
  d.values.forEach((v, i) => {
    const bh = v / mx * (base - 16);
    o += `<rect x="${i * bw + 2}" y="${base - bh}" width="${bw - 4}" height="${bh}" fill="${i < 3 ? C.teal : '#C7D2CE'}"/>`
      + tx(i * bw + bw / 2, base - bh - 5, v + '%', { size: big ? 10.5 : 8, fill: C.ink, anchor: 'middle', weight: 500 })
      + tx(i * bw + bw / 2, base + (big ? 15 : 12), d.buckets[i], { size: big ? 9.5 : 8, anchor: 'middle' });
  });
  return sv(w, h, o, 'Time from exposure to purchase');
}

/* daily, with the open window shaded */
function cDaily(c, f, w, h) {
  const d = c.daily, big = h > 170, base = h - (big ? 26 : 18);
  const vals = d.sales, n = vals.length, bw = w / n, mx = Math.max(...vals) || 1;
  let o = `<rect x="${d.maturedTo * bw}" y="0" width="${(n - d.maturedTo) * bw}" height="${base}" fill="${C.amber}" opacity=".1"/>`;
  vals.forEach((v, i) => {
    const bh = v / mx * (base - 8), open = i >= d.maturedTo;

  });
  o += `<line x1="0" y1="${base}" x2="${w}" y2="${base}" stroke="#D3D8D6"/>`
    + tx(d.maturedTo * bw + 5, 12, 'still filling in', { size: big ? 10.5 : 9, fill: C.amber, cond: 1, weight: 600 });
  if (big) {
    o += tx(0, h - 7, d.labels[0], { size: 10 }) + tx(w, h - 7, 'yesterday', { size: 10, anchor: 'end' });

/* data quality rows */
function cQuality(c, f, w, h) {
  const items = c.quality, big = h > 170, rh = h / items.length;

const CHART = { paired: cPaired, bars: cBars, funnel: cFunnel, bignum: cBigNum, repeat: cRepeat, donut2: cDonut2, pie2: cPie2, hist: cHist, daily: cDaily, quality: cQuality };

/* ==================================================================
   THE COMPOSER — the sixth role.
   Decides which findings share a page, which layout fits, what the
   page is called, and why they belong together. It places; it never
   computes. Every number on a slide came from the engine.

   The rule it works to: a slide has room for one chart and up to two
   supporting numbers. Leaving that space empty wastes a page, so a
   finding that can be said in one number rides along as a callout
   instead of taking a page of its own.
================================================================== */

const SMALL_CHARTS = ['paired', 'bignum', 'repeat', 'donut2', 'quality', 'daily'];
const chartSize = f => (f.chart && SMALL_CHARTS.includes(f.chart.k)) ? 'small' : 'large';

const CHAPTER_TITLES = {
  delivery: 'What we bought',
  conversion: 'Who bought',
  commerce: 'What it sold',
  shoppers: 'Who they are',
  method: 'How solid this is'
};

function compose(findings, c, goal) {
  const slides = [];
  const placed = new Set();
  const pool = findings.filter(f => f.chapter !== 'method');
  const methodFindings = findings.filter(f => f.chapter === 'method');

  /* ---- 1. cover ---- */
  slides.push({ layout: 'cover', findings: [], title: c.name, no: 1,
    reason: 'Every deck opens with what the campaign actually was, so nobody has to ask in the meeting.' });

  /* a finding can ride along as a callout if it can be said in one number */
  const canRide = f => !!f.stat && !f.opportunity && f.direction !== 'opportunity' && !f.isLead;

  /* take up to n callouts, preferring the same chapter, then anything left */
  function takeRiders(hostChapter, n) {
    const same = pool.filter(f => !placed.has(f.id) && f.chapter === hostChapter && canRide(f));
    const other = pool.filter(f => !placed.has(f.id) && f.chapter !== hostChapter && canRide(f));
    const picked = [...same, ...other].slice(0, n);
    picked.forEach(f => placed.add(f.id));
    return picked;
  }

  /* ---- 2. the lead takes the second page, with at most one rider ---- */
  const lead = findings.find(f => f.isLead && f.chapter !== 'method') || pool[0];
  if (lead) {
    placed.add(lead.id);
    const riders = takeRiders(lead.chapter, goal === 'budget' && lead.direction === 'opportunity' ? 0 : 1);
    slides.push({
      layout: 'hero', findings: [lead], riders, title: lead.title,
      reason: riders.length
        ? `The strongest finding opens the deck. ${riders.length === 1 ? 'One further number' : 'Two further numbers'} from the same part of the story sits underneath it rather than taking a page.`
        : (goal === 'budget' && lead.direction === 'opportunity'
          ? 'This is the ask, so nothing shares the page with it.'
          : 'The strongest finding opens the deck on its own.')
    });
  }

  /* ---- 3. the rest: one chart per page, riders fill the space below ---- */
  const order = ['delivery', 'conversion', 'commerce', 'shoppers'];
  let guard = 0;
  while (pool.some(f => !placed.has(f.id)) && guard++ < 40) {
    // the next unplaced finding whose chart deserves the page, in chapter order
    const remaining = pool.filter(f => !placed.has(f.id));
    const host = order.map(ch => remaining.find(f => f.chapter === ch && chartSize(f) === 'large'))
      .find(Boolean) || remaining[0];
    if (!host) break;
    placed.add(host.id);

    // a small-chart partner shares the page as a second chart; otherwise take number riders
    const partner = pool.find(f => !placed.has(f.id) && f.chapter === host.chapter && chartSize(f) === 'small');
    if (partner && chartSize(host) === 'small') {
      placed.add(partner.id);
      slides.push({
        layout: 'pair', findings: [host, partner], riders: takeRiders(host.chapter, 1),
        title: CHAPTER_TITLES[host.chapter],
        reason: `Both are ${CHAPTER_TITLES[host.chapter].toLowerCase()} findings with compact charts, so they share a page instead of leaving half of two pages empty.`
      });
    } else {
      const riders = takeRiders(host.chapter, 2);
      slides.push({
        layout: 'chartstats', findings: [host], riders, title: host.title,
        reason: riders.length
          ? `This chart needs the full width, so the ${riders.length === 1 ? 'next finding rides' : 'next two findings ride'} along the bottom as ${riders.length === 1 ? 'a number' : 'numbers'} instead of taking ${riders.length === 1 ? 'a page' : 'two pages'}.`
          : 'This chart needs the full width and nothing left fits beside it.'
      });
    }
  }

  /* ---- 4. method ---- */
  if (methodFindings.length) {
    slides.push({ layout: 'method', findings: methodFindings, riders: [], title: CHAPTER_TITLES.method,
      reason: 'The rules and the maturity belong together, in words rather than charts, and they travel with every deck.' });
  }

  /* ---- 5. the actions page ---- */
  const withReco = findings.filter(f => f.reco && f.chapter !== 'method');
  if (withReco.length) {
    slides.push({ layout: 'actions', findings: withReco.slice(0, 5), riders: [], title: 'What we would do next',
      reason: 'Every recommendation collected in one place, so the meeting ends with a list rather than a feeling.' });
  }

  slides.forEach((s, i) => { s.no = i + 1; });
  const riderCount = slides.reduce((n, s) => n + (s.riders ? s.riders.length : 0), 0);
  return {
    slides,
    stats: {
      findings: findings.length,
      slides: slides.length,
      riders: riderCount,
      shared: slides.filter(s => (s.riders && s.riders.length) || s.layout === 'pair').length,
      wouldHaveBeen: findings.length + 3
    }
  };
}

/* ---------- what needs you: the triage reason per campaign ---------- */
function attention(def, agg) {
  const out = [];
  if (def.state === 'planned') return [{ t: 'Starts ' + weekById(def.from).label, k: 'none', rank: 9 }];
  const pace = agg.impressions / def.plannedImpressions;
  const elapsed = Math.min(1, Math.max(0.05, (weekById('w40').idx - weekById(def.from).idx + 1) / (weekById(def.to).idx - weekById(def.from).idx + 1)));
  if (def.state === 'live' && pace / elapsed < 0.8) out.push({ t: 'Behind plan — ' + F.pct1(pace / elapsed * 100) + ' of the pace we sold', k: 'bad', rank: 1 });
  if (def.state === 'live' && pace / elapsed > 1.45) out.push({ t: 'Over-delivering — ' + F.x(pace / elapsed) + ' the pace, at our cost', k: 'warn', rank: 2 });
  if (def.provenance === 'partner') out.push({ t: 'Partner file only — shopper questions cannot be answered', k: 'warn', rank: 5 });
  if (def.state === 'final') out.push({ t: 'Window closed — the report is due', k: 'bad', rank: 1 });
  if (def.state === 'live' && weekById(def.to).idx - weekById('w40').idx <= 1) out.push({ t: 'Ends this week — report due in ' + def.windowDays + ' days', k: 'warn', rank: 3 });
  if (!out.length) out.push({ t: 'Running to plan', k: 'none', rank: 8 });
  return out.sort((a, b) => a.rank - b.rank);
}

function vProgram() {
  const rows = filterFacts(filt());
  const T = total(rows);
  const booked = CAMPAIGN_DEFS.reduce((s, c) => s + c.plannedSpend, 0);
  const byCam = groupBy(rows, 'campaign');
  const list = CAMPAIGN_DEFS.map(def => {
    const agg = byCam.find(r => r.key === def.id) || withDerived(emptyAgg());
    return { def, agg, att: attention(def, agg) };
  });
  if (S.sortBy === 'attention') list.sort((a, b) => a.att[0].rank - b.att[0].rank || b.agg.sales - a.agg.sales);
  else list.sort((a, b) => (b.agg[S.sortBy] || 0) - (a.agg[S.sortBy] || 0));

  const needing = list.filter(x => x.att[0].k !== 'none').length;
  const live = CAMPAIGN_DEFS.filter(c => c.state === 'live').length;

  return `<div class="wrap">
    <section class="state">
      <p class="statement">${live} campaigns running, <b>${F.money(T.spend)}</b> spent of ${F.money(booked)} booked,
        <b>${needing === 0 ? 'nothing' : needing + (needing === 1 ? ' campaign' : ' campaigns')}</b> ${needing === 1 ? 'needs' : 'need'} a decision this week.</p>
      <div class="weekpick"><span class="lbl">Conversion weeks</span>
        <select data-act="wk" data-k="weekFrom">${WEEKS.map(w => `<option value="${w.id}" ${S.weekFrom === w.id ? 'selected' : ''}>${w.label}</option>`).join('')}</select>
        <span class="to">to</span>
        <select data-act="wk" data-k="weekTo">${WEEKS.map(w => `<option value="${w.id}" ${S.weekTo === w.id ? 'selected' : ''}>${w.label}</option>`).join('')}</select>
      </div>
    </section>

    <section class="strip3">
      <div><div class="lbl">Spend against booked</div><div class="bv">${F.money(T.spend)}</div><div class="bs">${F.pct1(T.spend / booked * 100)} of ${F.money(booked)}</div></div>
      <div><div class="lbl">Attributed sales</div><div class="bv">${F.moneyC(T.sales)}</div><div class="bs">${F.int(T.buyers)} buyers · ${F.pct1(T.newShare)} new to the brand</div></div>
      <div><div class="lbl">Attributed ROAS</div><div class="bv">${F.x(T.roas)}</div><div class="bs notlift">Attributed, not incremental</div></div>
    </section>

    ${vDecomposition(T, `${CAMPAIGN_DEFS.filter(d => d.state !== 'planned').length} campaigns · weeks ${weekById(S.weekFrom).label} to ${weekById(S.weekTo).label}`)}

    <section class="panel">
      <div class="phead">
        <div><h2>Campaigns</h2><div class="note">Sorted by what needs you. Click a row to open it.</div></div>
        <div class="btnrow">
          <select data-act="sort"><option value="attention" ${S.sortBy === 'attention' ? 'selected' : ''}>Needs you first</option>
            <option value="sales" ${S.sortBy === 'sales' ? 'selected' : ''}>Attributed sales</option>
            <option value="spend" ${S.sortBy === 'spend' ? 'selected' : ''}>Spend</option>
            <option value="roas" ${S.sortBy === 'roas' ? 'selected' : ''}>ROAS</option></select>
          ${S.compare.length >= 2 ? `<button class="btn pri sm" data-act="compare">Compare ${S.compare.length} campaigns</button>` : ''}
        </div>
      </div>
      <div class="tw"><table class="dt rows">
        <thead><tr><th class="cb"></th><th>Campaign</th><th>Needs you</th><th>Numbers from</th>
          <th class="n">Spend</th><th class="n">Sales</th><th class="n">ROAS</th><th class="n">New to brand</th><th></th></tr></thead>
        <tbody>${list.map(({ def, agg, att }) => {
          const dead = def.state === 'planned';
          return `<tr class="${dead ? 'muted' : 'clickable'} ${S.campaignId === def.id ? 'sel' : ''}" ${dead ? '' : `data-act="open" data-id="${def.id}"`}>
            <td class="cb">${dead ? '' : `<input type="checkbox" data-act="cmp" data-id="${def.id}" ${S.compare.includes(def.id) ? 'checked' : ''} aria-label="Compare">`}</td>
            <td><b>${def.name}</b><div class="sub">${def.kind}</div></td>
            <td>${att.map(a => `<span class="att ${a.k}">${a.k === 'bad' ? I.warn : ''}${a.t}</span>`).join('')}</td>
            <td>${def.provenance === 'measured' ? `<span class="prov meas">${I.check} Measured</span>` : `<span class="prov part">Partner</span>`}</td>
            <td class="n">${dead ? F.money(def.plannedSpend) + ' planned' : F.money(agg.spend)}</td>
            <td class="n">${dead ? '—' : '<b>' + F.moneyC(agg.sales) + '</b>'}</td>
            <td class="n">${dead ? '—' : F.x(agg.roas)}</td>
            <td class="n">${dead ? '—' : F.pct1(agg.newShare)}</td>
            <td class="n">${dead ? '' : `<span class="go">Open ${I.chev}</span>`}</td>
          </tr>`;
        }).join('')}</tbody></table></div>
    </section>

    ${S.compare.length >= 2 ? vCompare() : ''}
  </div>`;
}

function vCompare() {
  const rows = S.compare.map(id => {
    const agg = total(filterFacts(Object.assign({ campaigns: [id] }, filt())));
    return { def: CAMPAIGN_BY_ID[id], agg };
  });
  const measures = ['spend', 'impressions', 'ctr', 'buyers', 'newShare', 'sales', 'roas', 'cpBuyer', 'cpNewBuyer'];
  const sumBuyers = rows.reduce((s, r) => s + r.agg.buyers, 0);
  return `<section class="panel warnpanel">
    <div class="phead"><h2>Comparing ${rows.length} campaigns</h2>
      <button class="btn sm" data-act="clearcmp">${I.x} Clear</button></div>
    <div class="tw"><table class="dt">
      <thead><tr><th>Measure</th>${rows.map(r => `<th class="n">${r.def.name}</th>`).join('')}</tr></thead>
      <tbody>${measures.map(k => `<tr><td>${MEASURE_DEFS[k].label}</td>${rows.map(r => `<td class="n">${MEASURE_DEFS[k].fmt(r.agg[k])}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>
    <div class="cannot">${I.lock} <b>These are shown side by side, not added up.</b>
      Attributed buyers are de-duplicated inside a campaign but not across campaigns — ${F.int(sumBuyers)} is the sum of the columns, and some shoppers appear in more than one.
      A single combined figure needs shopper-level de-duplication, which is not built yet, so the product will not print one.</div>
  </section>`;
}


/* ================================================================
   DECOMPOSITION — every step measured, nothing assumed.
   Starts from all the brand buying these shoppers did, and shows how
   much of it we can stand behind and what it is made of.
================================================================ */
function vDecomposition(T, scopeLabel, opts) {
  opts = opts || {};
  const all = T.allBrandSales || 0;
  if (!all) return '';
  const pc = v => Math.max(0.4, v / all * 100);
  const step = (label, value, sub, cls, offset) => `<div class="dstep ${cls}">
    <div class="dsl"><b>${label}</b><span>${sub}</span></div>
    <div class="dsbar"><span class="dsfill ${cls}" style="width:${pc(value)}%;margin-left:${offset || 0}%"></span></div>
    <div class="dsv">${F.moneyC(value)}<em>${F.pct1(value / all * 100)}</em></div>
  </div>`;
  const splitRow = (title, a, b, la, lb, ca, cb) => `<div class="dsplit">
    <div class="dspl">${title}</div>
    <div class="dsbar2">
      <span class="s1 ${ca}" style="width:${a / (a + b) * 100}%"><em>${la}</em><b>${F.moneyC(a)}</b></span>
      <span class="s1 ${cb}" style="width:${b / (a + b) * 100}%"><em>${lb}</em><b>${F.moneyC(b)}</b></span>
    </div></div>`;

  return `<section class="panel decomp">
    <div class="phead">
      <div><h2>What the sales are made of</h2>
        <div class="note">${scopeLabel} · every step below is counted, not modelled.</div></div>
      ${opts.right || ''}
    </div>
    <div class="dsteps">
      ${step('All brand sales by the shoppers we reached', all, `inside the attribution window`, 'all')}
      ${step('Not linked to any ad', T.unlinkedSales, 'they bought, but no qualifying exposure came first', 'unlinked', T.linkRate)}
      ${step('Attributed to this campaign', T.sales, `${F.pct1(T.linkRate)} of their brand buying`, 'attr')}
    </div>
    <div class="dsplits">
      ${splitRow('How the credit was earned', T.clickSales, T.viewSales, 'After a click', 'After a view only', 'c1', 'c2')}
      ${splitRow('What was bought', T.directSales, T.haloSales, 'Direct — promoted products', 'Halo — the brand&rsquo;s other products', 'c1', 'c3')}
      ${splitRow('Who bought it', T.newBuyerSales, T.existingBuyerSales, 'New to the brand or won back', 'Already buying the brand', 'c4', 'c5')}
    </div>
    <div class="phase2">
      <div class="p2h">${I.lock} What this decomposition cannot reach</div>
      <div class="p2grid">
        ${[['Baseline', 'what these shoppers would have bought anyway'],
           ['Cannibalisation', 'sales pulled from the brand&rsquo;s other lines'],
           ['Pull-forward', 'purchases brought earlier, not added'],
           ['True incremental', 'what the campaign actually caused']].map(x =>
          `<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}
      </div>
      <p class="p2n">All four need a group of shoppers held back before the campaign starts. This campaign has none, so the product does not estimate them — not as a bar, not as a dotted outline, not as a footnote.
        <button class="linkb" data-act="holdout">Request a hold-out on the next flight ${I.chev}</button></p>
    </div>
  </section>`;
}

/* ================================================================
   CAMPAIGN — step 1, the brief
================================================================ */
function vBrief() {
  const c = S.c, T = c.T;
  const def = CAMPAIGN_BY_ID[c.id];
  const agg = total(filterFacts({ campaigns: [c.id] }));
  const att = attention(def, agg);

  const ready = [
    { ok: true, t: 'Exposure data has arrived', d: `${F.compact(T.impressions)} impressions across ${c.adgroupCount} ad groups and ${c.adCount} ads` },
    { ok: c.provenance === 'measured', t: c.provenance === 'measured' ? 'Purchases matched to shoppers' : 'No shopper-level purchases', d: c.provenance === 'measured' ? `Identity match ${c.quality[0].value}%` : 'The partner returns totals only, so buyer, basket and profile questions cannot be answered' },
    { ok: true, t: 'Product scope is set', d: `${c.productCount} promoted items · ${c.products}` },
    { ok: true, t: 'Window is configured', d: `${c.windowDays} days post-view and post-click, last touch` },
    { ok: c.state !== 'live', t: c.state === 'live' ? 'Window is still open' : 'Window has closed', d: c.state === 'live' ? `Closes ${c.windowCloses}. Figures can still rise, so treat today's as a floor.` : `Closed ${c.windowCloses}. Figures are final.` },
    { ok: false, t: 'No control group', d: 'Incremental sales need a group held back before the campaign starts. This campaign has none, so nothing here can say the ads caused the sales.' }
  ];
  const gaps = ready.filter(r => !r.ok).length;

  const level = HIERARCHY[S.drill.length + 1] || 'ad';
  const scoped = { campaigns: [c.id] };
  if (S.drill[0]) scoped.adgroups = [S.drill[0]];
  const drillRows = groupBy(filterFacts(scoped), S.drill.length ? 'ad' : 'adgroup')
    .sort((a, b) => (b[S.drillMeasure] || 0) - (a[S.drillMeasure] || 0));
  const md = MEASURE_DEFS[S.drillMeasure];
  const mx = Math.max(...drillRows.map(r => r[S.drillMeasure] || 0)) || 1;

  return `<div class="wrap">
    <button class="backlink" data-act="place" data-k="program">${I.back} All campaigns</button>

    <section class="verdict">
      <div>
        <div class="lbl">${c.kind} · ${c.flight}</div>
        <p class="statement">${c.provenance === 'measured'
          ? `<b>${F.int(T.buyers)}</b> shoppers bought within ${c.windowDays} days of seeing this campaign, worth <b>${F.moneyC(T.sales)}</b> — <b>${F.pct1(T.newShare)}</b> of them new to the brand or won back.`
          : `The partner reports <b>${F.compact(T.impressions)}</b> impressions and <b>${F.moneyC(T.sales)}</b> of sales. Nothing below the total can be checked against our own till data.`}</p>
        <div class="vchips">${provChip(c)}<span class="att ${att[0].k}">${att[0].t}</span>
          <span class="prov neutral">${c.maturity}${c.state === 'live' ? ' · window closes ' + c.windowCloses : ''}</span></div>
      </div>
    </section>

    <section class="panel brief">
      <h2>What is this report for?</h2>
      <div class="briefgrid">
        <div><span class="lbl">Document type</span>
          <div class="chips">${Object.keys(GOALS).map(k => `<button class="chip ${S.docType === k ? 'on' : ''}" data-act="doctype" data-k="${k}">${GOALS[k].label}</button>`).join('')}</div>
          <p class="note">${GOALS[S.docType].hint}</p></div>
        <div><span class="lbl">Who it is for</span>
          <div class="chips">${['The supplier', 'Internal only', 'Supplier procurement'].map(a => `<button class="chip ${S.audience === a ? 'on' : ''}" data-act="aud" data-k="${a}">${a}</button>`).join('')}</div>
          <p class="note">Printed on the cover and in every slide footer, and it cannot be removed from the export.</p></div>
      </div>
    </section>

    <section class="panel">
      <div class="phead"><h2>Can we tell this story yet?</h2>
        <span class="lbl">${ready.length - gaps} of ${ready.length} ready</span></div>
      <div class="readylist">${ready.map(r => `<div class="rl ${r.ok ? 'ok' : 'gap'}">
        <span class="ri">${r.ok ? I.check : I.gap}</span>
        <div><b>${r.t}</b><div class="rd">${r.d}</div></div></div>`).join('')}</div>
    </section>

    <div class="cols2">
      <section class="panel">
        <h2>What we bought</h2>
        <div class="dual media">${[['Spend', F.money(T.spend), `of ${F.money(c.budget)} booked`],
          ['Impressions', F.compact(T.impressions), `${F.x(T.impressions / T.estImpressions)} the plan`],
          ['Clicks', F.compact(T.clicks), `CTR ${F.pct2(T.ctr)}`],
          ['Shoppers reached', F.compact(T.reached), `frequency ${F.dec(T.frequency)}`]].map(x =>
          `<div><div class="lbl">${x[0]}</div><div class="dv">${x[1]}</div><div class="ds">${x[2]}</div></div>`).join('')}</div>
      </section>
      <section class="panel">
        <h2>What came back</h2>
        <div class="dual sales">${[['Attributed buyers', F.int(T.buyers), `${F.pct3(T.convRate)} of those available`],
          ['New or won back', F.int(Math.round(T.buyers * T.newShare / 100)), `${F.pct1(T.newShare)} · ${F.money2(T.cpNewBuyer)} each`],
          ['Attributed sales', F.moneyC(T.sales), `${F.money2(T.salesPerBuyer)} per buyer`],
          ['Attributed ROAS', F.x(T.roas), 'not incremental']].map(x =>
          `<div><div class="lbl">${x[0]}</div><div class="dv">${x[1]}</div><div class="ds">${x[2]}</div></div>`).join('')}</div>
      </section>
    </div>

    ${c.provenance === 'measured' ? vDecomposition(c.T, `${c.name} · ${c.windowDays}-day window`) : `<section class="panel"><div class="phead"><h2>What the sales are made of</h2></div>
      <p class="cannot">${I.lock} <b>Nothing can be decomposed for a walled-garden campaign.</b> The partner returns a sales total and no shopper identities, so the product cannot say how much of it was direct or halo, how much came after a click, or how many buyers were new. The total is shown as received and never blended with measured results.</p></section>`}

    <section class="panel">
      <div class="phead">
        <div><h2>Where it came from</h2>
          <div class="crumbs">${['Campaign', ...S.drill.map(id => nameOf.adgroup(id))].map((t, i, a) =>
            `<button class="crumb ${i === a.length - 1 ? 'on' : ''}" data-act="undrill" data-i="${i}">${t}</button>${i < a.length - 1 ? `<span class="csep">${I.chev}</span>` : ''}`).join('')}</div></div>
        <select data-act="drillmeasure">${['sales', 'buyers', 'newBuyers', 'impressions', 'clicks', 'spend', 'roas', 'ctr'].map(k =>
          `<option value="${k}" ${S.drillMeasure === k ? 'selected' : ''}>${MEASURE_DEFS[k].label}</option>`).join('')}</select>
      </div>
      <div class="dbars">${drillRows.map(r => `<button class="dbar ${S.drill.length ? '' : 'can'}" ${S.drill.length ? 'disabled' : `data-act="drill" data-id="${r.key}"`}>
        <span class="dname">${r.name}</span>
        <span class="dtrack"><span class="dfill" style="width:${Math.max(1, (r[S.drillMeasure] || 0) / mx * 100)}%"></span></span>
        <span class="dval">${md.fmt(r[S.drillMeasure])}</span>
        ${S.drill.length ? '' : `<span class="dgo">${I.chev}</span>`}</button>`).join('')}</div>
    </section>

    <div class="sticky">
      <label class="sign"><input type="checkbox" data-act="sign" ${S.signed ? 'checked' : ''}>
        I have read the readiness block${gaps ? ` and the ${gaps} gap${gaps > 1 ? 's' : ''} above` : ''}</label>
      <div class="grow"></div>
      <button class="btn" data-act="place" data-k="explore">Open in Explore</button>
      <button class="btn pri ${S.signed ? '' : 'off'}" data-act="buildstory" ${S.signed ? '' : 'disabled'}>Build the story ${I.chev}</button>
    </div>
  </div>`;
}

/* ================================================================
   CAMPAIGN — step 2, the story
================================================================ */
function vStory() {
  const c = S.c, items = story();
  const setAsideCount = S.run.rejected.length + S.run.dropped.length + S.archive.length;
  let lastChapter = null;
  const cards = items.map((f, i) => {
    const head = f.chapter !== lastChapter ? `<h2 class="chsec">${CHAPTERS[f.chapter].label}</h2>` : '';
    lastChapter = f.chapter;
    return head + vFinding(f, i);
  }).join('');

  return `<div class="wrap">
    <button class="backlink" data-act="step" data-k="brief">${I.back} Back to the brief</button>
    <section class="headline">
      <div class="lbl">${docLabel()} · for ${S.audience.toLowerCase()}</div>
      <h1>${S.run.headline}</h1>
      <p class="toldline"><b>${items.length} findings told.</b> ${setAsideCount} set aside — ${S.run.rejected.length} did not hold up, ${S.run.dropped.length} were weaker or repeated a point already made${S.archive.length ? `, ${S.archive.length} removed by you` : ''}.
        <button class="linkb" data-act="setaside">See what was set aside ${I.chev}</button></p>
    </section>
    ${S.setAside ? vSetAside() : ''}
    <div class="fcards">${cards}</div>
    <div class="sticky">
      <button class="btn" data-act="step" data-k="brief">Change the brief</button>
      <div class="grow"></div>
      <button class="btn pri" data-act="step" data-k="deck">See it as slides ${I.chev}</button>
    </div>
  </div>`;
}

function vFinding(f, i) {
  const c = S.c;
  const text = S.edits[f.id] != null ? S.edits[f.id] : lockNumbers(f.sentence);
  const money = f.opportunity
    ? ` Moving <b>${F.money(f.opportunity.moved)}</b> would have been worth about <b>${F.int(f.opportunity.gained)}</b> more buyers and <b>${F.moneyC(f.opportunity.gainedSales)}</b> of sales, at the same total spend.`
    : '';
  return `<article class="fcard ${f.direction}">
    <div class="fhead"><h3>${f.title}</h3>
      <button class="ico del" data-act="remove" data-id="${f.id}" aria-label="Set aside">${I.x}</button></div>
    <div class="said" contenteditable="true" data-act="edit" data-id="${f.id}">${text}</div>
    <div class="fchart">${drawChart(c, f, 760, 190)}</div>
    ${f.counterCheck ? `<div class="counter"><span class="cl">${I.warn} The engine's check on its own advice</span>${f.counterCheck}</div>` : ''}
    ${f.reco ? `<p class="reco">${f.reco}${money}</p>` : ''}
    ${f.caveats.length || f.grade === 'directional' ? `<p class="cav">${I.lock} ${[f.grade === 'directional' ? f.gradeWhy : null].concat(f.caveats).filter(Boolean).join(' ')}</p>` : ''}
    ${f.mustTravel ? `<p class="cav">${I.lock} ${f.mustTravel}</p>` : ''}
    <div class="ffoot">${provChip(c)}${gradeChip(f)}
      <div class="grow"></div>
      <button class="why" data-act="why" data-id="${f.id}">Why this one? ${I.chev}</button></div>
    ${S.openFinding === f.id ? vWhy(f) : ''}
  </article>`;
}

function vWhy(f) {
  const rows = [
    ['How big is the gap', (f.effect * 100).toFixed(0) + '% from the campaign average'],
    f.separation != null ? ['How clear of the next one', (f.separation * 100).toFixed(0) + '% clear of ' + shortName(f.runnerUp || '—')] : null,
    ['How much is behind it', f.baseKind === 'buyers' ? F.int(f.base) + ' attributed buyers' : F.compact(f.base) + ' ' + f.baseKind],
    ['Grade of evidence', f.grade === 'directional' ? 'Directional — ' + (f.gradeWhy || '') : 'Stands up on its own'],
    ['Score', f.score.toFixed(3) + (f.goalScore !== f.score ? ` → ${f.goalScore.toFixed(3)} for a ${docLabel().toLowerCase()}` : '')]
  ].filter(Boolean);
  return `<div class="why-panel"><table class="kv">${rows.map(r => `<tr><td>${r[0]}</td><td class="n">${r[1]}</td></tr>`).join('')}</table></div>`;
}

function vSetAside() {
  const r = S.run;
  const groups = {};
  r.rejected.forEach(f => f.rejections.forEach(x => { (groups[x.rule] = groups[x.rule] || []).push({ f, why: x.why }); }));
  const tabs = [['rejected', 'Did not hold up', r.rejected.length], ['dropped', 'Weaker or repeated', r.dropped.length], ['removed', 'You removed', S.archive.length]];
  let body;
  if (S.setAsideTab === 'rejected') {
    body = Object.keys(groups).map(rule => `<div class="sg"><h4>${rule}<span>${groups[rule].length}</span></h4>
      ${groups[rule].map(({ f, why }) => `<div class="sr"><div class="st">${f.title || f.type}${f.measureLabel ? `<em>on ${f.measureLabel.toLowerCase()}</em>` : ''}</div><div class="sw">${why}</div></div>`).join('')}</div>`).join('')
      || '<div class="empty">Nothing was rejected.</div>';
  } else if (S.setAsideTab === 'dropped') {
    body = `<div class="sg"><h4>Passed the tests, weaker than what was told<span>${r.dropped.length}</span></h4>
      ${r.dropped.map(f => `<div class="sr"><div class="st">${f.title || f.type}${f.measureLabel ? `<em>on ${f.measureLabel.toLowerCase()}</em>` : ''}</div><div class="sw">${f.dropped || 'Scored below the findings that were told.'} <span class="sc">score ${f.score.toFixed(3)}</span></div></div>`).join('')}</div>`;
  } else {
    body = S.archive.length ? `<div class="sg"><h4>Removed by you<span>${S.archive.length}</span></h4>
      ${S.archive.map(a => `<div class="sr"><div class="st">${a.f.title}<em>removed ${a.at}</em></div><div class="sw">${a.f.sentence.replace(/<[^>]+>/g, '')}</div>
        <button class="btn sm" data-act="restore" data-id="${a.f.id}">${I.plus} Put it back</button></div>`).join('')}</div>`
      : '<div class="empty">You have not removed anything. Nothing is ever deleted — what you remove lands here.</div>';
  }
  return `<section class="panel setaside">
    <div class="phead"><h2>What was set aside</h2><button class="btn sm" data-act="setaside">${I.x} Close</button></div>
    <div class="satabs">${tabs.map(([k, l, n]) => `<button class="chip ${S.setAsideTab === k ? 'on' : ''}" data-act="satab" data-k="${k}">${l} <span class="ord">${n}</span></button>`).join('')}</div>
    <p class="note">A leader must be <b>${(S.run.stats.threshold * 100).toFixed(0)}%</b> clear of the next slice to stand up, and <b>${(S.run.stats.threshold * 60).toFixed(0)}%</b> to be worth mentioning as directional. ${S.run.stats.cells} slices were examined.</p>
    ${body}</section>`;
}

/* ================================================================
   CAMPAIGN — step 3, the deck
================================================================ */
function vDeck() {
  const c = S.c, comp = S.comp;
  return `<div class="wrap">
    <button class="backlink" data-act="step" data-k="story">${I.back} Back to the story</button>
    <div class="deckbar">
      <div><h1 class="h2">${c.advertiser} · ${c.name}</h1>
        <p class="note">${comp.slides.length} slides from ${comp.stats.findings} findings${comp.stats.riders ? `, ${comp.stats.riders} sharing a page` : ''} · ${docLabel()} · for ${S.audience.toLowerCase()}</p></div>
      <div class="btnrow"><button class="btn" data-act="pdf">${I.dl} PDF</button>
        <button class="btn pri" data-act="pptx">${I.dl} PowerPoint</button></div>
    </div>
    <div class="deck">${comp.slides.map(s => vSlide(s, comp.slides.length)).join('')}</div>
  </div>`;
}
function riderStrip(s) {
  if (!s.riders || !s.riders.length) return '';
  return `<div class="riders">${s.riders.map(f => `<div class="rider">
    <div class="rv">${f.stat.v}</div><div class="rl2">${f.stat.l}</div>
    <div class="rs">${S.edits[f.id] != null ? S.edits[f.id] : f.sentence}</div></div>`).join('')}</div>`;
}
function vSlide(s, total) {
  const c = S.c;
  if (s.layout === 'cover') {
    const T = c.T;
    return `<div class="slide cover">
      <div><div class="lbl">${PROGRAM.retailer} Retail Media · ${docLabel()} · for ${S.audience.toLowerCase()}</div>
        <h2 class="big">${c.name}</h2>
        <p class="covnote">${CAMPAIGN_BY_ID[c.id].note}</p>
        <div class="covgrid">${[['Supplier', c.advertiser], ['Channel', c.kind], ['Flight', c.flight],
          ['Attribution window', c.windowDays + ' days, post-view and post-click'],
          ['Products in scope', c.productCount + ' promoted items'],
          ['Audiences', c.segments.join(', ')],
          ['Ad groups · ads', c.adgroupCount + ' · ' + c.adCount],
          ['Budget', F.money(c.budget) + ' booked, ' + F.money(T.spend) + ' spent']].map(k =>
          `<div><span class="lbl">${k[0]}</span><b>${k[1]}</b></div>`).join('')}</div></div>
      <div class="covfoot">${provChip(c)}<span class="note">Attributed, not incremental · ${c.maturity.toLowerCase()} · no control group, so nothing here says the ads caused the sales</span></div></div>`;
  }
  if (s.layout === 'method') {
    return `<div class="slide"><div class="sh"><h2>${s.title}</h2><span class="prov neutral">${I.lock} On every deck</span></div>
      <table class="dt"><tbody>${[
        ['Window', `${c.windowDays} days after a qualifying view or click. The IAB default is 30; ${PROGRAM.retailer} discloses ${c.windowDays}.`],
        ['Credit', 'Last touch — the last qualifying event before the purchase takes the sale.'],
        ['Buyers', c.provenance === 'measured' ? 'Loyalty shoppers, resolved through the identity map.' : 'Not available — the partner returns totals, not identities.'],
        ['New to brand', 'A buyer with no purchase of the brand in the twelve weeks before the flight.'],
        ['Products', c.products],
        ['Numbers from', c.provenance === 'measured' ? 'We matched each exposure to a till or web receipt.' : 'Partner-reported totals, shown as received and never blended with ours.'],
        ['Maturity', `${c.maturity} — the window closes ${c.windowCloses}.`],
        ['Not claimed', 'No lift, no incrementality, no cannibalisation. Those need a group held back before the flight starts.']
      ].map(r => `<tr><td style="width:22%"><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join('')}</tbody></table>
      ${s.findings.map(f => `<p class="ins meth">${S.edits[f.id] != null ? S.edits[f.id] : f.sentence}</p>`).join('')}
      <div class="src">${srcLine(c, s.no, total)}</div></div>`;
  }
  if (s.layout === 'actions') {
    return `<div class="slide"><div class="sh"><h2>${s.title}</h2></div>
      <ol class="recos">${s.findings.map(f => `<li><b>${f.title}.</b> ${f.reco}</li>`).join('')}
        <li class="holdout"><b>Answer the incrementality question properly.</b> A hold-out group on the next flight costs about 5% of reach and answers whether the ads caused the sales. We can set it up before the next booking.</li></ol>
      <div class="src">${srcLine(c, s.no, total)}</div></div>`;
  }
  if (s.layout === 'pair') {
    return `<div class="slide"><div class="sh"><h2>${s.title}</h2>${provChip(c)}</div>
      <div class="pairgrid">${s.findings.map(f => `<div class="pairhalf"><h3>${f.title}</h3>
        <div class="chartbox">${drawChart(c, f, 330, 150)}</div>
        <p class="ins">${S.edits[f.id] != null ? S.edits[f.id] : f.sentence}</p></div>`).join('')}</div>
      ${riderStrip(s)}<div class="src">${srcLine(c, s.no, total)}</div></div>`;
  }
  const f = s.findings[0];
  return `<div class="slide"><div class="sh"><h2>${s.title}</h2>${provChip(c)}</div>
    <div class="scols"><div><p class="ins">${S.edits[f.id] != null ? S.edits[f.id] : f.sentence}</p>
      ${f.reco ? `<p class="ins reco-s"><b>Recommendation.</b> ${f.reco}</p>` : ''}
      ${f.counterCheck ? `<p class="ins counter-s">${f.counterCheck}</p>` : ''}</div>
      <div>${drawChart(c, f, 440, s.layout === 'hero' ? 215 : 190)}</div></div>
    ${riderStrip(s)}<div class="src">${srcLine(c, s.no, total)}</div></div>`;
}

/* ================================================================
   EXPLORE — metric sets, not 57 columns
================================================================ */
const METRIC_SETS = {
  core:      { label: 'Core', m: ['impressions', 'clicks', 'ctr', 'buyers', 'sales', 'roas'] },
  growth:    { label: 'Growth', m: ['buyers', 'newBuyers', 'lapsedBuyers', 'newShare', 'cpNewBuyer', 'sales'] },
  efficiency:{ label: 'Efficiency', m: ['spend', 'cpm', 'cpBuyer', 'cpNewBuyer', 'roas', 'sales'] },
  basket:    { label: 'Basket', m: ['buyers', 'txns', 'units', 'salesPerBuyer', 'avgTxn', 'pricePerUnit'] },
  scope:     { label: 'Direct and halo', m: ['sales', 'directSales', 'haloSales', 'buyers', 'units'] }
};
function vExplore() {
  const d = S.deep;
  const measures = d.measures || METRIC_SETS[d.set].m;
  const rows = filterFacts(filt());
  const g = groupBy2(rows, d.dims);
  g.sort((a, b) => ((b[d.sortKey] || 0) - (a[d.sortKey] || 0)) * (d.sortDir < 0 ? 1 : -1));
  const shown = g.slice(0, d.limit);
  const T = total(rows);
  return `<div class="wrap">
    <section class="panel">
      <div class="phead"><div><h2>Explore</h2><div class="note">${g.length.toLocaleString('en-GB')} rows at this grain · showing ${shown.length}. Click a row for every measure.</div></div>
        <div class="weekpick"><select data-act="wk" data-k="weekFrom">${WEEKS.map(w => `<option value="${w.id}" ${S.weekFrom === w.id ? 'selected' : ''}>${w.label}</option>`).join('')}</select>
          <span class="to">to</span>
          <select data-act="wk" data-k="weekTo">${WEEKS.map(w => `<option value="${w.id}" ${S.weekTo === w.id ? 'selected' : ''}>${w.label}</option>`).join('')}</select></div>
      </div>
      <div class="chooser">
        <div><span class="lbl">Rows</span><div class="chips">${DIM_DEFS.map(x =>
          `<button class="chip ${d.dims.includes(x.key) ? 'on' : ''}" data-act="dim" data-k="${x.key}">${x.label}${d.dims.includes(x.key) ? `<span class="ord">${d.dims.indexOf(x.key) + 1}</span>` : ''}</button>`).join('')}</div></div>
        <div><span class="lbl">Columns — pick a set, or build your own (8 maximum)</span>
          <div class="chips">${Object.keys(METRIC_SETS).map(k =>
            `<button class="chip set ${!d.measures && d.set === k ? 'on' : ''}" data-act="mset" data-k="${k}">${METRIC_SETS[k].label}</button>`).join('')}
            <span class="sep2"></span>
            ${Object.keys(MEASURE_DEFS).map(k => `<button class="chip tiny ${measures.includes(k) ? 'on' : ''}" data-act="meas" data-k="${k}" title="${MEASURE_DEFS[k].label}">${MEASURE_DEFS[k].label}</button>`).join('')}</div>
          </div>
      </div>
      <div class="tw"><table class="dt sticky">
        <thead><tr>${d.dims.map(k => `<th>${DIM_DEFS.find(x => x.key === k).label}</th>`).join('')}
          ${measures.map(k => `<th class="n sortable ${d.sortKey === k ? 'sorted' : ''}" data-act="sort2" data-k="${k}">${MEASURE_DEFS[k].label}${d.sortKey === k ? (d.sortDir < 0 ? ' ▾' : ' ▴') : ''}</th>`).join('')}</tr></thead>
        <tbody>
          <tr class="tot">${d.dims.map((k, i) => `<td>${i === 0 ? '<b>Total</b>' : ''}</td>`).join('')}${measures.map(k => `<td class="n"><b>${MEASURE_DEFS[k].fmt(T[k])}</b></td>`).join('')}</tr>
          ${shown.map((r, i) => `<tr class="clickable ${d.detail === i ? 'sel' : ''}" data-act="detail" data-i="${i}">
            ${d.dims.map(k => `<td>${r[k]}</td>`).join('')}${measures.map(k => `<td class="n">${MEASURE_DEFS[k].fmt(r[k])}</td>`).join('')}</tr>
            ${d.detail === i ? `<tr class="detailrow"><td colspan="${d.dims.length + measures.length}">
              <div class="detailgrid">${Object.keys(MEASURE_DEFS).map(k => `<div><span class="lbl">${MEASURE_DEFS[k].label}</span><b>${MEASURE_DEFS[k].fmt(r[k])}</b></div>`).join('')}</div></td></tr>` : ''}`).join('')}
        </tbody></table></div>
      <div class="deepfoot">
        ${g.length > d.limit ? `<button class="btn sm" data-act="more">Show 30 more</button>` : '<span class="note">All rows shown.</span>'}
        <button class="btn sm" data-act="csv">${I.dl} Export every measure</button>
        <span class="note">The screen is for deciding and the export is for auditing: the file carries all ${Object.keys(MEASURE_DEFS).length} measures, whatever is on screen. Buyers do not add up across rows — a shopper reached twice is one buyer in each.</span>
      </div>
    </section>
  </div>`;
}

/* ---------- modal ---------- */
function vModal() {
  if (!S.modal) return '';
  if (S.modal === 'holdout') {
    return `<div class="scrim" data-act="closemodal"><div class="sheet">
      <h3>Request a hold-out on the next flight</h3>
      <p class="note">This is the only way to answer "did the ads cause the sales". A group of shoppers is held back before the campaign starts — about 5% of reach — and the answer lands roughly four weeks after the flight ends.</p>
      <div class="holdgrid">${[['Cost to the supplier', 'About 5% of reach, no extra fee'],
        ['When the answer lands', 'Four weeks after the flight ends'],
        ['What it unlocks', 'Incremental sales, incremental ROAS, cannibalisation, the full decomposition'],
        ['What has to happen', 'The hold-out is drawn before the audience is exported. It cannot be added later.']].map(x =>
        `<div><span class="lbl">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>
      <div class="mfoot"><div class="note">A line is added to the actions slide of this deck.</div>
        <button class="btn pri" data-act="closemodal">Add it to the deck</button></div></div></div>`;
  }
  const c = S.c;
  return `<div class="scrim" data-act="closemodal"><div class="sheet">
    <h3>${c.name.replace(/[^A-Za-z0-9]+/g, '_')}.pptx</h3>
    <p class="note">In the shipped product this writes a native PowerPoint — real text boxes, real tables, vector charts. Here it is the manifest the Composer produced.</p>
    <ol class="manifest">${S.comp.slides.map(s => `<li><b>${s.title}</b><span class="mlay">${s.layout}${s.riders && s.riders.length ? ` · ${s.riders.length} sharing the page` : ''}</span></li>`).join('')}</ol>
    <div class="mfoot"><div class="note">${docLabel()} · for ${S.audience.toLowerCase()} · printed on the cover and every footer</div>
      <button class="btn pri" data-act="closemodal">Close</button></div></div></div>`;
}

/* ---------- render ---------- */
function render() {
  let v;
  if (S.place === 'program') v = vProgram();
  else if (S.place === 'explore') v = vExplore();
  else if (!S.c) { S.place = 'program'; v = vProgram(); }
  else v = S.step === 'brief' ? vBrief() : S.step === 'story' ? vStory() : vDeck();
  document.getElementById('app').innerHTML = vHeader() + v + vModal();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;
  const go = () => { render(); window.scrollTo(0, 0); };
  if (a === 'place') { if (el.dataset.k === 'campaign' && !S.c) return; S.place = el.dataset.k; go(); }
  else if (a === 'step') { S.step = el.dataset.k; go(); }
  else if (a === 'open') { if (e.target.closest('input')) return; loadCampaign(el.dataset.id); S.place = 'campaign'; S.step = 'brief'; go(); }
  else if (a === 'cmp') { const id = el.dataset.id; S.compare = S.compare.includes(id) ? S.compare.filter(x => x !== id) : S.compare.concat(id); render(); }
  else if (a === 'clearcmp') { S.compare = []; render(); }
  else if (a === 'doctype') { S.docType = el.dataset.k; rebuild(); render(); }
  else if (a === 'aud') { S.audience = el.dataset.k; render(); }
  else if (a === 'sign') { S.signed = !S.signed; render(); }
  else if (a === 'buildstory') { if (!S.signed) return; S.step = 'story'; go(); }
  else if (a === 'holdout') { S.modal = 'holdout'; render(); }
  else if (a === 'drill') { S.drill = [el.dataset.id]; render(); }
  else if (a === 'undrill') { S.drill = S.drill.slice(0, +el.dataset.i); render(); }
  else if (a === 'setaside') { S.setAside = !S.setAside; render(); }
  else if (a === 'satab') { S.setAsideTab = el.dataset.k; render(); }
  else if (a === 'remove') {
    const f = S.run.story.find(x => x.id === el.dataset.id);
    S.removed[f.id] = true;
    S.archive.unshift({ f, at: new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) });
    S.comp = compose(story(), S.c, S.docType); render();
  }
  else if (a === 'restore') {
    delete S.removed[el.dataset.id];
    S.archive = S.archive.filter(x => x.f.id !== el.dataset.id);
    S.comp = compose(story(), S.c, S.docType); render();
  }
  else if (a === 'why') { S.openFinding = S.openFinding === el.dataset.id ? null : el.dataset.id; render(); }
  else if (a === 'dim') {
    const k = el.dataset.k, d = S.deep;
    if (d.dims.includes(k)) { if (d.dims.length > 1) d.dims = d.dims.filter(x => x !== k); }
    else if (d.dims.length < 4) d.dims.push(k);
    d.detail = null; render();
  }
  else if (a === 'mset') { S.deep.set = el.dataset.k; S.deep.measures = null; render(); }
  else if (a === 'meas') {
    const d = S.deep, cur = d.measures || METRIC_SETS[d.set].m.slice();
    const k = el.dataset.k;
    if (cur.includes(k)) { if (cur.length > 1) d.measures = cur.filter(x => x !== k); }
    else if (cur.length < 8) d.measures = cur.concat(k);
    render();
  }
  else if (a === 'sort2') { if (S.deep.sortKey === el.dataset.k) S.deep.sortDir *= -1; else { S.deep.sortKey = el.dataset.k; S.deep.sortDir = -1; } render(); }
  else if (a === 'detail') { S.deep.detail = S.deep.detail === +el.dataset.i ? null : +el.dataset.i; render(); }
  else if (a === 'more') { S.deep.limit += 30; render(); }
  else if (a === 'csv') exportCsv();
  else if (a === 'pptx') { S.modal = 'pptx'; render(); }
  else if (a === 'closemodal') { S.modal = null; render(); }
  else if (a === 'pdf') { S.step = 'deck'; render(); setTimeout(() => window.print(), 80); }
});

document.addEventListener('change', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.act === 'wk') { S[el.dataset.k] = el.value; S.deep.detail = null; render(); }
  else if (el.dataset.act === 'sort') { S.sortBy = el.value; render(); }
  else if (el.dataset.act === 'drillmeasure') { S.drillMeasure = el.value; render(); }
});
document.addEventListener('blur', e => {
  const el = e.target.closest ? e.target.closest('[data-act="edit"]') : null;
  if (el) S.edits[el.dataset.id] = el.innerHTML;
}, true);

async function exportCsv() {
  const rows = filterFacts(filt()), d = S.deep;
  const g = groupBy2(rows, d.dims);
  const keys = Object.keys(MEASURE_DEFS);
  const head = [...d.dims.map(k => DIM_DEFS.find(x => x.key === k).label), ...keys.map(k => MEASURE_DEFS[k].label)];
  const body = g.map(r => [...d.dims.map(k => `"${String(r[k]).replace(/"/g, '""')}"`), ...keys.map(k => r[k] == null ? '' : Math.round(r[k] * 1000) / 1000)].join(','));
  const csv = head.join(',') + '\n' + body.join('\n');
  try {
    const dl = window.claude && claude.use ? await claude.use('downloads') : null;
    if (dl) { await dl.save({ filename: 'retail_media_explore.csv', data: csv }); return; }
  } catch (err) { /* declined or unavailable */ }
  const a2 = document.createElement('a');
  a2.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a2.download = 'retail_media_explore.csv'; a2.click();
  setTimeout(() => URL.revokeObjectURL(a2.href), 2000);
}

render();
</script>
</body>
